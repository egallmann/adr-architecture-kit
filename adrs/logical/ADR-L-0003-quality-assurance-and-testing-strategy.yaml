notes: "Testing strategy implementation:\n\nTest organization:\n```\ntests/\n  test_scope_resolver.py\
  \      # Unit + integration tests for scope detection\n  test_adr_validator.py \
  \       # Unit tests for validation logic\n  test_multi_scope_generator.py # Integration\
  \ tests for scoped generation\n  test_manifest_generator.py   # Unit tests for manifest\
  \ generation\n  test_markdown_generator.py   # Unit tests for view generation\n\
  \  test_schema_validation.py    # Schema validation correctness\n```\n\nTest execution:\n\
  ```bash\n# Standard local governance bundle\nadr governance-checks\n\n# Strict contract\
  \ gate\nadr validate-contract --contract-profile greenfield\n\n# Ratcheted brownfield\
  \ contract gate\nadr validate-contract --contract-profile brownfield --max-sentinel-fields\
  \ 0 --max-non-complete-entities 0\n\n# Generated artifact integrity (manifest +\
  \ rendered ADR markdown)\nadr validate-generated-docs\n\n# Generated system overview\
  \ integrity\nadr validate-system-overview\n\n# PROJECT.yaml integrity\nadr validate-project-metadata\n\
  \n# Targeted pytest usage for local development\npytest tests/ -v\npytest tests/\
  \ --cov=adr_kit --cov-report=html --cov-report=term --cov-fail-under=80\npytest\
  \ tests/ -k \"scope\" -v\n```\n\nCI/CD integration (orthogonal evidence axes):\n\
  - Canonical correctness: Ubuntu + Python 3.12 runs the complete suite with coverage\
  \ (`--cov=adr_kit --cov-fail-under=80`) exactly once\n- Python-version compatibility:\
  \ Ubuntu runs focused source/install/SDK compatibility on Python 3.11–3.14 (not\
  \ a second full suite on each interpreter)\n- OS behavior / source-runtime portability:\
  \ Windows and macOS at Python 3.12 each run the complete suite (no coverage gate);\
  \ Ubuntu 3.12 suite is owned by the coverage job and is not duplicated\n- Retained-wheel\
  \ Python compatibility: exact retained wheel via `scripts/test_installed_wheel.py`\
  \ on Ubuntu Python 3.11–3.14\n- Retained-wheel OS portability: the exact same retained\
  \ wheel via `scripts/test_installed_wheel.py` on Windows and macOS at Python 3.12;\
  \ the wheel MUST NOT be rebuilt per OS\n- These axes are orthogonal and MUST NOT\
  \ imply that all supported Python versions execute on every OS\n- Linux-only execution\
  \ is insufficient evidence for an OS-agnostic package claim\n- PR qualification\
  \ = proposed-change evidence; develop qualification = integration evidence; only\
  \ a successful completed `push` of ADR Governance on `main` for the exact tagged\
  \ SHA is release-eligible; tag publication is promotion/identity verification only\n\
  - `adr governance-checks --skip-tests` must pass in CI when the complete suite is\
  \ already owned by the coverage job\n- `adr validate-generated-docs` must pass for\
  \ manifest and rendered ADR output\n- `adr validate-system-overview` must pass for\
  \ `SYSTEM-OVERVIEW.md`\n- `adr validate-project-metadata` must pass for `PROJECT.yaml`\n\
  - Quality gates are broader than generic `pytest` alone because they also enforce\n\
  \  contract, generated-artifact, and project-metadata integrity\n- Verified implementation\
  \ slices must be committed at meaningful boundaries in\n  alignment with `INV-0096`\n\
  - Release artifacts are built once, retained, installed in clean environments,\n\
  \  manifested, re-verified, and promoted without rebuilding\n- Ruff, strict-mypy,\
  \ and Black legacy debt is governed by no-regression ratchets;\n  new Phase 0 Python\
  \ files must be clean under all three tools\n\nFuture enhancements:\n- Property-based\
  \ testing (hypothesis) for generators\n- Mutation testing to verify test quality\n\
  - Performance benchmarks to detect regressions\n- Contract testing for API stability\n"
