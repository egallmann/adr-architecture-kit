name: Verified Source-Built WASM

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit SHA.
        required: true
        type: string
    outputs:
      source_commit:
        description: Full commit SHA of the source checked by this workflow.
        value: ${{ jobs.semantic-core-wasm.outputs.source_commit }}

jobs:
  semantic-core-wasm:
    name: Build and verify source-built WASM
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}
      - name: Verify exact source commit
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source_ref }}
        run: |
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          commit="$(git rev-parse HEAD)"
          [[ "$commit" == "$EXPECTED_SOURCE" ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Semantic-core source commit: $commit"
      - name: Read repository Rust toolchain authority
        id: rust-toolchain
        shell: bash
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          [[ -n "$channel" ]]
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # toolchain: stable; 2026-10-16
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Smoke-test the tracked artifact before source build
        run: node scripts/check_tracked_semantic_core.mjs
      - name: Build WASM without changing tracked host copies
        run: node scripts/build_semantic_core.mjs --artifact-only
      - name: Create UNQUALIFIED Windows-developer bootstrap bundle
        run: >-
          python scripts/semantic_core_artifact_bundle.py create-bootstrap
          --artifact core/target/wasm32-unknown-unknown/release/adr_kit_semantic_core.wasm
          --output-dir "${{ runner.temp }}/semantic-core-bootstrap"
          --source-commit "${{ steps.source.outputs.commit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-core-bootstrap-${{ steps.source.outputs.commit }}
          path: ${{ runner.temp }}/semantic-core-bootstrap/
          if-no-files-found: error
          retention-days: 7
      - name: Guard semantic-core source and tracked artifacts against this build
        run: >-
          python scripts/check_semantic_core_artifact_change.py
          --built-artifact core/target/wasm32-unknown-unknown/release/adr_kit_semantic_core.wasm
      - name: Verify source-built artifact against all host copies
        run: python scripts/verify_semantic_core_artifact.py
      - name: Bundle verified source-built WASM
        run: >-
          python scripts/semantic_core_artifact_bundle.py create
          --artifact core/target/wasm32-unknown-unknown/release/adr_kit_semantic_core.wasm
          --output-dir "${{ runner.temp }}/semantic-core-artifact"
          --source-commit "${{ steps.source.outputs.commit }}"
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-core-${{ steps.source.outputs.commit }}
          path: ${{ runner.temp }}/semantic-core-artifact/
          if-no-files-found: error
          retention-days: 1
