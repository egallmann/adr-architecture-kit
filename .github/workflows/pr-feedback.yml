name: PR Feedback

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-rust:
    uses: ./.github/workflows/semantic-core-native.yml
    with:
      source_ref: ${{ github.sha }}

  semantic-core-wasm:
    uses: ./.github/workflows/semantic-core-wasm.yml
    with:
      source_ref: ${{ github.sha }}

  python-semantic:
    name: Python semantic/source contracts
    permissions:
      contents: read
      pull-requests: read
      actions: read
    needs: semantic-core-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: semantic-core-${{ github.sha }}
          path: semantic-core-artifact
      - name: Install verified source-built WASM for this commit
        run: >-
          python scripts/semantic_core_artifact_bundle.py consume
          --bundle-dir semantic-core-artifact
          --source-commit "${{ github.sha }}"
      - run: python scripts/verify_semantic_core_artifact.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - name: Enforce capability-based repository naming
        run: python scripts/check_repository_naming.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - name: Run the developer/TDD fast suite
        run: python -m pytest -m fast --durations=10
      - name: Run explicit semantic/source test collection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_pr_feedback.py
      - name: Exercise portable source/SDK compatibility harness
        run: python scripts/run_source_compat.py

  typescript-consumer:
    name: TypeScript consumer binding
    needs: semantic-core-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: semantic-core-${{ github.sha }}
          path: semantic-core-artifact
      - name: Install verified source-built WASM for this commit
        run: >-
          python scripts/semantic_core_artifact_bundle.py consume
          --bundle-dir semantic-core-artifact
          --source-commit "${{ github.sha }}"
      - run: python scripts/verify_semantic_core_artifact.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: npm ci
        working-directory: packages/node
      - run: npm run build
        working-directory: packages/node
      - run: npm run typecheck
        working-directory: packages/node
      - run: npm test
        working-directory: packages/node
      - name: Consumer binding contract conformance
        run: python -m pytest -q tests/test_consumer_binding_conformance.py tests/test_consumer_binding_vocabulary_versions.py
      - run: npm run browser:check
        working-directory: packages/node

  governance:
    name: Governance and generated artifacts
    needs: semantic-core-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: semantic-core-${{ github.sha }}
          path: semantic-core-artifact
      - name: Install verified source-built WASM for this commit
        run: >-
          python scripts/semantic_core_artifact_bundle.py consume
          --bundle-dir semantic-core-artifact
          --source-commit "${{ github.sha }}"
      - run: python scripts/verify_semantic_core_artifact.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - name: Enforce capability-based repository naming
        run: python scripts/check_repository_naming.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: adr repair-canonical-ids --check
      - run: adr governance-checks --skip-tests
      - run: adr validate-generated-docs
      - run: adr validate-system-overview

  quality-ratchets:
    name: Ruff / mypy / Black no-regression ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python scripts/check_quality_ratchets.py

  assurance:
    name: Required assurance results
    if: ${{ always() }}
    needs: [native-rust, semantic-core-wasm, python-semantic, typescript-consumer, governance, quality-ratchets]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful qualification of the exact source
        shell: bash
        env:
          REQUIRED_SUCCEEDED: >-
            ${{ needs.native-rust.result == 'success'
                && needs.semantic-core-wasm.result == 'success'
                && needs.python-semantic.result == 'success'
                && needs.typescript-consumer.result == 'success'
                && needs.governance.result == 'success'
                && needs.quality-ratchets.result == 'success' }}
          SOURCE_MATCH: >-
            ${{ needs.native-rust.outputs.source_commit == github.sha
                && needs.semantic-core-wasm.outputs.source_commit == github.sha }}
        run: |
          test "$REQUIRED_SUCCEEDED" = true
          test "$SOURCE_MATCH" = true
