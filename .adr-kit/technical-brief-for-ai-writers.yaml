sample_narratives:
  narrative_1_introduction:
    hook: "Architecture documentation is broken. Developers write YAML by hand, docs drift from reality, and AI can't reason over unstructured text."
    
    problem: |
      Traditional approach:
      - Humans write YAML manually (2-4 hours per ADR)
      - Syntax errors, schema violations, incomplete specs
      - Documentation quickly outdated
      - AI can't validate or generate code from ambiguous docs
    
    solution: |
      ADR Kit is a conversation compiler. Humans describe systems naturally,
      AI compiles conversation into complete, validated, executable ADRs.
      
      Time to create ADR: 15 minutes (vs 2-4 hours)
      Completeness: 95%+ (vs 60% manual)
      Cost: $0.10 per ADR (vs $3 for GPT-4 only)
    
    impact: |
      Architecture becomes conversational. No YAML writing, no syntax learning.
      Just describe what you want to build, and the system captures it as
      structured specifications that AI can reason over and implement from.
  
  narrative_2_composability:
    hook: "Technology migrations are risky. Big bang rewrites take 12-18 months and often fail."
    
    problem: |
      Traditional approach:
      - Rewrite entire system in new technology
      - High risk (everything changes at once)
      - Long timeline (months to years)
      - Often abandoned mid-rewrite
    
    solution: |
      Composable architecture through interface preservation. Create new
      Physical-Component ADR that supersedes old, preserving interface contract.
      
      Example: Migrate Node.js API to Rust
      - Create ADR-PC-0087 (Rust) with identical REST API
      - Deploy alongside ADR-PC-0023 (Node.js)
      - Route traffic gradually (10% → 50% → 100%)
      - Deprecate old implementation
    
    impact: |
      Migration time: 4 weeks per component (vs 12-18 months big bang)
      Cost: $20K-40K per component (vs $500K-1M full rewrite)
      Risk: Low (one component at a time, rollback capability)
      
      12x faster, 10x cheaper, 95% less risk.
  
  narrative_3_legacy_onboarding:
    hook: "Organizations have 10+ years of undocumented code. Manual documentation takes 40 hours per system."
    
    problem: |
      Adoption barrier: Existing systems need ADRs to use ADR Kit.
      Manual documentation: 40 hours per system (too painful).
      Result: Organizations don't adopt.
    
    solution: |
      Legacy Import Agent reverse engineers existing systems through
      trust-first validation:
      - AI scans code (5 minutes)
      - AI infers design (10 minutes)
      - AI classifies: 90% safe/compliant (auto-accept), 10% risky (validate)
      - Human validates risky code only (1 hour)
      - AI refines ADRs (10 minutes)
      
      Total: 2 hours (vs 40 hours manual)
    
    impact: |
      Removes adoption barrier. Organizations can onboard quickly.
      
      Fast onboarding → More adoptions → More systems in ADR format →
      More value from ecosystem (composability, compliance, providers)
      
      Legacy Import Agent is the "on-ramp" to the entire ecosystem.

technical_specifications:
  adr_types:
    - type: "Logical (ADR-L)"
      purpose: "Capabilities, boundaries, contracts (what system must be)"
      example: "ADR-L-0042: User Management Capability"
    
    - type: "Physical-System (ADR-PS)"
      purpose: "High-level system architecture (components, topology)"
      example: "ADR-PS-0012: User Service System"
    
    - type: "Physical-Component (ADR-PC)"
      purpose: "Executable specification for AI code generation"
