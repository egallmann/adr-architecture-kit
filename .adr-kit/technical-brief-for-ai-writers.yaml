technical_architecture:
  storage_format:
    current: "YAML files (STE-compliant)"
    rationale: "ADR-L-0001 (STE-Compliant ADR System) is constitutional foundation"
    graph_database: "STE semantic graph (bi-directional boundary tree)"
    
    why_yaml:
      - "STE compliance (PRIME-1, SYS-2, SYS-4 invariants)"
      - "Integration with ste-runtime (RECON extraction)"
      - "Human-readable (when needed for debugging)"
      - "Git-friendly (text diffs, version control)"
    
    why_ste_semantic_graph:
      architecture: "Bi-directional boundary tree"
      key_property: "Converges on relevant subgraph of insertion point"
      benefit: "Consistently rich and accurate context"
      
      query_model:
        traditional_graph: "Point queries (find definition, find references)"
        ste_graph: "Subgraph assembly (complete context for task)"
        advantage: "O(1) semantic lookups vs O(n) text scans"
      
      example_query:
        query: "Get context for implementing ADR-PC-0042"
        traditional: "grep for ADR-PC-0042, read files, grep for dependencies, repeat"
        ste_graph: "One query returns complete subgraph (ADR + code + dependencies + invariants)"
        time: "<100ms (vs minutes of manual searching)"
      
      why_better_than_alternatives:
        vs_lsp: "LSP provides per-file analysis, STE provides cross-project graph"
        vs_tree_sitter: "tree-sitter provides syntax trees, STE provides semantic relationships"
        vs_embeddings: "Embeddings provide similarity, STE provides explicit relationships"
        vs_traditional_graph_db: "STE optimizes for AI context assembly, not point queries"
    
    hybrid_approach:
      layer_1: "YAML files (source of truth, git-tracked)"
      layer_2: "STE semantic graph (queryable, relationship traversal)"
      layer_3: "Embeddings (semantic search, natural language queries)"
      
      workflow: |
        1. Human conversation → AI generates ADR YAML
        2. RECON extracts ADR into semantic graph
        3. AI queries graph for context (not YAML files)
        4. Graph returns relevant subgraph (ADRs + code + dependencies)
        5. AI reasons over structured graph, not unstructured text
  
  schema_design_philosophy:
    optimization_target: "AI reasoning, not human writing"
    
    key_fields_for_ai:
      generation_context:
        purpose: "AI prompt template for code generation"
        fields: ["purpose", "key_responsibilities", "constraints"]
        example: |
          generation_context:
            purpose: "REST API for user management with authentication"
            key_responsibilities:
              - "User CRUD operations"
              - "JWT-based authentication"
              - "Rate limiting: 100 req/min per user"
      
      conversation_metadata:
        purpose: "Preserve decision history from conversation"
        fields: ["creation_method", "human_decisions", "gaps_resolved"]
        example: |
          conversation_metadata:
            creation_method: ai_interview
            human_decisions:
              - question: "Authentication strategy?"
                decision: "JWT with 1-hour expiry"
                rationale: "Balance security and UX"
      
      implementation_requirements:
        purpose: "Complete specification for autonomous code generation"
        fields: ["algorithms", "error_handling", "observability", "testing_requirements"]
        completeness_rule: "If AI needs clarification during generation, ADR is incomplete"
  
  agent_architecture:
    architecture_agent:
      role: "Interviews human, captures decisions"
      technology: "Local 13B model (Llama, Mistral)"
      cost: "$0 per ADR (local inference)"
      speed: "1-2s per response"
    
    watchdog_agent:
      role: "Monitors ADR updates, infers missing details"
      technology: "Local 13B model + rules library"
      triggers: "ADR created or updated"
      inference: "Technology stack, frameworks, libraries (from context)"
    
    validation_agent:
      role: "Validates final ADR for logical consistency"
      technology: "Foundation model (GPT-4, Claude, o1)"
      cost: "$0.10 per ADR (only used once)"
      accuracy: "95%+ (catches subtle issues)"
    
    cost_breakdown:
      architecture_agent: "$0 (local)"
      watchdog_agent: "$0 (local)"
      validation_agent: "$0.10 (foundation model)"
      total: "$0.10 per ADR (vs $3 for GPT-4 only)"

code_examples:
  example_1_physical_component_adr:
    description: "Complete executable specification for AI code generation"
    
    code: |
      id: ADR-PC-0023
      adr_type: physical-component
      title: "User Service API Component"
      
      implements_system: [ADR-PS-0012]
      implements_logical: [ADR-L-0042]
      
      # AI PROMPT TEMPLATE
      component_specifications:
        - id: COMP-0001
          name: "User Service API"
          
          generation_context:
            purpose: "REST API for user management with authentication"
            key_responsibilities:
              - "User CRUD operations"
              - "JWT-based authentication"
              - "Rate limiting per user"
          
          # INTERFACE CONTRACT (AI must implement exactly)
          interfaces:
            - id: IFACE-0001
              type: REST
              specification: |
                GET /users → List users (paginated)
                POST /users → Create user
                GET /users/:id → Get user details
                PUT /users/:id → Update user
                DELETE /users/:id → Delete user
          
          # COMPLETE IMPLEMENTATION REQUIREMENTS
          implementation_requirements:
            algorithms:
              - name: "Password Hashing"
                specification: "bcrypt, cost factor 12"
                rationale: "OWASP recommendation for 2026"
              
              - name: "JWT Token Generation"
                specification: |
                  Algorithm: RS256
                  Expiry: 1 hour
                  Refresh token: 7 days
                  Claims: {sub, iat, exp, roles}
            
            error_handling:
              strategy: "Structured error responses with correlation IDs"
              error_types:
                - type: ValidationError
                  http_status: 400
                  response_format: "RFC 7807 Problem Details"
                - type: AuthenticationError
                  http_status: 401
                  response_format: "RFC 7807 Problem Details"
            
            observability:
              logging:
                level: info
                structured: true
                correlation_id: true
              metrics:
                - name: request_duration_seconds
                  type: histogram
                - name: authentication_failures_total
                  type: counter
            
            testing_requirements:
              unit_test_coverage: ">= 80%"
              integration_tests: "All endpoints with auth scenarios"
              contract_tests: "OpenAPI contract validation"
      
      # CONVERSATION HISTORY
      conversation_metadata:
        creation_method: ai_interview
        human_decisions:
          - question: "Authentication strategy?"
            decision: "JWT with 1-hour expiry"
            rationale: "Balance security and UX"
          - question: "Rate limiting?"
            decision: "100 req/min per user"
            rationale: "Prevent abuse, allow normal usage"
    
    ai_usage: |
      AI reads this ADR and has everything needed to generate production code:
      - What to build (purpose, responsibilities)
      - How to build it (algorithms, error handling)
      - How to test it (testing requirements)
      - How to observe it (logging, metrics)
      - Why decisions were made (conversation metadata)
  
  example_2_interface_compatibility:
    description: "Technology migration with interface preservation"
    
    code: |
      # Original implementation (Node.js)
      id: ADR-PC-0023
      title: "User Service API (Node.js)"
      technology_stack:
        - category: language
          name: Node.js
      
      # New implementation (Rust)
      id: ADR-PC-0087
      title: "User Service API (Rust)"
      supersedes: ADR-PC-0023
      
      interface_compatibility:
        contract_preservation: true
        breaking_changes: []
        migration_strategy: strangler_fig
        rollback_plan: "Route traffic back to ADR-PC-0023"
      
      component_specifications:
        interfaces:
          - name: "User API"
            type: REST
            endpoints:
              - "GET /users (IDENTICAL to ADR-PC-0023)"
              - "POST /users (IDENTICAL to ADR-PC-0023)"
            compatibility: "100% compatible with ADR-PC-0023"
      
      technology_stack:
        - category: language
          name: Rust
          version: "1.75+"
          rationale: "10x performance improvement"
    
    deployment: |
      1. Deploy ADR-PC-0087 alongside ADR-PC-0023
      2. Route 10% traffic to Rust implementation
      3. Monitor: performance, errors, latency
      4. If metrics good: 50% traffic
      5. If metrics good: 100% traffic
      6. Deprecate ADR-PC-0023
  
  example_3_code_decorators:
    description: "Explicit intent markers linking code to ADRs"
    
    code: |
      # Python example
      from adr_kit import adr_implements, adr_invariant, adr_algorithm
      
      @adr_implements("ADR-PC-0042", "user-service", "authentication-api")
      @adr_algorithm("ADR-PC-0042", "jwt-validation")
      def authenticate_user(token: str) -> User:
          """Authenticate user via JWT token."""
          
          @adr_invariant("INV-001", "Token expiry must be <= 15 minutes")
          def validate_expiry():
              return token.expiry_minutes <= 15
          
          if not validate_expiry():
              raise AuthenticationError("Token expired")
          
          # Implementation...
    
    extraction: |
      RECON extracts decorators into EDR:
      - Function authenticate_user implements ADR-PC-0042
      - Uses jwt-validation algorithm
      - Enforces INV-001 invariant
    
    surgical_review: |
      Query: "Find all code related to security-audit signal"
      
      Semantic graph returns:
      - authenticate_user() (implements ADR-PC-0042, security tag)
      - validate_expiry() (enforces INV-001, security invariant)
      - encrypt_password() (implements ADR-PC-0042, password-hashing algorithm)
      
      Result: 500 lines (vs 10,000 lines total)
      Review time: 1 day (vs 1-2 weeks)

