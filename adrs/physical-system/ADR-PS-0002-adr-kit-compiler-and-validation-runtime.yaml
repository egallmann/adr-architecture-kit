system_boundaries:
- id: SYSBOUND-0002
  name: Authoring, Validation, and Canonical Semantic Execution Boundary
  description: 'Encapsulates host-side source acquisition and compiler orchestration,
    canonical Rust/WASM semantic execution, normalized repository access, and
    generated-artifact integrity. Python and TypeScript/Node are peer host
    adapters over the same versioned semantic-core protocol. Hosts own filesystem
    discovery, YAML acquisition/parsing, and presentation; the core owns shared
    meaning-bearing validation, construction, interpretation, and materialization.
    The core does not traverse or write consumer filesystems. The system excludes
    Runtime observation, evidence extraction, governance admission, MCP, LLM, and
    Assembler responsibilities.'
  external_dependencies:
  - Canonical ADR artifacts
  - Canonical invariant artifacts
  - Generated registry bundles
  exposed_interfaces:
  - adr compile
  - adr validate
  - adr validate-contract
  - adr validate-project-metadata
  - adr entities *
  - adr_kit.api
  - TypeScript/Node package API
