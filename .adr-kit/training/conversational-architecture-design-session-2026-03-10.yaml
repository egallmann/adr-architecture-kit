  speed_improvement:
    metric: "ADR creation time"
    baseline: "2-4 hours (manual YAML)"
    target: "15 minutes (conversational)"
    mechanism: "AI-generated ADRs, Watchdog inference"
  
  quality_improvement:
    metric: "ADR completeness"
    baseline: "60% (manual, humans forget fields)"
    target: "95%+ (AI-generated, schema-enforced)"
    mechanism: "Validation rules, generation_context requirements"
  
  adoption_improvement:
    metric: "Architecture documentation rate"
    baseline: "30% (manual, too much friction)"
    target: "90%+ (conversational, low friction)"
    mechanism: "Conversational interface, automated generation"
  
  migration_speed:
    metric: "Technology migration time"
    baseline: "12-18 months (big bang rewrite)"
    target: "4 weeks per component (incremental)"
    mechanism: "Composable architecture, interface preservation"
  
  compliance_speed:
    metric: "Compliance fix time"
    baseline: "2-4 days (manual fix)"
    target: "4 hours (AI-proposed fix)"
    mechanism: "Compliance AI Agent, automated validation"
  
  onboarding_speed:
    metric: "Legacy system onboarding time"
    baseline: "40 hours (manual documentation)"
    target: "2 hours (AI reverse engineering)"
    mechanism: "Legacy Import Agent, trust-first validation"

training_insights_for_architecture_agent:
  insight_1_follow_implications:
    principle: "Initial request often reveals much larger vision"
    guidance: "Don't just answer the immediate question. Explore implications. Ask 'what does this enable?'"
    example: "Add ADR subtypes → Composable architecture → Technology migration → Provider ecosystem → Complete meta-system"
  
  insight_2_paradigm_shifts:
    principle: "Be willing to fundamentally change approach"
    guidance: "When human questions assumption, reevaluate from first principles. Don't defend initial approach."
    example: "Human-writable → Machine-written (complete schema redesign)"
  
  insight_3_make_implicit_explicit:
    principle: "Encode insights as concrete design elements"
    guidance: "When human has insight, turn it into schema fields, validation rules, or ADRs."
    example: "Composability insight → interface_compatibility field + migration patterns"
  
  insight_4_dogfooding:
    principle: "Use the system to document itself"
    guidance: "The system's own architecture should be documented using its own principles."
    example: "Encode this conversation as 13 Logical ADRs using the ADR system we're building"
  
  insight_5_balance_automation_safety:
    principle: "Automation without safety is reckless"
    guidance: "For every automation, define tolerance boundaries and safety constraints."
    example: "Self-evolving infrastructure: auto-deploy non-breaking changes, human review for breaking changes"
  
  insight_6_cost_optimization:
    principle: "Use simplest agent that can reliably complete task"
    guidance: "Don't use foundation models for deterministic tasks. Tier 1 (rules) > Tier 2 (local LLM) > Tier 3 (foundation)."
    example: "Schema validation: Tier 1 (free, 50ms) vs GPT-4 ($$, 10s)"
  
  insight_7_trust_first:
    principle: "Assume competence, validate risk"
    guidance: "Don't validate everything. Auto-accept safe/compliant, validate only risky/non-compliant."
    example: "Legacy import: 90% auto-accepted, 10% validated (95% time reduction)"

