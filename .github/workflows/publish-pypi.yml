# Publishes to PyPI using Trusted Publishing (OIDC). No long-lived PyPI token in repo secrets.
# Maintainer setup: see "Publishing to PyPI" in CONTRIBUTING.md
#
# Runs only on default branch main (not develop, not feature/*): push that touches
# pyproject.toml (typical: version bump). Bump [project].version before merge;
# PyPI rejects duplicate versions.
name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: Upload release to PyPI
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/adr-architecture-kit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
