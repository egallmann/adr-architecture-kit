schema_version: "1.0"
type: invariant
id: INV-0002
statement: "adr_kit MUST not ship deprecated runtime API usage, and its direct dependencies MUST be audited for vulnerabilities and upgrade freshness"
scope: global
enforcement_level: must
enforcement_mechanism: policy
verification_method: automated
rationale: |
  adr_kit is a governance and architecture-authority tool. If it relies on deprecated
  modules, stale runtimes, or vulnerable packages, it undermines its own authority.

  This invariant establishes runtime hygiene as a first-class requirement:
  - Deprecated APIs must be removed before merge.
  - Direct dependencies must be checked for known vulnerabilities.
  - Direct dependency upgrade availability must be surfaced continuously.
  - Security posture and modernization debt must be visible in CI, not discovered later.

  The goal is deterministic, professional maintenance of the parent toolkit itself.

defined_in: ADR-L-0003
enforced_by: ["ADR-P-0001"]
related_constraints: []

policy_reference: "ORG-POL-002"
compliance_frameworks: ["STE"]

validation_query: |
  Run:
  - `python scripts/check_runtime_hygiene.py`
  - `adr audit-runtime --fail-on-outdated`
  in CI.

  Exit code 0 = no deprecated runtime APIs, no known vulnerable dependencies,
  and no outdated direct dependencies when strict mode is enabled.

validation_frequency: on_change
