name: Scheduled Portability Assurance

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-source:
    name: Resolve portability source commit
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/develop' || github.sha }}
      - name: Record and validate selected source commit
        id: source
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Portability source commit: $commit"

  native-rust:
    needs: resolve-source
    uses: ./.github/workflows/semantic-core-native.yml
    with:
      source_ref: ${{ needs.resolve-source.outputs.source_commit }}

  semantic-core-wasm:
    needs: resolve-source
    uses: ./.github/workflows/semantic-core-wasm.yml
    with:
      source_ref: ${{ needs.resolve-source.outputs.source_commit }}

  full-os-suite:
    name: Full Python suite / ${{ matrix.os }} / Python 3.14
    needs: semantic-core-wasm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Preserve canonical source bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.semantic-core-wasm.outputs.source_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: semantic-core-${{ needs.semantic-core-wasm.outputs.source_commit }}
          path: semantic-core-artifact
      - name: Install verified source-built WASM for this commit
        run: >-
          python scripts/semantic_core_artifact_bundle.py consume
          --bundle-dir semantic-core-artifact
          --source-commit "${{ needs.semantic-core-wasm.outputs.source_commit }}"
      - run: python scripts/verify_semantic_core_artifact.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - name: Run complete cross-platform suite
        run: python -m pytest --durations=30

  assurance:
    name: Required assurance results
    if: ${{ always() }}
    needs: [resolve-source, native-rust, semantic-core-wasm, full-os-suite]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require successful qualification of the exact source
        shell: bash
        env:
          REQUIRED_SUCCEEDED: >-
            ${{ needs.resolve-source.result == 'success'
                && needs.native-rust.result == 'success'
                && needs.semantic-core-wasm.result == 'success'
                && needs.full-os-suite.result == 'success' }}
          SOURCE_MATCH: >-
            ${{ needs.native-rust.outputs.source_commit == needs.resolve-source.outputs.source_commit
                && needs.semantic-core-wasm.outputs.source_commit == needs.resolve-source.outputs.source_commit }}
        run: |
          test "$REQUIRED_SUCCEEDED" = true
          test "$SOURCE_MATCH" = true
