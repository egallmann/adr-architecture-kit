system_boundaries:
- id: SYSBOUND-0002
  name: Authoring Compiler and Validation Boundary
  description: 'Encapsulates canonical ADR parsing, compiler orchestration, schema
    and

    contract validation, normalized repository access, and generated artifact

    integrity validation. It exposes a narrow Python authoring SDK over supported

    validation, compilation, repository, model, and capability contracts. It does

    not perform runtime extraction, rules, substrate, admission, MCP, LLM, or

    Assembler responsibilities.

    '
  external_dependencies:
  - Canonical ADR artifacts
  - Canonical invariant artifacts
  - Generated registry bundles
  exposed_interfaces:
  - adr compile
  - adr validate
  - adr validate-contract
  - adr validate-project-metadata
  - adr entities *
  - adr_kit.api
component_topology:
  components:
  - name: Schema and Contract Validation Component
    type: service
    purpose: Validates canonical ADR structure and contract expectations.
    implements_adr: 019fee89-e617-7d2b-8325-cd85ff814477
  - name: Compiler Pipeline Component
    type: service
    purpose: Builds and emits deterministic architecture compilation outputs.
    implements_adr: 019fee89-e618-7b76-843f-cfe21ceb2ea6
  - name: Repository Boundary Component
    type: service
    purpose: Loads and serves normalized semantic state for in-process consumers.
    implements_adr: 019fee89-e618-73ce-aa2d-101276d64e33
  - name: Integrity Validation Component
    type: service
    purpose: Verifies generated artifact freshness and tamper integrity.
    implements_adr: 019fee89-e618-74b2-a83e-e41c7d8c9f37
  relationships:
  - from: Canonical ADR artifacts
    to: Schema and Contract Validation Component
    type: depends_on
    description: Validation consumes canonical source artifacts.
  - from: Schema and Contract Validation Component
    to: Compiler Pipeline Component
    type: depends_on
    description: Compilation assumes structurally valid canonical input.
  - from: Compiler Pipeline Component
    to: Repository Boundary Component
    type: depends_on
    description: Repository consumers rely on compiled bundle artifacts.
  - from: Compiler Pipeline Component
    to: Integrity Validation Component
    type: depends_on
    description: Integrity validation checks compiler-owned artifacts.
operational_requirements:
  monitoring: Deterministic validation and compilation output with explicit diagnostics.
  logging: CLI-visible diagnostic logging with fail-closed validation behavior.
