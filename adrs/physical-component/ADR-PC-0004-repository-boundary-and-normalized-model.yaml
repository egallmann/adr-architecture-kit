context: 'ArchitectureRepository and NormalizedArchitectureModel are the stable

  in-process semantic boundary for consumers. Phase 1 adds a narrow supported

  authoring facade that reuses those contracts without wrapping or changing the

  normalized model and without making registry loaders or path helpers public.

  '
technology_stack:
- category: language
  name: Python
  version: '>=3.14'
  rationale: 'Minimum supported Python minor is 3.14 (`requires-python >=3.14`); currently
    qualified released minor line is 3.14; repository reference interpreter is currently
    3.14.7; new GA Python minors require explicit qualification before support is
    advertised.
    '
- category: library
  name: Pydantic
  version: 2.x
  rationale: Typed normalized semantic models.
component_specifications:
- id: 019fee89-e618-74d1-9a1f-37e2c2982a51
  name: Repository Boundary Component
  type: service
  responsibilities: '- Load compiled architecture bundle artifacts

    - Expose normalized semantic queries to in-process consumers

    - Centralize provenance, unresolved, and ADR/status lookup logic

    - Prevent ad hoc re-interpretation of compiled registries

    '
  generation_context:
    purpose: Provide a stable semantic boundary for in-process consumers.
    key_responsibilities:
    - Load normalized bundle state
    - Provide deterministic consumer queries
    - Centralize semantic adaptation logic
    constraints:
    - Consumers should not bypass the boundary for normal semantic access
    - Boundary changes must remain additive
    success_criteria:
    - Consumer flows use ArchitectureRepository and NormalizedArchitectureModel
    - Semantic adaptation stays centralized
  interfaces:
  - id: 019fee89-e618-74e7-882f-04f858aecaf0
    type: library_api
    specification: 'Public surfaces:

      - ArchitectureRepository

      - NormalizedArchitectureModel

      '
    alias_id: IFACE-0014
    alias_name: iface-0014
  - id: 019fee89-e618-7dab-893c-05d961de3a7d
    type: library_api
    specification: '`adr_kit.api.open_repository` resolves an explicit project root,
      eagerly

      loads it, and returns the existing ArchitectureRepository. Capability

      discovery is deterministic and local. Compilation model construction

      reuses a private normalized-bundle helper shared with repository loading.

      Registry loaders, path helpers, and internal registry models are excluded.

      '
    alias_id: IFACE-0019
    alias_name: iface-0019
  implementation_identifiers:
    module_path: src/adr_kit/repository/architecture_repository.py
    test_path: tests/test_architecture_repository.py
  implementation_requirements:
    error_handling:
      strategy: Fail closed on missing, malformed, or out-of-scope bundle references.
    observability:
      logging:
        level: info
        structured: false
      metrics:
      - name: repository_loads_total
        type: counter
    testing_requirements:
      unit_test_coverage: '>= 80%'
      integration_tests: '- Repository load and normalized lookup

        - Scope boundary enforcement

        - Legacy adaptation parity

        '
  alias_id: COMP-0013
  alias_name: repository-boundary-component
implementation_decisions:
- id: 019fee89-e618-7f57-861b-526925c708f6
  summary: Treat the repository/model boundary as a first-class component
  rationale: 'The repository boundary is stable runtime behavior and should be documented

    as its own component authority.

    '
  alias_id: IMPL-0014
  alias_name: treat-the-repository-model-boundary-as-a-first-class-component
- id: 019fee89-e618-7d01-943b-f749d6ba44ac
  summary: Record the Phase 0 facade deferral and constrain future Assembler dependencies
  rationale: 'Phase 0 preserved `ArchitectureRepository` and

    `NormalizedArchitectureModel` exactly as the consumer seam and deferred a

    facade. Phase 1 completes that bounded deferral through IFACE-0019 without

    wrapping or changing either contract.

    A future Assembler may depend only on that supported seam and must not bind

    to compiler IR, compiler passes, raw ADR parsing, or generated-file layout.

    '
  alias_id: IMPL-0017
  alias_name: record-the-phase-0-facade-deferral-and-constrain-future-assembler-dependencies
- id: 019fee89-e618-7b04-b51a-7fbc8721b160
  summary: Reuse private normalized-bundle assembly across repository and SDK compilation
  rationale: 'Constructing the detached SDK model from the same emitted registry bytes
    and

    private assembly logic used by ArchitectureRepository prevents semantic and

    fingerprint drift while preserving the normalized model''s existing shape and

    behavior.

    '
  alias_id: IMPL-0020
  alias_name: reuse-private-normalized-bundle-assembly-across-repository-and-sdk-compilation
gaps: []
