component_specifications:
- id: 019fee89-e617-76d8-a333-e21361cd6602
  name: Entity Registry Generator and Query Surface
  type: service
  responsibilities: '- Compile canonical ADR and invariant artifacts into a normalized
    discovery bundle

    - Emit deterministic `adrs/index/*.yaml` registry artifacts

    - Emit deterministic legacy compatibility registry output at `adrs/entities/registry.yaml`

    - Support manifest and rendered markdown emission through the unified compile
    path

    - Provide CLI query access over generated registry state

    - Preserve an index-first discovery posture for cross-language consumers

    '
  implements_capabilities:
  - 019fee89-e616-7121-a63e-0baad0a61fb3
  - 019fee89-e616-7d30-ae2e-6fee1dbb2712
  generation_context:
    purpose: Generate and query the normalized entity registry for agent discovery.
    key_responsibilities:
    - Generate deterministic discovery bundle records from canonical artifacts
    - Emit the legacy compatibility registry from the normalized compiler output
    - Delegate single-scope generation commands through the unified compiler driver
    - Reject duplicate explicitly introduced entity IDs
    - Support exact entity lookup and filtered list operations from CLI
    - Keep the required discovery bundle and additive indexed artifacts distinct for
      downstream consumers
    constraints:
    - Discovery outputs are derived and non-authoritative
    - Single-scope generation commands act as compatibility wrappers over `adr compile`
    - CLI must read generated registry artifacts instead of rescanning ADRs
    - Output must be deterministic when inputs are unchanged
    - Cross-language consumers bootstrap from `architecture-index.yaml` and the required
      registry bundle
    - '`manifest.yaml` is a guaranteed discovery and freshness surface, not a semantic
      authority'
    - '`adrs/entities/registry.yaml` must remain compatibility-only for new consumers'
    success_criteria:
    - Discovery bundle and legacy registry generation are deterministic
    - ADR-L-0008 entities are present in generated discovery output
    - CLI list/get/invariants/capabilities commands query the registry successfully
    - Cross-language consumers can rely on the indexed bundle without needing raw
      ADR traversal
  interfaces:
  - id: 019fee89-e617-70e7-bb17-27b693ad01a8
    type: CLI
    specification: 'Commands:

      - adr compile

      - adr generate-architecture-index

      - adr generate-manifest

      - adr generate-adr-projection
      - adr generate-rendered-docs

      - adr generate-entity-registry

      - adr entities list

      - adr entities get <id>

      - adr entities invariants

      - adr entities capabilities

      '
    alias_id: IFACE-0011
    alias_name: iface-0011
  implementation_identifiers:
    module_path: src/adr_kit/compiler/driver.py
    service_name: adr-compiler
    entry_point: src/adr_kit/cli/main.py
    test_path: tests/test_compiler_driver.py
  implementation_requirements:
    error_handling:
      strategy: Fail closed on duplicate entity IDs, invalid compiled registry files,
        and missing generated discovery artifacts.
    observability:
      logging:
        level: info
        structured: false
      metrics:
      - name: entity_registry_generations_total
        type: counter
    testing_requirements:
      unit_test_coverage: '>= 80%'
      integration_tests: '- Discovery bundle and legacy registry generation from logical,
        physical, physical-system, physical-component, and invariant sources

        - CLI query flows against generated registry artifacts

        '
  alias_id: COMP-0010
  alias_name: entity-registry-generator-and-query-surface
implementation_decisions:
- id: 019fee89-e617-7ee7-9f1f-0a720dc4f1b0
  summary: Route single-scope discovery generation through the unified compiler driver
  rationale: 'The unified compiler path keeps normalized registries, the legacy

    compatibility registry, manifest generation, and rendered markdown emission

    aligned while preserving the older single-scope commands as compatibility

    wrappers. Registry backend emission remains compiler-owned rather than

    isolated in the older standalone registry generator.

    '
  alias_id: IMPL-0011
  alias_name: route-single-scope-discovery-generation-through-the-unified-compiler-driver
