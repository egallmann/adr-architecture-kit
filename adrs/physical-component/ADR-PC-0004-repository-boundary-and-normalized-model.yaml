schema_version: '1.0'
adr_type: physical-component
id: ADR-PC-0004
title: Repository Boundary and Normalized Semantic Model
status: proposed
created_date: '2026-03-15'
authors:
- adr-architecture-kit
modified_date: '2026-08-05'
domains:
- repository
- semantic-model
- tooling
implements_system:
- ADR-PS-0002
implements_logical:
- ADR-L-0013
introduces_entities:
- COMP-0013
- IFACE-0014
- IMPL-0014
- IMPL-0017
technologies:
- python
- yaml
- pydantic
context: |
  ArchitectureRepository and NormalizedArchitectureModel are now the stable
  in-process semantic boundary for consumers. This component captures that
  consumer contract and keeps interpretation centralized without creating a
  broader SDK facade or changing the normalized model in Phase 0.
technology_stack:
- category: language
  name: Python
  version: '3.11'
  rationale: Existing implementation language.
- category: library
  name: Pydantic
  version: 2.x
  rationale: Typed normalized semantic models.
component_specifications:
- id: COMP-0013
  name: Repository Boundary Component
  type: service
  responsibilities: |
    - Load compiled architecture bundle artifacts
    - Expose normalized semantic queries to in-process consumers
    - Centralize provenance, unresolved, and ADR/status lookup logic
    - Prevent ad hoc re-interpretation of compiled registries
  generation_context:
    purpose: Provide a stable semantic boundary for in-process consumers.
    key_responsibilities:
    - Load normalized bundle state
    - Provide deterministic consumer queries
    - Centralize semantic adaptation logic
    constraints:
    - Consumers should not bypass the boundary for normal semantic access
    - Boundary changes must remain additive
    success_criteria:
    - Consumer flows use ArchitectureRepository and NormalizedArchitectureModel
    - Semantic adaptation stays centralized
  interfaces:
  - id: IFACE-0014
    type: library_api
    specification: |
      Public surfaces:
      - ArchitectureRepository
      - NormalizedArchitectureModel
      - registry loader and repository path helpers
  implementation_identifiers:
    module_path: src/adr_kit/repository/architecture_repository.py
    test_path: tests/test_architecture_repository.py
  implementation_requirements:
    error_handling:
      strategy: Fail closed on missing, malformed, or out-of-scope bundle references.
    observability:
      logging:
        level: info
        structured: false
      metrics:
      - name: repository_loads_total
        type: counter
    testing_requirements:
      unit_test_coverage: '>= 80%'
      integration_tests: |
        - Repository load and normalized lookup
        - Scope boundary enforcement
        - Legacy adaptation parity
implementation_decisions:
- id: IMPL-0014
  summary: Treat the repository/model boundary as a first-class component
  rationale: |
    The repository boundary is stable runtime behavior and should be documented
    as its own component authority.
- id: IMPL-0017
  summary: Defer a narrow facade and constrain future Assembler dependencies
  rationale: |
    Phase 0 preserves `ArchitectureRepository` and
    `NormalizedArchitectureModel` exactly as the present consumer seam. A later
    narrow facade may wrap supported interfaces, but it is not created here.
    A future Assembler may depend only on that supported seam and must not bind
    to compiler IR, compiler passes, raw ADR parsing, or generated-file layout.
gaps: []

