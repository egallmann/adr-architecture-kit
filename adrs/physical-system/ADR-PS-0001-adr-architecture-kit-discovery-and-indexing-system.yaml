- category: language
  name: Python
  version: '>=3.14'
  rationale: 'Minimum supported Python minor is 3.14 (`requires-python >=3.14`); currently
    qualified released minor line is 3.14; repository reference interpreter is currently
    3.14.7; new GA Python minors require explicit qualification before support is
    advertised.
    '
- category: library
  name: PyYAML
  version: 6.x
  rationale: Deterministic YAML parsing and rendering for derived artifacts.
- category: tooling
  name: Click
  version: 8.x
  rationale: Existing CLI surface for agent and human invocation.
