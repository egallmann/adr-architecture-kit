schema_version: "1.0"
type: invariant
id: INV-0008
statement: "Rendered markdown artifacts must be treated as derived human-facing projections and must not be used as semantic authority when canonical YAML source artifacts are available."
scope: global
enforcement_level: must
enforcement_mechanism: policy
verification_method: automated
rationale: |
  Rendered markdown is useful for review, browsing, and pull-request context,
  but it is structurally weaker than canonical YAML. Treating rendered output
  as semantic input when canonical YAML exists reintroduces narrative parsing,
  ambiguity, and drift pressure into an architecture system that is designed to
  be machine-verifiable.

  Correct precedence is:
  - canonical ADR and invariant YAML artifacts
  - derived machine surfaces such as manifest and indexes
  - derived human projections such as rendered markdown and system overview

defined_in: ADR-L-0014
enforced_by: ["ADR-PC-0001", "ADR-PC-0005"]
related_constraints: []

policy_reference: "ORG-POL-004"
compliance_frameworks: ["STE"]

validation_query: |
  For consumer and discovery workflows:
  - prefer canonical YAML artifacts and compiled machine surfaces for semantic input
  - treat adrs/rendered/* and SYSTEM-OVERVIEW.md as disposable projections
  - do not infer authority from rendered markdown when canonical YAML is present

validation_frequency: on_change

