  description: 'Human-readable architecture documentation must be produced from structured

    artifacts or explicit projection code rather than maintained as an

    independent source of truth.

    '
  rationale: 'Independent manual documentation introduces drift risk and authority

    ambiguity in an architecture governance repository.

    '
