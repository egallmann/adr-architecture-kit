component_specifications:
- id: 019fee89-e618-7507-953e-19e6335e3b7a
  name: Brownfield Onboarding and Canonical Normalization
  type: service
  responsibilities: '- Detect canonical entity ID collisions

    - Apply deterministic canonical ID remaps

    - Write canonical migration ledgers

    - Support brownfield onboarding cleanup as governed normalization rather than
    ad hoc editing

    '
  generation_context:
    purpose: Normalize brownfield architecture artifacts into canonical STE form.
    key_responsibilities:
    - canonical ID normalization
    - migration ledger generation
    - brownfield onboarding support
    constraints:
    - normalization must be deterministic and auditable
    - canonical updates must precede derived artifact regeneration
    success_criteria:
    - normalize-canonical-ids produces deterministic remaps
    - migration ledgers preserve old-to-new mapping evidence
  interfaces:
  - id: 019fee89-e618-7ad6-903b-955fab187e68
    type: CLI
    specification: 'Commands:

      - adr normalize-canonical-ids

      Public modules:

      - src/adr_kit/migrators/canonical_id_normalizer.py

      '
    alias_id: IFACE-0016
    alias_name: iface-0016
  implementation_identifiers:
    module_path: src/adr_kit/migrators/canonical_id_normalizer.py
    entry_point: src/adr_kit/cli/main.py
    test_path: tests/test_canonical_id_normalizer.py
  implementation_requirements:
    error_handling:
      strategy: Apply deterministic remaps only for detected collisions and preserve
        a machine-readable migration ledger.
    observability:
      logging:
        level: info
        structured: false
      metrics:
      - name: canonical_id_normalizations_total
        type: counter
    testing_requirements:
      unit_test_coverage: '>= 80%'
      integration_tests: '- Canonical collision detection

        - Deterministic remap application

        - Migration ledger generation

        '
  alias_id: COMP-0015
  alias_name: brownfield-onboarding-and-canonical-normalization
implementation_decisions:
- id: 019fee89-e618-7b21-ab3d-aaccdca13bfb
  summary: Treat brownfield onboarding and canonical normalization as an explicit
    component capability
  rationale: 'Migration logic is part of the usable onboarding path for STE adoption
    and

    should be documented as an intentional system capability rather than hidden

    utility behavior.

    '
  alias_id: IMPL-0016
  alias_name: treat-brownfield-onboarding-and-canonical-normalization-as-an-explicit-component-capability
