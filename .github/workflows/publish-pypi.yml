# Promote the exact tested release bundle to PyPI through trusted publishing.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Release quality and governance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python -m pytest
      - run: python -m pytest --cov=adr_kit --cov-report=term-missing --cov-fail-under=80
      - run: adr validate --cross-references
      - run: adr governance-checks
      - run: adr validate-generated-docs
      - run: adr validate-system-overview
      - run: python scripts/check_quality_ratchets.py
      - run: python -m pip_audit .

  build-release:
    name: Build the publishable bundle once
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python scripts/check_version_consistency.py
      - run: python -m build --outdir python-dist
      - run: python -m twine check python-dist/*
      - name: Verify tag and create release manifest
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          python scripts/release_manifest.py create --dist-dir python-dist --output release-manifest.json --source-commit "${GITHUB_SHA}" --version "${VERSION}"
          python scripts/release_manifest.py verify --dist-dir python-dist --manifest release-manifest.json --expected-source-commit "${GITHUB_SHA}" --expected-version "${VERSION}" --expected-tag "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            python-dist/
            release-manifest.json
          if-no-files-found: error

  test-release:
    name: Retained release wheel / Python ${{ matrix.python-version }}
    needs: build-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle
      - run: python scripts/test_installed_wheel.py --wheel "$(find release-bundle/python-dist -maxdepth 1 -name '*.whl' -print -quit)"

  publish:
    name: Publish retained bundle to PyPI
    needs: [build-release, test-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/adr-architecture-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle
      - name: Re-verify retained release bundle
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/release_manifest.py verify --dist-dir release-bundle/python-dist --manifest release-bundle/release-manifest.json --expected-source-commit "${GITHUB_SHA}" --expected-version "${VERSION}" --expected-tag "${GITHUB_REF_NAME}"
      - name: Publish without rebuilding
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-bundle/python-dist
