schema_version: '1.5'
adr_type: logical
id: 019fee89-e615-7b9c-8e3f-32ceeda01491
title: Deterministic Documentation Projection
status: accepted
created_date: '2026-03-12'
authors:
- erik.gallmann
domains:
- documentation
- governance
- determinism
- projection
tags:
- generated-documentation
- deterministic
- ai-first
- drift-prevention
context: 'The repository already treats several human-readable artifacts as derived
  state:

  ADR human projections under adrs/adr-projection/, manifest summaries, and the optional

  ADR-domain orientation projection (historically SYSTEM-OVERVIEW) are generated from

  structured or code-defined sources. That behavior now needs

  explicit architectural authority so future contributors do not reintroduce

  manually maintained documentation that drifts from canonical artifacts.


  The canonical source of truth in this system is structured architecture state:

  ADR YAML, invariant YAML, project metadata, schema definitions, and generator

  source code where projection rules are intentionally encoded. Human-readable

  documentation exists to improve orientation and inspection, but it is not the

  authoritative state.


  Manual maintenance of generated documentation creates several risks:

  - drift between canonical artifacts and human-readable views

  - ambiguity over whether readers should trust rendered output or source artifacts

  - AI contributors missing generators and editing rendered outputs directly

  - inconsistent updates across manifest summaries, indexes, and overview files


  This rule applies to all human-readable architecture documentation projections,

  including:

  - ADR human projections (adrs/adr-projection/)

  - optional ADR-domain orientation projection (SYSTEM-OVERVIEW compatibility name)

  - manifest summaries

  - architecture diagrams

  - documentation indexes

  - future documentation projections introduced later


  The repository therefore needs an explicit logical rule: structured artifacts

  are canonical, documentation renderings are derived, and projection consistency

  must be enforced through generators, validators, tests, and CI.

  '
decisions:
- id: 019fee89-e615-758b-b03f-e4a3dc338589
  summary: Treat human-readable architecture documentation as deterministic derived
    state
  rationale: 'Structured architecture artifacts are the canonical source of truth
    in this

    repository. Human-readable documentation is valuable for comprehension, but

    it must be a deterministic rendering derived from those structured artifacts

    rather than a parallel authority.


    This preserves:

    - doctrinal clarity about what is authoritative

    - deterministic regeneration of documentation from source state

    - drift prevention through validation and CI

    - reliable AI target discovery, because generators remain the primary workflow

    '
  consequences:
    positive:
    - Canonical architecture state remains explicit and machine-verifiable
    - Rendered documentation can be regenerated consistently
    - Documentation drift becomes detectable and enforceable
    - AI contributors are directed toward generators rather than manual edits
    negative:
    - Documentation changes may require generator or template updates instead of direct
      edits
    - Small wording changes in rendered documentation now require structured source
      changes
  related_invariants:
  - 019fee89-e616-7bf6-a63f-2fdbec175790
  - 019fee89-e616-7abd-ad17-f29edbd30959
  - 019fee89-e616-77e0-992d-25764a1ed5a2
  alias_id: DEC-0012
  alias_name: treat-human-readable-architecture-documentation-as-deterministic-derived-state
- id: 019fee89-e615-7e55-972f-14dd7da851c0
  summary: Prohibit manual edits to generated documentation
  rationale: 'Once an artifact is declared generated, manual edits create ambiguity
    over

    whether the generated output or the source artifact should be trusted. That

    ambiguity is architecturally unacceptable in a governance repository.


    Manual edits are therefore prohibited for generated documentation. Changes

    must be made by editing the structured source, generator, template, or

    projection rules, followed by regeneration and validation.

    '
  consequences:
    positive:
    - Rendered artifacts stay traceable to their generation pipeline
    - Reviewers can reason about documentation changes from source changes
    - CI can enforce freshness deterministically
    negative:
    - Contributors must learn the generator path for documentation updates
  related_invariants:
  - 019fee89-e616-7bf6-a63f-2fdbec175790
  - 019fee89-e616-77e0-992d-25764a1ed5a2
  alias_id: DEC-0019
  alias_name: prohibit-manual-edits-to-generated-documentation
- id: 019fee89-e615-796c-ae1d-a27f1fff021b
  summary: Require generator, validator, test, and CI enforcement for documentation
    projection
  rationale: 'The rule is only durable if it is automated. Deterministic documentation

    projection must therefore be enforced through:

    - generators that produce rendered documentation

    - validators that compare rendered output to generator output

    - tests that prove deterministic generation

    - CI checks that fail when rendered artifacts drift


    This makes documentation projection a governed architectural pipeline rather

    than a best-effort editorial process.

    '
  consequences:
    positive:
    - Projection consistency becomes automatically enforceable
    - Drift is surfaced immediately in development and CI
    - Future AI-first artifacts can adopt the same pattern
    negative:
    - Additional generator and validator maintenance is required as documentation
      artifacts expand
  related_invariants:
  - 019fee89-e616-7abd-ad17-f29edbd30959
  - 019fee89-e616-77e0-992d-25764a1ed5a2
  alias_id: DEC-0026
  alias_name: require-generator-validator-test-and-ci-enforcement-for-documentation-projection
- id: 019ff142-dd48-72ff-9e3f-81ca4a779db7
  summary: Emit ADR human projections under typed adr-projection paths with stable
    SDK artifact identity
  rationale: 'Human-facing ADR markdown must be navigable after UUID machine identity.

    Projections live under adrs/adr-projection/{logical,physical,physical-system,physical-component}/

    with filenames {alias_id}-{slug}.md. The SDK markdown group remains markdown;

    artifact_kind remains rendered_adr_markdown; logical artifact_id is

    rendered-adr:{adr.id} and must not become slug-dependent. relative_path values

    migrate intentionally; generate-adr-projection is preferred with

    generate-rendered-docs retained as a compatibility alias. Hard cutover replaces

    adrs/rendered/ after the new tree validates. Projections remain disposable and

    non-authoritative.

    '
  consequences:
    positive:
    - Humans can locate and navigate ADR projections by alias and type
    - SDK logical identity stays stable across title/slug changes
    - Path migration is explicit and regenerable
    negative:
    - Existing relative_path consumers must accept the adr-projection layout
  related_invariants:
  - 019fee89-e616-7bf6-a63f-2fdbec175790
  - 019fee89-e616-7abd-ad17-f29edbd30959
  - 019fee89-e616-77e0-992d-25764a1ed5a2
  alias_id: DEC-0108
  alias_name: emit-adr-human-projections-under-typed-adr-projection-paths
- id: 019ff142-dd48-7ef8-8d3e-576f4bb02dc3
  summary: Human ADR projections render compiler-derived relationship semantics only
  rationale: 'The human projection must not invent a second relationship ontology.

    Mermaid edges and peer-card relationship verbs come from shared compiler

    derivation (RelGraph / RelationshipType). Required gap closes include ADR-level

    supersedes/superseded_by and implements_logical as a first-class RelationshipType

    (implementing ADR to logical ADR). HumanAdrProjectionContext may enrich with

    prose and aliases but must not reinterpret source fields into alternate graph

    meaning. Presentation-only nesting is limited to the subject ADR authored body.

    '
  consequences:
    positive:
    - One relationship ontology for registries, graphs, and human projections
    - Peer cards explain how ADRs relate using compiled verbs
    - Integrity hashes cover the actual render dependency set
    negative:
    - Derivation and relationship-type surfaces must stay aligned when fields change
  related_invariants:
  - 019fee89-e616-7bf6-a63f-2fdbec175790
  - 019fee89-e616-7abd-ad17-f29edbd30959
  alias_id: DEC-0109
  alias_name: human-adr-projections-render-compiler-derived-relationship-semantics-only
- id: 019ff22a-bb5f-7bfc-851d-938bffc81281
  summary: Classify documentation-projection inputs as derived facts or authored orientation
  rationale: 'A generated documentation projection must not establish a second authored

    copy of machine-verifiable facts when an owning structured or provider surface

    already exists. Those facts must be obtained from their owning machine-readable

    source.


    Some orientation is inherently explanatory and cannot reasonably be mechanically

    inferred. That authored orientation may be intentional projection input only when

    it is explicit, governed as source state, non-authoritative, distinguishable from

    derived facts, and unable to silently override canonical architecture.


    Authored orientation must not become a hidden second authority layer.

    '
  consequences:
    positive:
    - Overview and other projections stay aligned with owning provider/schema surfaces
    - Explanatory guidance remains intentional without competing with canonical ADRs
    negative:
    - Projection authors must classify each input as derived or authored
  related_invariants:
  - 019ff22a-bb5f-7c77-a223-1dab5e8c814d
  - 019ff22a-bb5f-7779-912f-040cdf1b54b8
  alias_id: DEC-0110
  alias_name: classify-documentation-projection-inputs-as-derived-or-authored
- id: 019ff22a-bb5f-7214-8818-40820f8c553e
  summary: Allow a deterministic semantic intermediate model for documentation projection
  rationale: 'Projection generation may assemble governed inputs into an explicit deterministic

    intermediate model that represents the complete semantic basis of the rendered

    artifact. That model is derived projection state, not independent architecture

    authority. It must be deterministic and must not carry environmental noise such

    as timestamps or machine-specific absolute paths unless those are part of the

    projection contract.


    The intermediate model is the complete semantic basis of rendered content. It is

    not necessarily the complete integrity or freshness basis, because governed

    projection-rule inputs can also change the rendered artifact.

    '
  consequences:
    positive:
    - Projection pipelines can separate semantic assembly from presentation
    - Tests can assert semantic completeness without treating the model as authority
    negative:
    - Implementers must keep semantic model and projection-rule inputs distinct
  related_invariants:
  - 019fee89-e616-7abd-ad17-f29edbd30959
  - 019ff22a-bb5f-7b93-a600-f587022aeffd
  alias_id: DEC-0111
  alias_name: allow-deterministic-semantic-intermediate-model-for-documentation-projection
- id: 019ff22a-bb5f-7d9e-973f-b9008898a8c9
  summary: Require projection-source closure for generated documentation freshness
  rationale: 'Generated documentation freshness must close over all governed inputs capable

    of changing the rendered artifact. That includes semantic inputs that determine

    document meaning and projection-rule inputs that can change rendering from the

    same semantic model (templates, generator or renderer rules, and profile

    interpretation logic).


    Changing a semantic or projection-rule input must invalidate the projection.

    Unrelated repository changes must not. Whole-repository hashing is not required

    or desirable. Aggregate sources such as a full manifest need not invalidate a

    projection when an unrelated record changes if that record is not part of the

    selected semantic input.

    '
  consequences:
    positive:
    - Freshness tracks true render dependencies rather than coarse repository churn
    - Template and projection-rule changes remain detectable as stale projections
    negative:
    - Source-basis declarations must enumerate semantic and projection-rule inputs
  related_invariants:
  - 019ff22a-bb5f-7b93-a600-f587022aeffd
  - 019fee89-e616-7abd-ad17-f29edbd30959
  alias_id: DEC-0112
  alias_name: require-projection-source-closure-for-generated-documentation-freshness
- id: 019ff22a-bb5f-76eb-8a31-546eeba55dcb
  summary: Documentation projections reflect supported boundaries without redefining them
  rationale: 'A documentation projection may describe and route consumers to existing

    supported interfaces, authority boundaries, and lifecycle surfaces. It must not

    create, promote, or redefine those interfaces or authorities. Ownership remains

    with the existing accepted authority for each surface.

    '
  consequences:
    positive:
    - Orientation stays subordinate to provider, repository, and stewardship authority
    - Overview content cannot silently invent public surfaces
    negative:
    - Projection authors must cite existing authority rather than invent boundaries
  related_invariants:
  - 019fee89-e616-7bf6-a63f-2fdbec175790
  - 019ff22a-bb5f-7779-912f-040cdf1b54b8
  alias_id: DEC-0113
  alias_name: documentation-projections-reflect-supported-boundaries-without-redefining-them
- id: 019ff22a-bb5f-77ed-a63f-98f0455fdd1e
  summary: Isolate repository-specific documentation-projection orientation by scope
  rationale: 'Repository-specific orientation semantics must not leak into an unrelated

    repository scope. When ADR Kit generates an ADR-domain orientation projection for a

    consuming repository, ADR Kit provider orientation must not be rendered into that

    consumer merely because ADR Kit produced the file.


    Orientation remains consumption guidance for the ADR domain present in the target

    repository. It must not claim to describe an entire software system or repository

    outside that ADR domain, and must not silently inherit another repository''s

    provider identity.

    '
  consequences:
    positive:
    - Consumer repositories are not mis-oriented as ADR Kit itself
    - Profile and scope routing become architecturally mandatory
    negative:
    - Generators must select profile or compatibility path by project identity
  related_invariants:
  - 019ff22a-bb5f-7fca-b021-b3cbc68ddde2
  alias_id: DEC-0114
  alias_name: isolate-repository-specific-documentation-projection-orientation-by-scope
- id: 019ff22a-bb5f-7926-a33c-b66f72343219
  summary: Replace legacy generic SYSTEM-OVERVIEW posture with optional ADR-domain orientation
  rationale: 'The SYSTEM-OVERVIEW concept is refined into an optional ADR-domain orientation

    projection. Its purpose is to orient humans and AI on how to consume the ADR

    domain present in the repository, analogous to an injected README for that

    repository''s ADR-Kit semantic interface. It is not an authoritative description

    of the entire repository or software system.


    Pre-1.0 authority intentionally replaces the prior generic/profile obligation

    that preserved emission success as a compatibility product surface. Orientation

    remains optional; absence must not invalidate an otherwise valid ADR corpus;

    integrity validates the artifact only when present.

    '
  consequences:
    positive:
    - Orientation purpose is consumption guidance rather than whole-system explanation
    - Optional absence remains corpus-valid
    - Legacy generic overview product posture is retired as architectural obligation
    negative:
    - Generators and validators must treat orientation as optional rather than required
  related_invariants:
  - 019ff22a-bb5f-7fca-b021-b3cbc68ddde2
  - 019ff22a-bb5f-7779-912f-040cdf1b54b8
  - 01a09cf0-179e-71cc-b150-d4c281b85395
  alias_id: DEC-0115
  alias_name: preserve-legacy-generic-system-overview-generation-as-compatibility-only
- id: 01a048f5-b197-75ab-a812-6e3361333731
  summary: Encode projection v3 renderer contract for normalized v2.2 topology semantics
  rationale: 'Projection v3 renders deterministic human documentation from normalized
    v2.2 inputs using compiler-derived relationship semantics only. Topology inventory,
    compatibility rows, and peer-card verbs must follow ADR-L-0025 topology and
    contract succession authority without inventing pseudo-edges or ADR-level fake
    topology. Coverage registry posture and ADR-domain orientation integration remain
    sequenced post-substrate; this decision governs authority only, not implementation
    modules or templates.

    '
  consequences:
    positive:
    - v3 projection authority is durable and cross-references topology contract succession
    - Renderer work can proceed against promoted schema and ADR authority
    negative:
    - Production renderer implementation remains deferred to the implementation plan
  related_invariants:
  - 019fee89-e616-7abd-ad17-f29edbd30959
  - 019fee89-e616-77e0-992d-25764a1ed5a2
  alias_id: DEC-0176
  alias_name: encode-projection-v3-renderer-contract-for-normalized-v2-2
- id: 01a09cf0-179e-71cc-b150-d4bc07d17a38
  summary: Emit generated documentation in final repository-admissible bytes
  rationale: 'Meaning-bearing deterministic documentation projection must emit the final

    repository-admissible byte representation. No whitespace normalization, formatting

    cleanup, newline repair, or other post-generation mutation may be required between

    canonical generation and repository persistence or admission. This covers at least

    trailing horizontal whitespace, newline normalization, final-newline policy,

    formatter-required mutations, and post-render cleanup that would invalidate

    rendered hashes. Renderers must intentionally produce admissible bytes and must

    not rely on indiscriminate stripping of authored Markdown whitespace that could

    carry meaning.

    '
  consequences:
    positive:
    - Generated projections can be admitted without hand cleanup
    - Rendered hashes remain meaningful against admitted repository bytes
    negative:
    - Templates and renderers must encode admission constraints deliberately
  related_invariants:
  - 01a09cf0-179e-71cc-b150-d4c1f1865c19
  - 019fee89-e616-7abd-ad17-f29edbd30959
  alias_id: DEC-0229
  alias_name: emit-generated-documentation-in-final-repository-admissible-bytes
- id: 01a09cf0-179e-71cc-b150-d4bdd03ad104
  summary: Treat ADR-domain orientation as optional consumption guidance, not whole-system authority
  rationale: 'The orientation projection orients consumers on how to use the ADR domain

    present in a repository. For humans it should point toward human ADR projections

    and, where appropriate, ADR-PS as a likely system-oriented entry point linking

    ADR-L and ADR-PC detail. It must not claim that one ADR-PS is always globally

    primary when a corpus may contain multiple systems. Absence of the orientation

    artifact must not invalidate an otherwise valid ADR corpus.

    '
  consequences:
    positive:
    - Orientation stays subordinate to canonical ADR YAML
    - Multi-system corpora are not falsely collapsed to one primary ADR-PS
    negative:
    - Generators must avoid whole-repository or whole-product claims
  related_invariants:
  - 01a09cf0-179e-71cc-b150-d4c281b85395
  - 019ff22a-bb5f-7779-912f-040cdf1b54b8
  alias_id: DEC-0230
  alias_name: treat-adr-domain-orientation-as-optional-consumption-guidance
- id: 01a09cf0-179e-71cc-b150-d4be32e00b3e
  summary: Require capability-aware ADR-domain orientation content
  rationale: 'Generated orientation must reflect the API contract and capability profile

    actually available to the consumer. It must not recommend a public operation

    absent from the capability profile used to produce it. Its effective basis is

    ADR-Kit API contract generation, advertised capability profile, orientation

    projection contract or version, relevant repository ADR-domain facts, and any

    explicit small consumer orientation configuration. This is not an arbitrary

    templating or documentation DSL.

    '
  consequences:
    positive:
    - Orientation cannot advertise unimplemented capabilities
    - Capability truthfulness remains aligned with package evidence
    negative:
    - Orientation regeneration depends on capability-profile inputs
  related_invariants:
  - 01a09cf0-179e-71cc-b150-d4c3c7e3d727
  - 019ff22a-bb5f-7779-912f-040cdf1b54b8
  alias_id: DEC-0231
  alias_name: require-capability-aware-adr-domain-orientation-content
- id: 01a09cf0-179e-71cc-b150-d4bf50832101
  summary: Separate human and machine/AI ADR-domain orientation guidance
  rationale: 'Human orientation prefers human ADR projections, with ADR-PS as a likely

    system-oriented entry where appropriate. When ADR-Kit execution is available,

    machine and AI orientation should prefer the canonical semantic-result surface

    over reconstructing normalized architecture semantics from generated manifests,

    registries, or Markdown projections. Manifest and index surfaces remain useful

    for inventory, interoperability, integrity, navigation, and offline inspection

    and are not removed by this decision.

    '
  consequences:
    positive:
    - Humans and machines receive purpose-fit entry guidance
    - Generated indexes retain narrower inventory roles
    negative:
    - Orientation content must distinguish audience without inventing APIs
  related_invariants:
  - 019ff22a-bb5f-7779-912f-040cdf1b54b8
  - 019fee89-e616-7bf6-a63f-2fdbec175790
  alias_id: DEC-0232
  alias_name: separate-human-and-machine-adr-domain-orientation-guidance
- id: 01a09cf0-179e-71cc-b150-d4c0e13c5fcc
  summary: Treat package version as orientation provenance, not semantic freshness
  rationale: 'An ADR-Kit package version change alone must not make the ADR-domain

    orientation projection stale. Package or tool version may be recorded as

    provenance, but release identity is not automatically a meaning-bearing

    projection input. Changes to API contract, capability profile, orientation

    contract, projection semantics, selected repository facts, or explicit consumer

    orientation input may legitimately change the artifact.

    '
  consequences:
    positive:
    - Patch releases do not force orientation churn by version alone
    - True meaning-bearing input changes remain freshness triggers
    negative:
    - Freshness declarations must enumerate meaning-bearing inputs explicitly
  related_invariants:
  - 01a09cf0-179e-71cc-b150-d4c4947c82a2
  - 019ff22a-bb5f-7b93-a600-f587022aeffd
  alias_id: DEC-0233
  alias_name: treat-package-version-as-orientation-provenance-not-semantic-freshness

