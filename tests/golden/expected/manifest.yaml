invariants:
- id: INV-0001
  statement: All ADRs must validate against JSON Schema before commit
  defined_in: ADR-L-0001
  enforced_by: []
  enforcement_level: must
- id: INV-0002
  statement: Logical ADRs must not contain implementation details
  defined_in: ADR-L-0001
  enforced_by: []
  enforcement_level: must
- id: INV-0003
  statement: Physical ADRs must reference at least one logical ADR
  defined_in: ADR-L-0001
  enforced_by: []
  enforcement_level: must
- id: INV-0004
  statement: Manifest must be regenerated when ADRs change
  defined_in: ADR-L-0001
  enforced_by: []
  enforcement_level: must
- id: INV-0005
  statement: Project-local ADR alias IDs must be unique across the project while canonical
    machine identity remains UUID
  defined_in: ADR-L-0001
  enforced_by: []
  enforcement_level: must
- id: INV-0006
  statement: Schema changes must be documented in ADRs before implementation
  defined_in: ADR-L-0001
  enforced_by: []
  enforcement_level: must
- id: INV-0007
  statement: Schema evolution must maintain backward compatibility unless major version
  defined_in: ADR-L-0001
  enforced_by: []
  enforcement_level: must
- id: INV-0014
  statement: 'ADR generators and validators MUST support explicit scope parameter
    to

    override auto-detection when needed

    '
  defined_in: ADR-L-0002
  enforced_by: []
  enforcement_level: must
- id: INV-0015
  statement: 'Project scope resolution MUST use the same marker hierarchy as ste-runtime:

    1. Explicit --scope parameter (highest priority)

    2. ste.config.json in current or parent directories

    3. Standard project markers (package.json, pyproject.toml, .git)

    4. Current working directory (fallback)

    '
  defined_in: ADR-L-0002
  enforced_by: []
  enforcement_level: must
- id: INV-0016
  statement: 'Each project scope MUST maintain its own adrs/ directory and manifest.yaml

    '
  defined_in: ADR-L-0002
  enforced_by: []
  enforcement_level: must
- id: INV-0017
  statement: 'ADR cross-references between different scopes MUST use fully-qualified

    identifiers (e.g., "ste-runtime:ADR-L-0001")

    '
  defined_in: ADR-L-0002
  enforced_by: []
  enforcement_level: should
- id: INV-0018
  statement: 'Scope resolution MUST NOT traverse above workspace root to prevent

    scanning unintended directories

    '
  defined_in: ADR-L-0002
  enforced_by: []
  enforcement_level: must
- id: INV-0019
  statement: 'ADR validation at workspace scope SHOULD validate all sub-module ADRs

    recursively when --recursive flag is provided

    '
  defined_in: ADR-L-0002
  enforced_by: []
  enforcement_level: should
- id: INV-0098
  statement: Recursive compilation must compile each resolved project scope independently
    and must not implicitly merge architecture state across scopes.
  defined_in: ADR-L-0002
  enforced_by: []
  enforcement_level: must
- id: INV-0020
  statement: 'Every component with public API MUST have unit tests covering:

    - Happy path (valid inputs)

    - Error cases (invalid inputs)

    - Edge cases (boundary conditions)

    - Backward compatibility (when applicable)

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0021
  statement: 'Schema validators MUST have tests proving correctness against:

    - Valid ADRs (should pass)

    - Invalid ADRs (should fail with clear errors)

    - Edge cases (empty fields, special characters, etc.)

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0022
  statement: 'Multi-scope functionality MUST have tests covering:

    - Single scope (backward compatibility)

    - Multiple scopes (recursive operations)

    - Scope boundary enforcement (security)

    - Parent-child relationships

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0023
  statement: 'Test suite MUST complete in under 30 seconds for fast feedback

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: should
- id: INV-0024
  statement: 'Tests MUST be deterministic - same input always produces same output

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0025
  statement: 'Breaking changes to public APIs MUST be detected by tests

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0026
  statement: 'Test coverage SHOULD be measured and tracked, with minimum 80% coverage

    for critical components (parsers, validators, generators)

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: should
- id: INV-0072
  statement: 'Pull-request and release validation MUST install the project before
    tests,

    MUST measure canonical `adr_kit` namespace coverage at no less than 80%,

    and MUST exercise both a source installation and the exact retained wheel

    on every claimed Python version.

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0073
  statement: 'Release publication MUST promote exactly one previously tested wheel
    and

    one previously tested sdist without rebuilding. Their filenames, sizes,

    SHA-256 hashes, package version, source commit, and `v<version>` tag MUST

    be verified before the privileged publish step. Ruff, strict-mypy, and

    Black debt MUST be guarded by committed no-regression baselines that allow

    removals but reject additions or count increases.


    When a successful qualification already exists for the exact tagged source

    commit and its retained release bundle, the tag publication path MUST act as

    a promotion and identity-verification boundary only. It MUST NOT rebuild

    distributions or re-run the independent qualification suite solely because a

    tag was created. Publication MUST fail closed if successful qualification

    evidence or the retained bundle for that exact commit cannot be proven.

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0075
  statement: 'Source, editable-install, and clean retained-wheel consumers MUST exercise

    the supported SDK and MUST agree on package, CLI, SDK result, capability,

    and installed-distribution versions wherever distribution metadata exists.

    Direct-source fallback MUST occur only when metadata is absent and MUST NOT

    hide invalid installed metadata or package-resource failures.

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0083
  statement: 'The PyPI-facing package description (the file declared as `project.readme`)

    MUST contain only Markdown link and image targets that resolve independently

    of GitHub repository-relative rendering: same-document anchors, absolute

    `https://` URLs (optional fragment), and `mailto:` URIs. Repository-relative

    file or directory targets and `http://` URLs MUST be rejected by automated

    release qualification before merge or publication.

    '
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0095
  statement: adr_kit MUST not ship deprecated runtime API usage, and its direct dependencies
    MUST be audited for vulnerabilities and upgrade freshness
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0096
  statement: Repository changes must be committed at meaningful verified boundaries
    rather than accumulated indefinitely.
  defined_in: ADR-L-0003
  enforced_by: []
  enforcement_level: must
- id: INV-0027
  statement: 'Greenfield in-scope implementation artifacts MUST declare architectural

    authority through @implements_adr, a UUID semantic claim decorator, or an

    equivalent metadata-level attribution mechanism; equivalent semantic

    declarations MUST NOT be dual-encoded on the same surface; brownfield and

    migration may stage adoption under profile-specific governance

    '
  defined_in: ADR-L-0004
  enforced_by: []
  enforcement_level: must
- id: INV-0028
  statement: 'Implementation attribution references MUST resolve to existing ADRs,
    and

    references to superseded ADRs MUST be surfaced as governance warnings

    '
  defined_in: ADR-L-0004
  enforced_by: []
  enforcement_level: must
- id: INV-0029
  statement: 'Implementation attribution evidence MUST preserve provenance identifying

    the source artifact and extractor responsible for the claim

    '
  defined_in: ADR-L-0004
  enforced_by: []
  enforcement_level: must
- id: INV-0030
  statement: 'A declaration that code enforces an invariant is a claim of intent,

    not kit-automated proof that the enforcement logic exists

    '
  defined_in: ADR-L-0004
  enforced_by: []
  enforcement_level: must
- id: INV-0031
  statement: 'adr-architecture-kit MUST define the canonical architecture-intent

    attribution rule and evidence contract without taking on direct source-code

    parsing responsibilities for downstream repositories

    '
  defined_in: ADR-L-0004
  enforced_by: []
  enforcement_level: must
- id: INV-0032
  statement: 'Downstream extractors and rule-delivery systems SHOULD consume ADR-Kit

    attribution contracts rather than redefining them independently

    '
  defined_in: ADR-L-0004
  enforced_by: []
  enforcement_level: should
- id: INV-0046
  statement: 'Generated prompts MUST include all invariants from the source ADR with

    their enforcement levels (must/should/may)

    '
  defined_in: ADR-L-0005
  enforced_by: []
  enforcement_level: must
- id: INV-0047
  statement: 'Generated prompts MUST include component specifications with complete

    interface definitions (methods, parameters, return types)

    '
  defined_in: ADR-L-0005
  enforced_by: []
  enforcement_level: must
- id: INV-0048
  statement: 'Generated prompts MUST reference the source ADR ID and specific sections

    (invariant IDs, component IDs) for traceability

    '
  defined_in: ADR-L-0005
  enforced_by: []
  enforcement_level: must
- id: INV-0049
  statement: 'Generated prompts MUST include test requirements from the ADR

    '
  defined_in: ADR-L-0005
  enforced_by: []
  enforcement_level: must
- id: INV-0050
  statement: 'Generated prompts SHOULD include implementation strategy guidance

    (e.g., TDD cycle, dependency injection patterns)

    '
  defined_in: ADR-L-0005
  enforced_by: []
  enforcement_level: should
- id: INV-0051
  statement: 'Prompt generator MUST be deterministic - same ADR input always produces

    same prompt output

    '
  defined_in: ADR-L-0005
  enforced_by: []
  enforcement_level: must
- id: INV-0033
  statement: 'rule-library MUST define canonical schema for cooperative signals

    '
  defined_in: ADR-L-0006
  enforced_by: []
  enforcement_level: must
- id: INV-0034
  statement: 'rule-library MUST support file-based rule and signal handling

    '
  defined_in: ADR-L-0006
  enforced_by: []
  enforcement_level: must
- id: INV-0035
  statement: 'rule-library MUST NOT self-govern; it is governed by ADRs

    '
  defined_in: ADR-L-0006
  enforced_by: []
  enforcement_level: must
- id: INV-0036
  statement: 'Cooperative signal schema MUST include claim, progress, complete,

    wave_complete, validation_ready types

    '
  defined_in: ADR-L-0006
  enforced_by: []
  enforcement_level: must
- id: INV-0037
  statement: 'INV-DOC-001: All human-readable architecture documentation must be generated

    from structured artifacts or explicit projection code that is itself

    governed as source state.

    '
  defined_in: ADR-L-0007
  enforced_by: []
  enforcement_level: must
- id: INV-0038
  statement: 'INV-DOC-002: Generated documentation must be deterministic given identical

    source artifacts and generator inputs.

    '
  defined_in: ADR-L-0007
  enforced_by: []
  enforcement_level: must
- id: INV-0039
  statement: 'INV-DOC-003: Rendered documentation must never be edited manually; changes

    must be made through generators, templates, or structured source artifacts.

    '
  defined_in: ADR-L-0007
  enforced_by: []
  enforcement_level: must
- id: INV-0099
  statement: 'INV-DOC-004: A documentation projection must obtain machine-verifiable

    facts from their owning structured or provider surfaces and must not establish

    an independent authored duplicate of those facts.

    '
  defined_in: ADR-L-0007
  enforced_by: []
  enforcement_level: must
- id: INV-0100
  statement: 'INV-DOC-005: Authored orientation used by a documentation projection
    must

    remain explicit, non-authoritative, and unable to override canonical architecture

    authority.

    '
  defined_in: ADR-L-0007
  enforced_by: []
  enforcement_level: must
- id: INV-0101
  statement: 'INV-DOC-006: Generated documentation freshness must close over all governed

    semantic inputs and projection-rule inputs capable of changing the rendered

    artifact, and must not require whole-repository hashing.

    '
  defined_in: ADR-L-0007
  enforced_by: []
  enforcement_level: must
- id: INV-0102
  statement: 'INV-DOC-007: Repository-specific documentation-projection orientation
    must

    not leak into an unrelated repository scope, including ADR Kit provider

    semantics rendered into an arbitrary consuming repository.

    '
  defined_in: ADR-L-0007
  enforced_by: []
  enforcement_level: must
- id: INV-0040
  statement: 'ADR validation MUST support a structural mode that accepts intentionally

    incomplete drafts when their schema shape is otherwise valid.

    '
  defined_in: ADR-L-0008
  enforced_by: []
  enforcement_level: must
- id: INV-0041
  statement: 'Complete validation MUST remain deterministic and MUST NOT depend on
    LLM

    reasoning.

    '
  defined_in: ADR-L-0008
  enforced_by: []
  enforcement_level: must
- id: INV-0042
  statement: 'Steelman review MUST remain a separate correctness-oriented review layer

    and MUST NOT be conflated with schema validation.

    '
  defined_in: ADR-L-0008
  enforced_by: []
  enforcement_level: must
- id: INV-0043
  statement: 'Canonical architectural authority MUST remain in ADR artifacts (including

    invariants established in logical ADRs). Derived discovery artifacts

    including adrs/index/invariant-registry.yaml MUST NOT independently define

    or redefine invariants. The adrs/invariants/ authoring directory is retired.

    '
  defined_in: ADR-L-0009
  enforced_by: []
  enforcement_level: must
- id: INV-0044
  statement: 'Derived architecture discovery artifacts MUST be deterministic,

    reproducible, and disposable.

    '
  defined_in: ADR-L-0009
  enforced_by: []
  enforcement_level: must
- id: INV-0045
  statement: 'Agent-facing ADR toolkit workflows MUST prefer indexed lookup surfaces

    over raw ADR body traversal by default.

    '
  defined_in: ADR-L-0009
  enforced_by: []
  enforcement_level: must
- id: INV-0052
  statement: 'The compiler''s guaranteed machine-readable contract surface MUST be
    defined

    as all generated artifacts under `adrs/index/` plus `adrs/manifest.yaml`.

    Consumers MAY define narrower minimal load subsets, but those subsets MUST

    NOT be treated as the full guaranteed contract surface.

    '
  defined_in: ADR-L-0010
  enforced_by: []
  enforcement_level: must
- id: INV-0053
  statement: 'Contract validation MUST support profile-based enforcement for greenfield,

    brownfield, and migration without forking the registry schema.

    '
  defined_in: ADR-L-0010
  enforced_by: []
  enforcement_level: must
- id: INV-0054
  statement: 'Bundles classified as sentinel compliant MUST NOT be admitted to production

    kernel loads by default, but MAY be loaded by inspection-only or remediation

    tooling.

    '
  defined_in: ADR-L-0010
  enforced_by: []
  enforcement_level: must
- id: INV-0097
  statement: Compiler projection from canonical architecture state to kernel-facing
    registry artifacts must be deterministic and contract-valid.
  defined_in: ADR-L-0010
  enforced_by: []
  enforcement_level: must
- id: INV-0055
  statement: 'Reserved sentinel values MUST be allowed only in narrative fields or

    sections explicitly designated as sentinel-capable by schema or policy.

    '
  defined_in: ADR-L-0011
  enforced_by: []
  enforcement_level: must
- id: INV-0056
  statement: 'Remediation workflow state MUST be recorded in a separate canonical

    remediation ledger rather than in ADR content fields.

    '
  defined_in: ADR-L-0011
  enforced_by: []
  enforcement_level: must
- id: INV-0057
  statement: 'Once a field or section has an approved remediation-ledger entry for

    non-sentinel canonical content, that field or section MUST NOT regress to a

    sentinel state under normal validation.

    '
  defined_in: ADR-L-0011
  enforced_by: []
  enforcement_level: must
- id: INV-0058
  statement: 'Federation and aggregation layers MUST treat each repository as

    authoritative over its own canonical registries and MUST NOT mutate those

    registries during federation.

    '
  defined_in: ADR-L-0012
  enforced_by: []
  enforcement_level: must
- id: INV-0059
  statement: 'In-process architecture consumers MUST use the ArchitectureRepository

    boundary instead of inventing ad hoc compiled-registry interpretation when

    a repository boundary is available. Cross-language or out-of-process

    consumers MAY consume generated `adrs/index/*` artifacts directly when the

    repository boundary is not available to them.

    '
  defined_in: ADR-L-0013
  enforced_by: []
  enforcement_level: must
- id: INV-0067
  statement: 'Cross-language or out-of-process architecture consumers that rely on
    the

    file-format contract MUST bootstrap from `adrs/index/architecture-index.yaml`,

    MUST require the minimal ingestion subset of `entity-registry.yaml`,

    `relationship-registry.yaml`, `unresolved-registry.yaml`, and

    `adrs/manifest.yaml`, and MUST NOT recreate architecture authority by

    reparsing ADR source YAML when the generated contract bundle is expected.

    Subset registries and `architecture-graph.yaml` MAY be consumed only as

    additive artifacts, and `adrs/entities/registry.yaml` MUST remain

    compatibility-only.

    '
  defined_in: ADR-L-0013
  enforced_by: []
  enforcement_level: must
- id: INV-0074
  statement: 'The supported `adr_kit.api` facade MUST NOT expose `ArchModel`, compiler

    configuration, compiler passes, frontend or backend objects, emitters,

    internal output artifacts, mutable diagnostic logs, compiler caches, or

    other compiler-internal types through public annotations or runtime result

    object graphs.

    '
  defined_in: ADR-L-0013
  enforced_by: []
  enforcement_level: must
- id: INV-0076
  statement: 'Only ADR Kit tooling MAY create or modify canonical artifacts, authoring

    projections, compatibility outputs, or other files inside the

    `adr-architecture-kit` repository. External runtime or workspace tooling MAY

    read supported repository contracts but MUST NOT write anywhere inside any

    repository tree. All runtime-derived and workspace-derived state MUST be

    written beneath the workspace-root `.ste-workspace` directory.

    '
  defined_in: ADR-L-0013
  enforced_by: []
  enforcement_level: must
- id: INV-0060
  statement: 'STE onboarding workflows MUST treat discovery, normalization, canonization,

    regeneration, and validation as distinct phases with canonical artifacts

    updated before derived artifacts are refreshed.

    '
  defined_in: ADR-L-0014
  enforced_by: []
  enforcement_level: must
- id: INV-0061
  statement: 'Rendered markdown artifacts MUST be treated as derived human-facing

    projections and MUST NOT be used as semantic authority when canonical YAML

    source artifacts are available.

    '
  defined_in: ADR-L-0014
  enforced_by: []
  enforcement_level: must
- id: INV-0064
  statement: 'Absence of ADR governance approval fields MUST NOT be interpreted as

    approval or implementation authority.

    '
  defined_in: ADR-L-0015
  enforced_by: []
  enforcement_level: must
- id: INV-0065
  statement: 'Objection override artifacts MUST NOT change ADR architectural meaning
    and

    MUST govern implementation allowance only.

    '
  defined_in: ADR-L-0015
  enforced_by: []
  enforcement_level: must
- id: INV-0066
  statement: 'Derived projections MUST expose only governance IDs and summary metadata
    and

    MUST NOT invent approvals, risks, or authority-altering interpretations.

    '
  defined_in: ADR-L-0015
  enforced_by: []
  enforcement_level: must
- id: INV-0069
  statement: 'Forward-authoring governed alias_id allocation MUST be monotonic and
    non-reusable. Previously allocated aliases and historical gaps remain consumed
    history and MUST NOT be reissued or used to replace UUID identity.

    '
  defined_in: ADR-L-0016
  enforced_by: []
  enforcement_level: must
- id: INV-0071
  statement: 'Reserved ADR alias IDs `9000-9999` MUST NOT participate in standard
    forward alias allocation and MUST NOT be treated as UUID machine-identity allocation.

    '
  defined_in: ADR-L-0016
  enforced_by: []
  enforcement_level: must
- id: INV-0068
  statement: 'Forward authoring ergonomics in adr-architecture-kit MUST target logical,

    physical-system, and physical-component ADRs, while legacy `ADR-P-*`

    support remains compatibility-only.

    '
  defined_in: ADR-L-0017
  enforced_by: []
  enforcement_level: must
- id: INV-0070
  statement: 'ADR IDs `9000-9999` MUST be treated as a reserved exceptional allocation

    range for cases such as brownfield imports, retained legacy artifacts

    pending migration, and other imported records requiring preserved

    identity. Standard forward authoring allocation MUST exclude that range.

    '
  defined_in: ADR-L-0017
  enforced_by: []
  enforcement_level: must
- id: INV-0077
  statement: 'ADR schema v1.0 MUST remain byte-for-byte frozen. Parser dispatch MUST
    resolve

    v1.0 and v1.2 authoring explicitly, MUST preserve the existing provisional

    v1.1 artifact behavior, and MUST reject unsupported future versions without

    falling back to another schema line.

    '
  defined_in: ADR-L-0018
  enforced_by: []
  enforcement_level: must
- id: INV-0078
  statement: 'Substrate bindings, rule bindings, evidence expectations, and external

    references MUST remain authored references. ADR Kit MUST NOT load, copy,

    execute, infer over, or admit external semantic bodies or observed evidence

    as local architecture authority.

    '
  defined_in: ADR-L-0018
  enforced_by: []
  enforcement_level: must
- id: INV-0079
  statement: 'Every newly projected relationship assertion MUST receive an assertion_id
    using UUID endpoint and single source-owner inputs from DEC-0086, while compatibility
    relationship_id semantics remain endpoint-derived from UUIDs.

    '
  defined_in: ADR-L-0018
  enforced_by: []
  enforcement_level: must
- id: INV-0080
  statement: 'Topology migration MUST be deterministic, idempotent, non-destructive
    by

    default, explicit about rewritten references, and fail closed on duplicate IDs,

    ambiguous names, or dangling endpoints. It MUST NOT use probabilistic or LLM

    resolution.

    '
  defined_in: ADR-L-0018
  enforced_by: []
  enforcement_level: must
- id: INV-0081
  statement: 'The normalized projectable entity vocabulary MUST be exactly `adr`,
    `system`,

    `component`, `decision`, `capability`, `invariant`, `boundary`, `contract`,

    `interface`, and `implementation_decision` for Phase 2. The relationship

    vocabulary is closed; the only newly authorized verbs are `binds_substrate`,

    `binds_rule`, `expects_evidence`, `provides_interface`, `consumes_interface`,

    and `composed_of`, and a compiler MUST emit one only from an actual authored

    extraction path.

    '
  defined_in: ADR-L-0018
  enforced_by: []
  enforcement_level: must
- id: INV-0082
  statement: 'ADR Kit MUST fail closed on duplicate UUID identity and MUST limit automatic
    repair to governed alias allocation/history; alias repair MUST NOT rewrite UUID
    references or mint replacement UUIDs.

    '
  defined_in: ADR-L-0018
  enforced_by: []
  enforcement_level: must
- id: INV-0094
  statement: Every admitted v1.3 entity's canonical machine identity is a lowercase
    RFC 9562 UUIDv7.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0009
  statement: A canonical entity UUID is immutable for the entity's lifetime.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0010
  statement: '`alias_id`, `alias_name`, and derived `alias_ref` are human-recognition
    surfaces, not canonical machine identity.'
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0011
  statement: Canonical authored entity references and normalized relationship endpoints
    use UUIDs.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0012
  statement: An authorized alias change does not change canonical UUID identity.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0013
  statement: An alias change never rewrites canonical UUID references or normalized
    UUID relationship endpoints; only derived alias presentation regenerates.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0062
  statement: The derived logical URI is a resolver key and is not entity identity.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0063
  statement: Every normalized identity-bearing entity exposes explicit type; a polymorphic
    authored record authors type when enclosing context is insufficient, while monomorphic
    authored schema position remains canonical type authority and `alias_id` alone
    never determines type.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0084
  statement: '`alias_ref` is always derived from `alias_id` and `alias_name` and is
    never canonical authored data.'
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0085
  statement: '`alias_name` provides recognition metadata and never defines or substitutes
    for architectural meaning.'
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0086
  statement: Derived `created_at` denotes the beginning of the v1.3 identity record
    at UUIDv7 mint time, not historical architecture creation time.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0087
  statement: Derived `created_at` is decoded from the UUIDv7 Unix-millisecond timestamp,
    leaving no separately authored value to reconcile.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0088
  statement: The constraint that canonical `updated_at` cannot precede `created_at`
    is deferred with canonical `updated_at` to transactional-authoring governance
    and is not a v1.3 identity invariant.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: may
- id: INV-0089
  statement: Regenerating derived artifacts never mutates canonical identity or v1.3
    identity time semantics.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0090
  statement: Two semantically distinct records claiming one UUID fail closed; ADR
    Kit does not choose a keeper or mint a replacement automatically.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0091
  statement: A duplicate local `alias_id` across distinct UUIDs is a governed allocation
    conflict; without an admitted incumbent it fails admission pending reviewed allocation,
    while cross-namespace overlap is not a collision.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0092
  statement: Alias recovery or reallocation never replaces an already valid canonical
    UUID.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0093
  statement: Alias recovery or reallocation never rewrites canonical UUID relationship
    endpoints.
  defined_in: ADR-L-0019
  enforced_by: []
  enforcement_level: must
- id: INV-0103
  statement: 'Raw v1.5 attribution claims MUST include relationship, lowercase UUIDv7

    target_entity_id, and confidence

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0104
  statement: 'Architecture-aware v1.5 validation MUST fail closed when a claim UUID
    is

    missing, an alias or alias_ref is used as target_entity_id, or optional

    asserted type mismatches the resolved type

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0105
  statement: 'A v1.5 claim MUST be rejected when the resolved target entity type is
    not

    admitted for that relationship by the mechanical vocabulary

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0106
  statement: 'v1.5 evidence verbs MUST NOT be written into architecture relationship

    registries or treated as RelationshipRecordV2.relationship_type

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0107
  statement: 'Duplicate (relationship, target_entity_id) within one attribution record

    MUST be an error

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0108
  statement: 'Identical semantic triple and identical provenance across records MUST
    be

    an error; distinct provenance MUST keep both records

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0109
  statement: 'Implementation attribution declarations MUST NOT be treated as proof
    that

    the named architecture constraint is enforced

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0110
  statement: 'Legacy alias decorators and evidence extractors MUST NOT load

    ArchitectureRepository or synthesize canonical UUID claim metadata from

    alias arguments

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0111
  statement: 'Canonical normalized v1.5 output MUST be sorted by the documented total

    order and MUST be idempotent under repeated normalization

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0112
  statement: 'Equivalent legacy-alias and UUID declarations for the same implementation

    edge MUST NOT be dual-encoded on one surface

    '
  defined_in: ADR-L-0020
  enforced_by: []
  enforcement_level: must
- id: INV-0128
  statement: Canonical schema membership and SHA-256 fingerprints are unchanged by
    taxonomy relocation.
  defined_in: ADR-L-0021
  enforced_by: []
  enforcement_level: must
- id: INV-0129
  statement: Every canonical schema artifact has one authoritative repository path
    and at most one explicit package mirror mapping.
  defined_in: ADR-L-0021
  enforced_by: []
  enforcement_level: must
- id: INV-0130
  statement: Every record that participates or may participate as a node or edge in
    the system graph has an immutable lowercase RFC 9562 UUIDv7 `id`, a governed `alias_id`,
    and a human-oriented `alias_name` before graph admission.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0131
  statement: Canonical entity references and relationship endpoints use UUIDs rather
    than aliases or owner-local keys.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0132
  statement: Human aliases orient and resolve for presentation but never define canonical
    identity or retarget a reference.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0133
  statement: Owner-local value objects are explicitly ineligible for graph participation,
    have no entity identity, and name any local structural handle as a key rather
    than an id.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0134
  statement: Every graph projection reuses a persisted canonical node or edge UUID;
    only explicitly non-graph diagnostics may use deterministic keys, and generators
    do not mint canonical identity without canonical authority.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0135
  statement: Every new or revised schema declares graph eligibility and entity value-object
    and projection boundaries and mechanically enforces the universal identity invariant.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0136
  statement: Identity migration mints each entity UUID once from a reviewed sealed
    map and proves reference and semantic parity after atomic application.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0137
  statement: No legacy schema package namespace parser mode public compatibility shim
    or corpus format is removed without explicit reviewed disposition.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0138
  statement: Effective relationships and relationship assertions are distinct graph-eligible
    entities, each with its own UUIDv7 identity and alias envelope; fingerprints are
    not identity.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0139
  statement: Generated inverse traversal reuses the effective relationship UUID and
    is a DERIVED_PROJECTION unless an independently authored inverse is governed as
    a separate entity.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
- id: INV-0140
  statement: Universal identity migration remains blocked until collision, vNext,
    graph, allocation-contract, and allocation-map seal gates are explicitly approved
    and evidence is sealed.
  defined_in: ADR-L-0022
  enforced_by: []
  enforcement_level: must
