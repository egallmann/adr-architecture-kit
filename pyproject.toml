[project]
name = "adr-architecture-kit"
version = "0.4.1"
description = "Authoring-time STE toolkit: validate structured ADR YAML, emit discovery outputs and Architecture IR fragments (ste-spec). Pre-1.0 Alpha."
authors = [{name = "Erik Gallmann"}]
maintainers = [{name = "Erik Gallmann"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
readme = "README.md"
keywords = ["architecture", "adr", "ste", "decision-records", "governance", "architecture-decision-records"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "jinja2>=3.1",
    "click>=8.0",
    "rfc8785>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black==26.5.1",
    "ruff==0.15.15",
    "mypy==2.1.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.0",
    "pip-audit>=2.7",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/egallmann/adr-architecture-kit"
Repository = "https://github.com/egallmann/adr-architecture-kit"

[project.scripts]
adr = "adr_kit.cli.main:cli"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adr_kit" = ["py.typed"]
"adr_kit.schema.v1_0" = ["*.json"]
"adr_kit.schema.v1_1" = ["*.json"]
"adr_kit.schema.v1_2" = ["*.json"]
"adr_kit.schema.v1_3" = ["*.json"]
"adr_kit.schema.v2_0" = ["*.json"]
"adr_kit.schema.migrations" = ["*.json"]
"adr_kit.templates" = ["*.jinja2", "*.yaml"]
"adr_kit.promotion.rules" = ["*.json"]
"adr_kit.promotion.schemas" = ["*.json"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
