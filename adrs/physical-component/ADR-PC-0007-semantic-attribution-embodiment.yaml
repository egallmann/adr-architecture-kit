context: |
  Semantic attribution needs a kit-owned embodiment for vocabulary, evidence
  models, UUID decorators, standalone shims, architecture-aware validation,
  and repository-aware 1.0/1.2 normalization. This component does not parse
  consumer source code and does not own RECON extraction.
technology_stack:
- category: language
  name: Python
  version: '3.11'
  rationale: Existing implementation language.
- category: library
  name: Pydantic
  version: 2.x
  rationale: Typed evidence and claim models.
- category: library
  name: jsonschema
  version: 4.x
  rationale: Structural schema validation for 1.0/1.2/1.5 evidence.
component_specifications:
- id: 019ffdba-3c42-75d5-b93b-f32f35152e32
  name: Semantic Attribution Embodiment
  type: library
  responsibilities: |
    - Load the mechanical v1.5 semantic attribution vocabulary
    - Parse and validate 1.0/1.2/1.5 implementation attribution evidence
    - Provide UUID claim decorators and vocabulary-driven Python/TypeScript shims
    - Resolve claim targets against ArchitectureRepository / model 2.0
    - Normalize legacy alias evidence into canonical v1.5 claims
  generation_context:
    purpose: Embody ADR-L-0020 without moving source parsing into this repository.
    key_responsibilities:
    - Keep legacy alias decorators as metadata-only producers
    - Compose `__architecture_attribution_claims__` only from UUID decorators
    - Fail closed on unresolved UUIDs, illegal matrix pairs, and true duplicates
    constraints:
    - Must not load architecture state from legacy decorators or shim generation
    - Must not write relationship registries or Architecture IR from evidence verbs
    - Must not add an adr_kit.api attribution operation in this slice
    success_criteria:
    - 1.0/1.2 callers of validate_implementation_attribution_evidence remain compatible
    - v1.5 validation requires UUID/type-capable context
    - Python and TypeScript shims are generated from one vocabulary
  interfaces:
  - id: 019ffdba-3c42-77f6-903f-7753342c5b5f
    type: library_api
    specification: |
      Public and de facto public surfaces:

      - adr_kit.decorators implements/enforces/embodies UUID APIs
      - adr_kit.decorators legacy implements_adr / enforces_invariant APIs
      - validate_implementation_attribution_evidence
      - normalize_attribution_evidence
      - schema/evidence-attribution/v1.5 vocabulary and evidence JSON
    alias_id: IFACE-0034
    alias_name: iface-0034
  - id: 019ffdba-3c42-7d5b-b52f-b36c3000f299
    type: CLI
    specification: |
      Commands:

      - adr attribution check
      - adr attribution coverage
      - adr attribution generate-shim
      - adr attribution workspace-report
      - adr attribution normalize-evidence --scope --input [--output]
    alias_id: IFACE-0035
    alias_name: iface-0035
  implementation_identifiers:
    module_path: src/adr_kit/decorators.py
    entry_point: src/adr_kit/cli/main.py
    test_path: tests/test_semantic_attribution_vocabulary_parity.py
  implementation_requirements:
    error_handling:
      strategy: Fail closed on invalid schema, unresolved UUID, illegal matrix pair, and true duplicate evidence.
    observability:
      logging:
        level: info
        structured: false
      metrics:
      - name: attribution_validations_total
        type: counter
    testing_requirements:
      unit_test_coverage: '>= 80%'
      integration_tests: |
        - Vocabulary parity across schema, Pydantic, decorators, and shims
        - Legacy decorator no architecture load
        - Repository-aware 1.0/1.2 normalization idempotency
  alias_id: COMP-0022
  alias_name: semantic-attribution-embodiment
implementation_decisions:
- id: 019ffdba-3c42-7e86-a03e-f7df07da6757
  summary: Generate Python and TypeScript shims from the v1.5 vocabulary
  rationale: |
    Hand-copied shim strings drift from native decorators. One mechanical
    vocabulary is the source for relationship names, allowed types, and
    generated standalone shims.
  alias_id: IMPL-0028
  alias_name: generate-python-and-typescript-shims-from-the-v15-vocabulary
- id: 019ffdba-3c42-7021-923f-bf8e6bd06d07
  summary: Keep legacy alias decorators separate from UUID claim composition
  rationale: |
    Last-write-wins legacy metadata remains a Stable surface. New UUID
    decorators compose `__architecture_attribution_claims__` with
    `confidence: declared` and must not overwrite `__implements_adrs__` or
    `__enforces_invariants__`.
  alias_id: IMPL-0029
  alias_name: keep-legacy-alias-decorators-separate-from-uuid-claim-composition
gaps: []
alias_id: ADR-PC-0007
alias_name: semantic-attribution-embodiment
