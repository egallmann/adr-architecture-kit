schema_version: "1.0"
adr_type: logical
id: ADR-L-0002
title: ADR Projection Frontmatter Contribution to adr-architecture-kit
status: proposed
created_date: "2026-03-08"
last_modified: "2026-03-08"
authors:
  - "@egallmann"

projection_signals:
  - governance
  - rules
  - adr-schema
  - ste-integration

context: |
  ste-rules-library consumes ADRs to build rules. For rule projection to work,
  ADRs must declare which context signals activate their derived rules. This
  requires adr-architecture-kit to support projection metadata in ADR frontmatter.
  
  Contribution: ste-rules-library proposes schema extensions for adr-architecture-kit
  that enable AI-first, projection-aware ADRs.

domains:
  - governance
  - schema
  - ste-integration

tags:
  - projection
  - adr-schema
  - contribution
  - ai-first

decisions:
  - id: DEC-0001
    summary: Propose projection_signals in adr-common.schema.json
    rationale: |
      ADRs that generate rules need to declare activation signals. When
      ste-rules-library or Rules & Signal Service parses ADRs, projection_signals
      drive which rules activate for which context.
    consequences:
      positive:
        - adr-architecture-kit adds optional projection_signals to adr-common
        - ADRs can declare signals (python, scope-resolution, traceability)
        - Rule projection becomes ADR-driven

  - id: DEC-0002
    summary: Propose ai_projectable in adr-common.schema.json
    rationale: |
      AI-first design: ADRs should support minimal-context projection for LLMs.
      ai_projectable hints (minimal_sections, primary_domains) enable
      ste-rules-library and prompt translator to project optimal context.
    consequences:
      positive:
        - ADRs declare which sections are essential for AI
        - Context-constrained projection (e.g. 4K tokens) can prioritize
        - Prompt translator can use for implementation prompts

  - id: DEC-0003
    summary: Rule schema consumes ADR projection metadata
    rationale: |
      When rules are derived from ADRs, rule.signals = ADR.projection_signals.
      rule.source_adr links to ADR. Enables traceability ADR -> rule -> projection.
    consequences:
      positive:
        - Rules carry ADR provenance
        - Activation is declarative, not manual

invariants:
  - id: INV-0003
    statement: |
      Rules derived from ADRs MUST populate signals from ADR projection_signals
    scope: global
    enforcement_level: must
    enforcement_mechanism: design
    verification_method: automated
    rationale: Activation signals flow from ADR to rule.

related_adrs:
  - ADR-L-0001
  - ADR-L-0006
