name: ADR Governance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-adrs:
    name: Validate ADR Schema Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,cli]
          pip install pip-audit

      - name: Validate ADR schema compliance
        run: |
          adr validate --cross-references

      - name: Run governance contract checks
        run: |
          adr governance-checks

      - name: Validate generated documentation
        run: |
          adr validate-generated-docs

      - name: Validate system overview
        run: |
          adr validate-system-overview

      - name: Audit runtime hygiene
        run: |
          python scripts/check_runtime_hygiene.py --fail-on-outdated

  validate-project-metadata:
    name: Validate PROJECT.yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[cli]

      - name: Validate PROJECT.yaml
        run: |
          adr validate-project-metadata
