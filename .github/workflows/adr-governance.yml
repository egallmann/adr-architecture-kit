name: ADR Governance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-tests:
    name: Source install / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - name: Exercise portable source/SDK compatibility harness
        run: python scripts/run_source_compat.py

  governance:
    name: ADR, generated artifact, and contract governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: adr repair-canonical-ids --check
      - run: adr governance-checks --skip-tests
      - run: adr validate-generated-docs
      - run: adr validate-system-overview

  coverage:
    name: Canonical package coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python -m pytest --cov=adr_kit --cov-report=term-missing --cov-fail-under=80

  os-portability:
    name: OS portability / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python -m pytest

  quality-ratchets:
    name: Ruff / mypy / Black no-regression ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python scripts/check_quality_ratchets.py

  dependency-audit:
    name: Project dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python -m pip_audit .

  release-artifacts:
    name: Build and validate the retained release bundle once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python scripts/check_version_consistency.py
      - name: Build retained bundle once
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          epoch = subprocess.check_output(["git", "log", "-1", "--format=%ct"], text=True).strip()
          ver = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          os.environ["SOURCE_DATE_EPOCH"] = epoch
          out = Path("python-dist")
          out.mkdir(exist_ok=True)
          subprocess.check_call([os.environ.get("PYTHON", "python"), "-m", "build", "--outdir", str(out)])
          sdist = next(out.glob("*.tar.gz"))
          subprocess.check_call(
              [
                  os.environ.get("PYTHON", "python"),
                  "scripts/release_manifest.py",
                  "normalize-sdist",
                  "--sdist",
                  str(sdist),
                  "--source-date-epoch",
                  epoch,
              ]
          )
          wheel = next(out.glob("*.whl"))
          subprocess.check_call(
              [os.environ.get("PYTHON", "python"), "-m", "twine", "check", str(wheel), str(sdist)]
          )
          subprocess.check_call(
              [
                  os.environ.get("PYTHON", "python"),
                  "scripts/release_manifest.py",
                  "create",
                  "--dist-dir",
                  "python-dist",
                  "--output",
                  "release-manifest.json",
                  "--source-commit",
                  os.environ["GITHUB_SHA"],
                  "--version",
                  ver,
              ]
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            python-dist/
            release-manifest.json
          if-no-files-found: error

  wheel-smoke:
    name: Retained wheel / Python ${{ matrix.python-version }}
    needs: release-artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle
      - name: Exercise exact retained wheel
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          wheels = sorted((Path("release-bundle") / "python-dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, found {len(wheels)}")
          subprocess.check_call([sys.executable, "scripts/test_installed_wheel.py", "--wheel", str(wheels[0])])
          described = subprocess.check_output(
              [sys.executable, "scripts/test_installed_wheel.py", "--describe"], text=True
          )
          if "sdk-consumer" not in described:
              raise SystemExit("sdk-consumer probe missing")
          PY

  os-wheel-smoke:
    name: Retained wheel OS / ${{ matrix.os }} / Python 3.12
    needs: release-artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle
      - name: Exercise exact retained wheel
        run: |
          python -c "import subprocess,sys; from pathlib import Path; wheels=sorted((Path('release-bundle')/'python-dist').glob('*.whl')); assert len(wheels)==1, wheels; subprocess.check_call([sys.executable,'scripts/test_installed_wheel.py','--wheel',str(wheels[0])])"

  reproducibility:
    name: Fixed-epoch distribution reproducibility
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1767225600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build --outdir "${{ runner.temp }}/build-one"
      - run: python -m build --outdir "${{ runner.temp }}/build-two"
      - name: Normalize and compare
        run: |
          python - <<'PY'
          import hashlib
          import os
          import subprocess
          import sys
          from pathlib import Path

          epoch = os.environ["SOURCE_DATE_EPOCH"]
          temp = Path(os.environ["RUNNER_TEMP"])
          for name in ("build-one", "build-two"):
              sdist = next((temp / name).glob("*.tar.gz"))
              subprocess.check_call(
                  [
                      sys.executable,
                      "scripts/release_manifest.py",
                      "normalize-sdist",
                      "--sdist",
                      str(sdist),
                      "--source-date-epoch",
                      epoch,
                  ]
              )
          a = sorted((temp / "build-one").iterdir())
          b = sorted((temp / "build-two").iterdir())
          ha = [hashlib.sha256(path.read_bytes()).hexdigest() for path in a]
          hb = [hashlib.sha256(path.read_bytes()).hexdigest() for path in b]
          print(dict(zip([path.name for path in a], ha)))
          sys.exit(ha != hb)
          PY

  benchmark-smoke:
    name: Deterministic benchmark functional smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python benchmarks/phase0.py --corpus synthetic --sizes 10 --warmups 0 --repeats 1 --json-out benchmark-smoke.json
