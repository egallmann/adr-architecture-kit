[project]
name = "adr-architecture-kit"
version = "0.1.0"
description = "STE-compliant toolkit for machine-verifiable Architecture Decision Records"
authors = [{name = "Erik Gallmann"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

cli = [
    "click>=8.0",
]

[project.scripts]
adr = "adr_kit.cli.main:cli"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
