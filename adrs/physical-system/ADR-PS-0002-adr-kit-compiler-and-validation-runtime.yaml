context: 'ADR-Kit provides authoring, validation, compilation, and peer Python and
  TypeScript/Node host capabilities. Rust/WASM semantic-core is the canonical
  meaning-bearing execution authority shared by those hosts. Hosts acquire source
  facts such as filesystem scope and YAML input, adapt them to the versioned core
  protocol, and present deterministic results. The core owns shared semantic
  validation and execution, including schema execution required by the core,
  semantic-contract operations, authoring construction, architecture
  interpretation, materialization, and canonical architecture-rule validation.

  This system boundary includes host-side compiler orchestration, repository
  access, generated-artifact integrity, the CLI, and supported Python and
  TypeScript/Node bindings. The semantic core does not traverse consumer
  filesystems, acquire YAML, write repositories, perform governance admission,
  present CLI output, or observe Runtime state. Hosts do not recreate core-owned
  meaning. Discovery and indexing remain covered by ADR-PS-0001. The Rust crate
  and WASM artifact are implementation mechanisms behind the shared semantic
  boundary, not Rust-native public SDK contracts.'
