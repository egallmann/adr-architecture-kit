schema_version: "1.0"
adr_type: logical
id: ADR-L-0001
title: Three-Layer Activation and Cooperative Signals
status: proposed
created_date: "2026-03-08"
last_modified: "2026-03-08"
authors:
  - "@egallmann"

context: |
  AI governance fails when rules exist but are not activated at the right time.
  This ADR defines ste-rules-library as the activation and coordination hub for
  the STE ecosystem, integrating with adr-architecture-kit (ADR-L-0006) and
  ste-runtime.
  
  Two signal semantics:
  - Context signals: drive rule selection (file, language, domain)
  - Cooperative signals: agent coordination (claim, progress, wave_complete)

domains:
  - governance
  - rules
  - signals

tags:
  - activation
  - signals
  - ste-integration

decisions:
  - id: DEC-0001
    summary: Three-Layer Activation Model
    rationale: |
      Layer 1: Organizational (always-on, external)
      Layer 2: Project rules (conditional, from this repo)
      Layer 3: Runtime projection (context signals select relevant rules)
    consequences:
      positive:
        - governance/manifest.yaml defines authority and conflict strategy
        - Rules selected by context signals at runtime

  - id: DEC-0002
    summary: Cooperative Signals as First-Class
    rationale: |
      Agents (Cursor, CODEX) need to coordinate when implementing in parallel.
      Signal types: claim, progress, complete, wave_complete, validation_ready.
    consequences:
      positive:
        - schema/signal.schema.json is canonical
        - scripts/emit-signal.py for agent emission
        - File-based until MCP/RSS

  - id: DEC-0003
    summary: Conflict Escalation, No Auto-Resolution
    rationale: |
      Conflicting rules escalate to human. Never auto-resolve.
    consequences:
      positive:
        - governance/manifest.yaml defines escalationPosture as halt

  - id: DEC-0004
    summary: Meta-Governance via ADRs
    rationale: |
      This repo is governed by ADRs, not self-governed.
    consequences:
      positive:
        - adrs/ define correctness
        - Rules validated against ADRs

invariants:
  - id: INV-0001
    statement: |
      signal.schema.json MUST define cooperative signal types
    scope: global
    enforcement_level: must
    enforcement_mechanism: design
    verification_method: automated
    rationale: Canonical format for prompt translator and agents.

  - id: INV-0002
    statement: |
      File-based rule and signal handling MUST be supported
    scope: global
    enforcement_level: must
    enforcement_mechanism: design
    verification_method: automated
    rationale: Works without MCP or RSS.

related_adrs:
  - ADR-L-0006
