gaps:
- id: GAP-0001
  question: Decorator library not yet implemented
  context: 'Classification: real gap. No adr_kit.decorators module exists yet.'
  impact: high
  blocking: true
- id: GAP-0002
  question: Downstream implementation attribution evidence requires broader extractor coverage
  context: 'Classification: narrowed gap. ste-runtime / RECON now emits architecture-intent
    attribution records for parsed decorator metadata, but coverage across all supported
    implementation artifact classes remains staged.'
  impact: medium
  blocking: false
- id: GAP-0003
  question: Legacy onboarding rollout for adr-architecture-kit itself is not yet started
  context: 'Classification: deferred gap. The repo needs an explicit first-wave annotation
    plan before broad decorator rollout.'
  impact: medium
  blocking: false
- id: GAP-0004
  question: ste-rules-library activation for intent-attribution enforcement remains staged
  context: 'Classification: deferred gap. Downstream rule activation may be useful later,
    but it should consume ADR-Kit authority rather than redefine it.'
  impact: medium
  blocking: false
notes: "Implementation phases:\n\nPhase 1: Decorator Library (ADR-P-0004)\n- Create\
  \ adr_kit.decorators module\n- Implement @implements_adr and @enforces_invariant\n\
  - Add language-level examples without forcing broad annotation yet\n\nPhase 2:\
  \ Evidence Contract + Validation\n- Define implementation attribution evidence\
  \ schema in adr-architecture-kit\n- Validate evidence against canonical ADR state\
  \ with profile-aware onboarding semantics\n- Keep attribution authority in ADR-Kit,\
  \ not in downstream extractors\n\nPhase 3: Downstream Extraction (ste-runtime)\n\
  - Extract decorators / metadata from code and infrastructure artifacts\n- Emit\
  \ implementation attribution evidence and slice claims with provenance\n- Preserve\
  \ provenance for EDR and drift analysis\n\nPhase 4: Legacy Onboarding\n- Identify\
  \ in-scope implementation surfaces per repo\n- Roll out attribution starting with\
  \ public boundaries and high-authority modules\n- Use greenfield, brownfield,\
  \ and migration profiles to control enforcement\n\nPhase 5: Optional Rule Activation\
  \ (ste-rules-library)\n- Encode reusable rule activation only after the authority\
  \ and evidence contracts are stable\n- Keep downstream delivery additive rather\
  \ than redefining semantics\n\nExample code attribution:\n```python\n@implements_adr(\"\
  ADR-L-0002\", \"ADR-P-0003\")\n@enforces_invariant(\"INV-0015\", \"INV-0018\")\n\
  class ProjectScopeResolver:\n      pass\n```\n\nExample infrastructure attribution:\n\
  ```yaml\nMetadata:\n  implements_adr:\n    - ADR-L-0001\n    - ADR-PS-0001\n```\
  \n"
