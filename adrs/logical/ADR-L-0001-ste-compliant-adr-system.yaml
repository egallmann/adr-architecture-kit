  alias_id: CAP-0007
  alias_name: correction-agent-context
architectural_boundaries:
- id: 019fee89-e614-7304-881c-fdc95e14e704
  name: Logical vs Physical Separation
  description: 'Strict separation between conceptual design (logical) and implementation

    specifications (physical). Enforced through distinct schemas and validation.

    '
  rationale: 'Prevents implementation bias in architectural thinking. Enables architectural

    decisions to be made independently of technology constraints. Supports multiple

    physical implementations of a single logical design.

    '
  alias_id: BOUND-0001
  alias_name: logical-vs-physical-separation
- id: 019fee89-e614-795f-a62b-d6d1ebcdd6ac
  name: ADR Kit vs ste-runtime Separation
  description: 'ADR Kit defines structure and validates schema. ste-runtime extracts
    graph

    via RECON. Clear separation of concerns.

    '
  rationale: 'ADR Kit focuses on artifact structure and validation. Graph extraction
    is

    ste-runtime''s responsibility. Enables independent evolution of schema and

    graph implementation.

    '
  alias_id: BOUND-0002
  alias_name: adr-kit-vs-ste-runtime-separation
- id: 019fee89-e614-7a79-aa1e-8ad7395cf4f2
  name: Frontmatter as Authority
  description: 'All discovery metadata lives in ADR frontmatter (single source of
    truth).

    Manifest is derived, never manually edited.

    '
  rationale: 'Prevents drift between ADR and manifest. Atomic updates (metadata +
    content

    change together). Version controlled metadata. Schema-validated correctness.

    '
  alias_id: BOUND-0003
  alias_name: frontmatter-as-authority
interaction_contracts:
- id: 019fee89-e615-74df-8433-acb8769aa8a6
  parties:
  - adr-kit
  - ste-runtime
  protocol: YAML artifact structure
  guarantees: 'ADR Kit guarantees:

    - Valid YAML with explicit structure

    - Schema-validated before commit

    - Type-prefixed human-recognition aliases (ADR-L-XXXX, ADR-P-XXXX) distinct from
    canonical UUID machine identity

    - Explicit relationships (array fields for graph edges)

    - Rich frontmatter with all metadata


    ste-runtime guarantees:

    - RECON discovers adrs/ directory

    - Parses YAML into graph nodes and edges

    - Exposes graph via MCP for queries

    - Validates graph extraction success

    '
  alias_id: CONTRACT-0001
  alias_name: contract-0001
- id: 019fee89-e615-70d2-ad37-4be4c7277ebc
  parties:
  - adr-kit
  - json-schema
  protocol: JSON Schema validation
  guarantees: 'ADR Kit guarantees:

    - All ADRs validate against schema before commit

    - Schema violations = CI failure

    - No ambiguous or optional validation


    JSON Schema guarantees:

    - Deterministic validation (same input = same result)

    - Clear error messages with field paths

    - Extensible for future schema evolution

    '
  alias_id: CONTRACT-0002
  alias_name: contract-0002
constraints:
- id: CONST-0001
  type: technical
  description: 'YAML with embedded markdown, not markdown with YAML frontmatter.

    '
  rationale: 'Deterministic structure for AI reasoning. Direct field access without
    markdown

    parsing ambiguity. Schema validation before processing. Clear separation of

    metadata vs content.

    '
- id: CONST-0002
  type: technical
  description: 'Type-prefixed IDs (ADR-L-XXXX, ADR-P-XXXX) are governed human-recognition
    aliases with 4-digit numbering; canonical machine identity is UUID.

    '
  rationale: 'Prevents alias collision between logical and physical ADRs while keeping
    type visible in the human alias. Canonical machine operations and graph node identity
    resolve to UUID, not the type-prefixed alias.

    '
- id: CONST-0003
  type: business
  description: 'Dogfooding from day 1 - this project documents itself using ADR Kit.

    '
  rationale: 'Real friction drives design. If we can''t document our decisions, the
    schema is

    incomplete. Validates STE compliance through actual usage. Living specification.

    '
- id: CONST-0004
  type: technical
  description: 'Schema must support future use cases without breaking changes.

    '
  rationale: 'ADR Kit is meta-system - schema authority for architecture encoding.
    Schema

    evolution must be backward compatible (optional fields, version signaling).

    Enables PROJECT.yaml, Decision ADRs, policy validation, correction agents.

    '
