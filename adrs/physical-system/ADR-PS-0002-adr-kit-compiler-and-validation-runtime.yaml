context: |
  adr-architecture-kit operates as an authoring-time compiler and validation system rather
  than a collection of unrelated generators. The implementation includes an
  explicit compiler pipeline, contract validation, normalized repository/model
  access, integrity verification, and CLI orchestration over those surfaces.

  This ADR establishes the concrete authoring/compiler system boundary for those public
  capabilities. Discovery and indexing remain covered by ADR-PS-0001; this ADR
  covers the authoring/compiler implementation that powers canonical parsing,
  compilation, repository loading, contract checks, and artifact integrity.

  The boundary explicitly excludes Assembler behavior, runtime observation or
  evidence extraction, rules execution, substrate management, admission decisions,
  MCP surfaces, and LLM responsibilities. Those belong to later work or sibling
  systems and must not be introduced by Phase 0 production hardening.
technology_stack:
- category: language
  name: Python
  version: '3.11'
  rationale: Existing implementation language for compiler and validator code.
- category: tooling
  name: Click
  version: 8.x
  rationale: Existing CLI surface for compile and validate operations.
- category: library
  name: Pydantic
  version: 2.x
  rationale: Typed canonical models and validation.
- category: library
  name: jsonschema
  version: 4.x
  rationale: Structural schema validation for canonical artifacts.
system_boundaries:
- id: SYSBOUND-0002
  name: Authoring Compiler and Validation Boundary
  description: |
    Encapsulates canonical ADR parsing, compiler orchestration, schema and
    contract validation, normalized repository access, and generated artifact
    integrity validation. It does not perform runtime extraction, rules,
    substrate, admission, MCP, LLM, or Assembler responsibilities.
  external_dependencies:
  - Canonical ADR artifacts
  - Canonical invariant artifacts
  - Generated registry bundles
  exposed_interfaces:
  - adr compile
  - adr validate
  - adr validate-contract
  - adr validate-project-metadata
  - adr entities *
component_topology:
  components:
  - name: Schema and Contract Validation Component
    type: service
    purpose: Validates canonical ADR structure and contract expectations.
    implements_adr: ADR-PC-0002
  - name: Compiler Pipeline Component
    type: service
    purpose: Builds and emits deterministic architecture compilation outputs.
    implements_adr: ADR-PC-0003
  - name: Repository Boundary Component
    type: service
    purpose: Loads and serves normalized semantic state for in-process consumers.
    implements_adr: ADR-PC-0004
  - name: Integrity Validation Component
    type: service
    purpose: Verifies generated artifact freshness and tamper integrity.
    implements_adr: ADR-PC-0005
  relationships:
  - from: Canonical ADR artifacts
    to: Schema and Contract Validation Component
    type: depends_on
    description: Validation consumes canonical source artifacts.
  - from: Schema and Contract Validation Component
    to: Compiler Pipeline Component
    type: depends_on
    description: Compilation assumes structurally valid canonical input.
  - from: Compiler Pipeline Component
    to: Repository Boundary Component
    type: depends_on
    description: Repository consumers rely on compiled bundle artifacts.
  - from: Compiler Pipeline Component
    to: Integrity Validation Component
    type: depends_on
    description: Integrity validation checks compiler-owned artifacts.
operational_requirements:
  monitoring: Deterministic validation and compilation output with explicit diagnostics.
  logging: CLI-visible diagnostic logging with fail-closed validation behavior.
gaps: []

