context: 'adr-architecture-kit is primarily machine-facing tooling used by agents
  to

  reason over canonical architecture artifacts. Relying on agents to scan raw

  ADR bodies for discovery is inconsistent with the toolkit''s AI-first design

  theory: discovery surfaces should be explicit, deterministic, cheap to query,

  and derived from canonical authority.


  The kit already provides `manifest.yaml`, the normalized index family under

  `adrs/index/`, and a legacy compatibility registry. What was missing was an

  explicit architectural decision that separates broad discovery, normalized

  lookup, guaranteed contract outputs, and compatibility-only projections so

  downstream consumers do not guess which generated surfaces are authoritative.

  '
decisions:
- id: 019fee89-e616-71a7-b73f-33795a11494e
  summary: Use derived discovery artifacts for agent-facing architecture lookup
  rationale: 'Canonical authority remains in ADR artifacts (including ADR-established

    invariant entities). Agents should interact with derived, machine-stable

    discovery artifacts (including the invariant-registry) by default.

    Standalone invariant files are not authority. This reduces scan cost,

    ambiguity, and ad hoc parsing logic.

    '
  alias_id: DEC-0014
  alias_name: use-derived-discovery-artifacts-for-agent-facing-architecture-lookup
- id: 019fee89-e616-7763-be39-197b4590ca50
  summary: Treat manifest as a guaranteed discovery surface within the compiler contract
    family
  rationale: 'The manifest is the first discovery surface used by humans and agents
    for

    scope inventory, freshness checks, and lifecycle summaries. It remains a

    discovery artifact rather than a normalized semantic payload, but its

    presence and format are guaranteed within the compiler contract family.

    '
  alias_id: DEC-0021
  alias_name: treat-manifest-as-a-guaranteed-discovery-surface-within-the-compiler-contract-family
- id: 019fee89-e616-77a2-8a1b-ad4d3a7e4265
  summary: Use `adrs/index/entity-registry.yaml` as the normalized lookup surface
    and keep legacy registry as compatibility-only
  rationale: 'The normalized entity registry in `adrs/index/` is the current machine

    lookup surface for deterministic entity access. The legacy

    `adrs/entities/registry.yaml` path remains compatibility-only and should

    not gain new consumers.

    '
  alias_id: DEC-0028
  alias_name: dec-0028-decision-migrated
- id: 019fee89-e616-74a6-ae3d-39c2dacd91ae
  summary: Classify compiler discovery outputs by guaranteed, optional, and deprecated
    stability tiers
  rationale: 'Downstream consumers need to know which generated surfaces are guaranteed

    contract outputs, which are optional human conveniences, and which remain

    transitional compatibility artifacts.

    '
  alias_id: DEC-0057
  alias_name: classify-compiler-discovery-outputs-by-guaranteed-optional-and-deprecated-stability-tiers
- id: 019fee89-e616-79f5-a127-b16d5485af23
  summary: Deprecate `adrs/entities/registry.yaml` as a legacy compatibility projection
  rationale: 'The normalized index family supersedes the legacy registry for new

    consumers. Keeping the legacy path for compatibility is acceptable, but it

    must be explicitly marked deprecated to prevent contract ambiguity.

    '
  alias_id: DEC-0058
  alias_name: deprecate-adrs-entities-registry-yaml-as-a-legacy-compatibility-projection
invariants:
- id: 019fee89-e616-7196-a92f-bec6b05d3d47
  statement: 'Canonical architectural authority MUST remain in ADR artifacts (including

    invariants established in logical ADRs). Derived discovery artifacts

    including adrs/index/invariant-registry.yaml MUST NOT independently define

    or redefine invariants. The adrs/invariants/ authoring directory is retired.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Derived discovery surfaces are indexes of canonical architecture state,

    not the source of truth. The invariant-registry is a complete derived

    projection of ADR-L invariants only.

    '
  alias_id: INV-0043
  alias_name: inv-0043
- id: 019fee89-e616-7037-8f0f-52c403f9f539
  statement: 'Derived architecture discovery artifacts MUST be deterministic,

    reproducible, and disposable.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Deterministic regeneration is required for machine trust, CI validation,

    and drift detection.

    '
  alias_id: INV-0044
  alias_name: inv-0044
- id: 019fee89-e616-7dc8-bd2e-10db13af0951
  statement: 'Agent-facing ADR toolkit workflows MUST prefer indexed lookup surfaces

    over raw ADR body traversal by default.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Explicit, cheap-to-query indexes are more aligned with AI-first design

    than repeated ad hoc document scans.

    '
  alias_id: INV-0045
  alias_name: inv-0045
capabilities:
- id: 019fee89-e616-7607-9312-8aa8d1816be9
  name: Summary Discovery Surface
  description: 'Provide a broad summary-oriented discovery artifact for ADR and scope

    metadata through `manifest.yaml`.

    '
  alias_id: CAP-0017
  alias_name: summary-discovery-surface
- id: 019fee89-e616-7121-a63e-0baad0a61fb3
  name: Normalized Entity Lookup Surface
  description: 'Provide deterministic lookup for normalized architecture entities
    through

    `adrs/index/entity-registry.yaml`.

    '
  acceptance_criteria:
  - normalized entity lookup is served from the indexed contract family
  - the legacy entity registry is treated as compatibility-only
  alias_id: CAP-0018
  alias_name: normalized-entity-lookup-surface
