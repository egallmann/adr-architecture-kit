context: 'The compiler driver and explicit pipeline now own deterministic architecture

  compilation across parse, analysis, emission, and recursive scope

  orchestration. The command-line behavior is compatibility-relevant, while the

  Python compiler pipeline, passes, `ArchModel`, emitters, and result plumbing are

  internal reference implementation and are not a supported SDK facade.

  '
technology_stack:
- category: language
  name: Python
  version: '>=3.14'
  rationale: 'Minimum supported Python minor is 3.14 (`requires-python >=3.14`); currently
    qualified released minor line is 3.14; repository reference interpreter is currently
    3.14.7; new GA Python minors require explicit qualification before support is
    advertised.
    '
- category: tooling
  name: Click
  version: 8.x
  rationale: CLI orchestration for compile entrypoints.
component_specifications:
- id: 019fee89-e617-76ad-9336-b3615a6e4bde
  name: Compiler Pipeline and Driver
  type: service
  responsibilities: '- Build compiler pipeline state from canonical scope inputs

    - Execute deterministic pass ordering

    - Emit architecture bundle, manifest, graph, and rendered outputs

    - Support recursive multi-scope compilation and reporting

    - Preserve existing CLI commands, options, outputs, diagnostics, and exit behavior

    '
  generation_context:
    purpose: Compile canonical architecture artifacts into derived outputs.
    key_responsibilities:
    - Own compile orchestration
    - Keep emission deterministic
    - Support recursive workspace compilation
    constraints:
    - Derived outputs remain non-authoritative
    - Pass ordering must stay compiler-owned and explicit
    - Internal compiler types must not cross the supported public facade
    success_criteria:
    - adr compile remains the compatibility-preserved authoring CLI orchestration
      path
    - Runtime machine-artifact authority remains owned by ste-runtime
    - Recursive compilation produces scope-local artifacts deterministically
  interfaces:
  - id: 019fee89-e617-779d-a12e-7713d58fbc21
    type: CLI
    specification: 'Commands:

      - adr compile

      - adr generate-architecture-index

      - adr generate-manifest

      - adr generate-adr-projection

      - adr generate-rendered-docs

      '
    alias_id: IFACE-0013
    alias_name: iface-0013
  - id: 019fee89-e618-7e7b-813b-2a48de1d809a
    type: library_api
    specification: 'A private compilation application service supports a restricted

      `adr_kit.api.compile_architecture` adapter and a compatibility CLI adapter.

      The public adapter accepts one explicit scope and only registries, manifest,

      and markdown groups. The CLI adapter retains graph, recursive, check,

      strict/lenient, contract-profile, output, diagnostic, and exit behavior.

      '
    alias_id: IFACE-0018
    alias_name: iface-0018
  implementation_identifiers:
    module_path: src/adr_kit/compiler/driver.py
    service_name: adr-compiler
    entry_point: src/adr_kit/cli/main.py
    test_path: tests/test_compiler_driver.py
  implementation_requirements:
    error_handling:
      strategy: Surface compilation diagnostics and fail closed on invalid bundles
        when required.
    observability:
      logging:
        level: info
        structured: false
      metrics:
      - name: compiler_runs_total
        type: counter
    testing_requirements:
      unit_test_coverage: '>= 80%'
      integration_tests: '- Single-scope compilation

        - Recursive workspace compilation

        - Bundle and graph emission

        '
  alias_id: COMP-0012
  alias_name: compiler-pipeline-and-driver
implementation_decisions:
- id: 019fee89-e618-7c0b-852f-c6d7f5b57322
  summary: Keep compiler orchestration as a dedicated component
  rationale: 'The explicit pipeline and driver are a dedicated authoring-time implementation

    component. Their CLI behavior and generated compatibility surfaces are guarded,

    but their Python internals remain evolvable and must not be described as a

    stable public runtime API.

    '
  alias_id: IMPL-0013
  alias_name: keep-compiler-orchestration-as-a-dedicated-component
- id: 019fee89-e618-7113-9b36-4437b97cd744
  summary: Contain compiler internals behind public and CLI application-service adapters
  rationale: 'Shared orchestration preserves output and diagnostic semantics without

    promoting `ArchModel`, compiler configuration, passes, emitters, internal

    artifacts, or mutable diagnostic logs into the supported SDK. CLI behavioral

    snapshots guard delegation independently from the narrower facade contract.

    '
  alias_id: IMPL-0019
  alias_name: contain-compiler-internals-behind-public-and-cli-application-service-adapters
