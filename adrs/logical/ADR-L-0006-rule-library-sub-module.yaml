- id: 019fee89-e615-71bc-a727-e0403c74783d
  statement: 'Cooperative signal schema MUST include claim, progress, complete,

    wave_complete, validation_ready types

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'These types enable parallel agent coordination per docs/COOPERATIVE-SIGNALS.md.

    Prompt translator generates instructions for these.

    '
  alias_id: INV-0036
  alias_name: inv-0036
