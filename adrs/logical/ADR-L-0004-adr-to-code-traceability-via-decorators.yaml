schema_version: '1.5'
adr_type: logical
id: 019fee89-e615-7577-8d37-dd0df031bec9
title: ADR-to-Implementation Traceability via Decorators and Metadata Attribution
status: accepted
created_date: '2026-03-08'
authors:
- adr-architecture-kit
modified_date: '2026-08-20'
context: "Architecture Decision Records document why implementation artifacts exist,\
  \ but\nthe repo still lacks a universal, machine-verifiable way to trace code,\n\
  infrastructure, configuration, schemas, pipelines, and scripts back to the\nADRs\
  \ that justify them.\n\nEarlier design work in this ADR established decorator-based\
  \ code traceability,\nRECON extraction, and bidirectional verification as the right\
  \ direction.\nSince then, adr-architecture-kit has gained an explicit compiler pipeline,\n\
  profile-aware contract validation, and stronger governance around derived\narchitecture\
  \ state. The traceability design now needs to be widened and\ngrounded in that current\
  \ compiler/governance reality.\n\n## Current State\n\n- ADRs reference implementation\
  \ via `implementation_identifiers`\n- Code and infrastructure still lack a canonical\
  \ reverse link to ADRs\n- adr-architecture-kit owns canonical architecture authority,\
  \ but not source\n  extraction of implementation artifacts\n- ste-runtime / RECON\
  \ now extracts decorator metadata into implementation\n  attribution evidence records\
  \ for code paths it can parse\n- Existing governance already distinguishes `greenfield`,\
  \ `brownfield`, and\n  `migration`, which should govern legacy onboarding instead\
  \ of inventing a\n  separate transition model\n\n## Architecture Direction\n\nThis\
  \ repository remains the authority for:\n- the attribution rule itself\n- the canonical\
  \ decorator and metadata semantics\n- the compiler-owned evidence contract that\
  \ downstream extractors populate\n- the validation posture for greenfield, brownfield,\
  \ and migration use\n\nThis repository does not take on source-code parsing for\
  \ this feature in the\ncurrent slice. That remains downstream work for ste-runtime\
  \ / RECON.\n\n## Problems Solved\n\n1. **Orphaned implementation**: Artifacts exist\
  \ with no architectural justification\n2. **Incomplete implementation**: ADRs declare\
  \ architecture that is not traced to implementation\n3. **Drift**: Implementation\
  \ evolves without architecture authority remaining explicit\n4. **Legacy imports**:\
  \ Existing codebases need staged onboarding without losing deterministic governance\n\
  5. **AI reasoning**: Agents need an explicit intent surface rather than heuristic\
  \ code-to-ADR guesses\n6. **EDR evidence**: Embodied decision records need provenance-rich\
  \ implementation claims\n\n## STE Principles\n\n- **PRIME-1**: No implicit assumptions\
  \ (implementation must declare its authority)\n- **SYS-4**: Drift prevention (detect\
  \ when code diverges from ADRs)\n- **SYS-5**: Documentation-state as authoritative\
  \ (ADRs govern code)\n- **SYS-6**: RECON completion (architecture must be extractable)\n\
  - **Scope-aware onboarding**: Migration posture must be explicit rather than ad\
  \ hoc\n"
domains:
- architecture
- traceability
- governance
- verification
tags:
- traceability
- decorators
- verification
- drift-detection
- embodied-design
decisions:
- id: 019fee89-e615-7e6c-8a2f-8bcd9c148dce
  summary: Adopt explicit architecture intent attribution for implementation artifacts
  rationale: 'Implementation surfaces need explicit, extractable architecture authority.

    For code, decorators remain the canonical mechanism:

    - `@implements_adr(...)`

    - `@enforces_invariant(...)`

    - `@implements(...)` / `@enforces(...)` / `@embodies(...)` for UUID-canonical
      semantic claims (ADR-L-0020)


    For infrastructure and adjacent non-code artifacts, the same intent is

    expressed through metadata-level declarations rather than per-resource

    decoration.


    This keeps attribution explicit while respecting artifact-type differences.

    '
  consequences:
    positive:
    - New implementation can declare architectural authority deterministically
    - Code and infrastructure use a consistent intent model
    - Downstream extraction can remain language-specific without changing rule semantics
    - AI reasoning gains explicit implementation-to-ADR provenance
  alias_id: DEC-0009
  alias_name: adopt-explicit-architecture-intent-attribution-for-implementation-artifacts
- id: 019fee89-e615-727f-a31e-9b8f4c153dc3
  summary: Stage downstream extraction and rule activation after ADR-Kit authority
    is defined
  rationale: 'adr-architecture-kit should first define the canonical rule, evidence

    contract, and profile-aware validation semantics. Source extraction,

    runtime rule activation, and any shared ecosystem delivery should build on

    that authority rather than forcing this repo to duplicate downstream logic.

    '
  consequences:
    positive:
    - adr-architecture-kit remains the source of canonical architecture semantics
    - ste-runtime can focus on extraction rather than architecture authority
    - ste-rules-library can encode activation logic later without redefining the rule
    - ste-spec only needs involvement if the evidence contract must become shared
      doctrine
  alias_id: DEC-0016
  alias_name: stage-downstream-extraction-and-rule-activation-after-adr-kit-authority-is-defined
- id: 019fee89-e615-7332-892e-e723d9f13237
  summary: Treat runtime-emitted implementation attribution as downstream evidence
  rationale: 'ste-runtime now populates implementation attribution evidence from parsed

    implementation artifacts. That closes the first downstream extraction gap

    without moving attribution authority into ste-runtime. adr-architecture-kit

    remains responsible for canonical decorator and metadata semantics, the

    evidence contract shape, and profile-aware validation against canonical ADR

    state.

    '
  consequences:
    positive:
    - RECON can supply extracted attribution claims for validation
    - ADR-Kit validates raw attribution evidence against canonical ADR authoring state
      and exposes a non-authoritative linkage projection without writing Architecture IR
    - Runtime extraction can evolve by language without redefining attribution semantics
  alias_id: DEC-0076
  alias_name: treat-runtime-emitted-implementation-attribution-as-downstream-evidence
- id: 019fee89-e615-7a6b-843f-3cec701087f8
  summary: Support Bidirectional Verification
  rationale: 'Traceability must work in both directions:


    **Forward (ADR -> Implementation)**:

    - ADR declares component or system implementation identifiers

    - Verify that downstream attribution evidence resolves to the declared authority


    **Reverse (Implementation -> ADR)**:

    - Code has `@implements_adr` or equivalent metadata-level attribution

    - Verify that referenced ADR exists and is still a valid authority target


    This bidirectional verification detects:

    - Orphaned implementation (no ADR)

    - Phantom declarations (ADR but no implementation evidence)

    - Invalid references (implementation references non-existent ADR)

    - Status mismatches (implementation references superseded ADRs)

    '
  consequences:
    positive:
    - Verification must check both directions
    - Downstream extraction must preserve both ADR declarations and implementation
      attribution claims
    - Drift detection becomes comprehensive
    - CI/CD can enforce traceability
  alias_id: DEC-0023
  alias_name: support-bidirectional-verification
- id: 019fee89-e615-7c19-b73f-0741bf060af1
  summary: Define a compiler-owned implementation attribution evidence contract
  rationale: 'adr-architecture-kit needs a canonical handoff surface for implementation

    attribution evidence without taking on source parsing itself. A small,

    compiler-owned schema and model let downstream extractors emit consistent

    attribution records that governance can validate deterministically.

    '
  consequences:
    positive:
    - ste-runtime / RECON has a canonical handoff contract to populate
    - Governance can validate implementation attribution without parsing source code
      here
    - EDR and coverage work can build on a stable evidence shape
  alias_id: DEC-0048
  alias_name: define-a-compiler-owned-implementation-attribution-evidence-contract
- id: 019fee89-e615-7cdd-ad21-34d0a44bec33
  summary: Use existing contract profiles for legacy intent-attribution onboarding
  rationale: 'Greenfield, brownfield, and migration already express the repo''s adoption

    postures. Intent attribution onboarding should use those same profiles

    rather than creating a second transition taxonomy.

    '
  consequences:
    positive:
    - Legacy onboarding remains aligned with existing governance
    - Greenfield enforcement can be strict without blocking brownfield imports
    - Migration tightening can happen without schema forks or one-off modes
  alias_id: DEC-0049
  alias_name: use-existing-contract-profiles-for-legacy-intent-attribution-onboarding
invariants:
- id: 019fee89-e615-7129-ac3e-8120e0d7c106
  statement: 'Greenfield in-scope implementation artifacts MUST declare architectural

    authority through @implements_adr, a UUID semantic claim decorator, or an

    equivalent metadata-level attribution mechanism; equivalent semantic

    declarations MUST NOT be dual-encoded on the same surface; brownfield and

    migration may stage adoption under profile-specific governance

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Explicit architecture intent is mandatory for new systems, but legacy

    onboarding must be staged through the existing profile model.

    '
  alias_id: INV-0027
  alias_name: inv-0027
- id: 019fee89-e615-72db-8f32-3888e597d5c3
  statement: 'Implementation attribution references MUST resolve to existing ADRs,
    and

    references to superseded ADRs MUST be surfaced as governance warnings

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Invalid or stale authority references undermine machine traceability
    even

    when the attribution syntax itself is present.

    '
  alias_id: INV-0028
  alias_name: inv-0028
- id: 019fee89-e615-75c7-aa3f-b6489db09c24
  statement: 'Implementation attribution evidence MUST preserve provenance identifying

    the source artifact and extractor responsible for the claim

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Traceability without provenance is not auditable enough for EDR evidence,

    drift analysis, or trustworthy agent reasoning.

    '
  alias_id: INV-0029
  alias_name: inv-0029
- id: 019fee89-e615-7e2e-bf3f-577dc4ade891
  statement: 'A declaration that code enforces an invariant is a claim of intent,

    not kit-automated proof that the enforcement logic exists

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: 'adr-architecture-kit does not parse implementation source to prove

    enforcement. Downstream extractors and human review may pursue proof;

    the kit validates that the declared target exists and is an invariant.

    '
  alias_id: INV-0030
  alias_name: inv-0030
- id: 019fee89-e615-7361-b717-6a0aae8df756
  statement: 'adr-architecture-kit MUST define the canonical architecture-intent

    attribution rule and evidence contract without taking on direct source-code

    parsing responsibilities for downstream repositories

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'This repository owns architecture authority, while downstream extractors
    own

    language-specific parsing and evidence emission.

    '
  alias_id: INV-0031
  alias_name: inv-0031
- id: 019fee89-e615-7288-b21b-9452d0e7faef
  statement: 'Downstream extractors and rule-delivery systems SHOULD consume ADR-Kit

    attribution contracts rather than redefining them independently

    '
  scope: global
  enforcement_level: should
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Reusing a single contract preserves deterministic semantics across the

    ecosystem even when extraction and rule activation live elsewhere.

    '
  alias_id: INV-0032
  alias_name: inv-0032
capabilities:
- id: 019fee89-e615-7dd6-b137-8546c4e74c22
  name: Architecture Intent Attribution
  description: 'Explicit declaration of architectural authority across code and other

    implementation artifacts through decorators or metadata-level attribution.

    '
  acceptance_criteria:
  - '@implements_adr(adr_id, ...) decorator available'
  - '@enforces_invariant(inv_id, ...) decorator available'
  - '@implements / @enforces / @embodies UUID claim decorators available'
  - infrastructure/config/schema/pipeline/script artifacts can declare ADR IDs through
    metadata
  - attribution metadata does not alter runtime behavior
  - attribution is extractable by downstream tooling
  alias_id: CAP-0021
  alias_name: architecture-intent-attribution
- id: 019fee89-e615-7804-ad2e-184eeaf6ea0f
  name: Bidirectional Traceability Verification
  description: 'Automated verification that implementation attribution and ADR declarations

    agree in both directions.

    '
  acceptance_criteria:
  - Query validated implementation-to-intent links in both directions
  - Preserve independent evidence occurrences behind each unique semantic linkage
  - Verify attribution references valid architecture UUIDs
  - Detect orphaned implementation (no ADR reference)
  - Detect phantom declarations (ADR but no implementation evidence)
  - Report traceability violations
  alias_id: CAP-0024
  alias_name: bidirectional-traceability-verification
- id: 019fee89-e615-7e73-a30e-6f029c9cb1b3
  name: Profile-Aware Legacy Onboarding for Intent Attribution
  description: 'Govern intent-attribution adoption with the existing greenfield,

    brownfield, and migration profiles instead of a separate legacy mode.

    '
  acceptance_criteria:
  - greenfield treats missing required attribution as an error
  - brownfield and migration can surface onboarding gaps as warnings
  - missing ADR references still fail regardless of profile
  - superseded ADR references are visible without blocking onboarding
  alias_id: CAP-0027
  alias_name: profile-aware-legacy-onboarding-for-intent-attribution
- id: 019fee89-e615-7476-a31e-769637c9b7d1
  name: Implementation Attribution Evidence Handoff
  description: 'A compiler-owned evidence contract that downstream extractors populate
    with

    implementation-to-ADR attribution claims and provenance.

    '
  acceptance_criteria:
  - evidence records include implementation entity ID and type
  - evidence records include typed relationship claims to canonical architecture UUIDs
  - evidence records preserve source, extractor, commit, pointer, and optional line span
  - optional invariant claims can be carried without schema forks
  - ste-runtime can emit the contract without adr-architecture-kit parsing source
    code directly
  alias_id: CAP-0030
  alias_name: implementation-attribution-evidence-handoff
