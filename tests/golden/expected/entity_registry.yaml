- id: 019fee89-e615-7e55-972f-14dd7da851c0
  alias_id: DEC-0019
  alias_name: prohibit-manual-edits-to-generated-documentation
  alias_ref: DEC-0019:prohibit-manual-edits-to-generated-documentation
  entity_type: decision
  name: Prohibit manual edits to generated documentation
  summary: Once an artifact is declared generated, manual edits create ambiguity over
    whether the generated output or the source artifact should be trusted. That ambiguity
    is architecturally unacceptable in a governance repository.
