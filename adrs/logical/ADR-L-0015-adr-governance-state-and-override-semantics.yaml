context: 'The repository now has a first-pass governance block on ADRs and a canonical

  objection override artifact. That initial implementation made the metadata

  available, but it left several important questions under-specified:


  1. whether implementation authority is boolean or tiered

  2. how approval metadata is paired and interpreted

  3. how overrides relate to ADR meaning versus implementation allowance

  4. how override validity is coupled to later ADR revision

  5. how projections may expose governance state without inventing meaning


  Those questions materially affect acceptance gating, implementation behavior,

  and deterministic validation. They need a single canonical decision so schema,

  validator, and projection behavior stay aligned.

  '
decisions:
- id: 019fee89-e616-7fa2-a13f-a0bab2411ff7
  summary: Define ADR governance as a canonical nested metadata block with explicit
    implementation-authority levels
  rationale: 'Governance state is part of canonical ADR meaning, but it is not the
    same

    thing as ADR lifecycle or architecture intent. A nested governance block

    keeps approval and implementation gating explicit without turning derived

    projections into authority.

    '
  consequences:
    positive:
    - Approval and implementation status become machine-detectable
    - Authority stays on the ADR rather than migrating into indexes
    - Future governance fields can be extended without overloading lifecycle status
  alias_id: DEC-0063
  alias_name: dec-0063-decision-migrated
- id: 019fee89-e617-77cf-a43e-5f0912b04a8a
  summary: Record implementation exceptions in separate objection override artifacts
  rationale: 'Override rationale, risk, and exception posture should remain canonical,
    but

    they should not bloat ADR text or rewrite architecture intent. Separate

    override artifacts keep exception handling explicit and auditable.

    '
  consequences:
    positive:
    - ADR meaning remains stable while implementation exceptions are recorded separately
    - Override approval and accepted risk are queryable
    - ADRs can reference overrides by ID without carrying inline exception prose
  alias_id: DEC-0064
  alias_name: record-implementation-exceptions-in-separate-objection-override-artifacts
- id: 019fee89-e617-7dbb-b23f-872b9ffc75d8
  summary: Bind override review validity to ADR modified_date and warn on stale coupling
  rationale: 'Overrides should not silently continue applying after the ADR they depend
    on

    has materially changed. Using ADR modified_date provides a minimal canonical

    coupling point that works with the current schema line.

    '
  consequences:
    positive:
    - Validators can detect likely stale exceptions deterministically
    - The MVP avoids inventing a new ADR revision field prematurely
    - Governance review remains visible when ADR meaning evolves
  alias_id: DEC-0065
  alias_name: bind-override-review-validity-to-adr-modified-date-and-warn-on-stale-coupling
- id: 019fee89-e617-7aae-ac34-86b62c25289b
  summary: Allow projections to expose governance references and summary metadata
    only
  rationale: 'Projections need to support lookup and orchestration, but they must
    not

    synthesize approvals, risks, or override semantics beyond what the canonical

    artifacts explicitly say.

    '
  consequences:
    positive:
    - Manifests and indexes stay useful for tooling
    - Projections do not become alternate governance authority
    - Validation can compare projection output directly to canonical sources
  alias_id: DEC-0066
  alias_name: allow-projections-to-expose-governance-references-and-summary-metadata-only
invariants:
- id: 019fee89-e617-7ec8-b235-dda998054d7c
  statement: 'Absence of ADR governance approval fields MUST NOT be interpreted as

    approval or implementation authority.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'Governance state must be explicit, not inferred by omission.

    '
  alias_id: INV-0064
  alias_name: inv-0064
- id: 019fee89-e617-7f99-930b-dee9dcfa8a1f
  statement: 'Objection override artifacts MUST NOT change ADR architectural meaning
    and

    MUST govern implementation allowance only.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Override records are exception control, not alternate architecture authority.

    '
  alias_id: INV-0065
  alias_name: inv-0065
- id: 019fee89-e617-7761-9a2a-5f1cd94d2de5
  statement: 'Derived projections MUST expose only governance IDs and summary metadata
    and

    MUST NOT invent approvals, risks, or authority-altering interpretations.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'Lookup surfaces must remain projections over canonical governance state.

    '
  alias_id: INV-0066
  alias_name: inv-0066
capabilities:
- id: 019fee89-e616-7ee9-9b0f-2da3ee16636b
  name: Deterministic ADR Governance Validation
  description: 'Validate ADR governance metadata, approval pairings, implementation

    authority, override references, and stale revision coupling through

    deterministic rules.

    '
  acceptance_criteria:
  - Invalid governance pairings fail validation
  - Missing override artifacts fail cross-reference validation
  - Stale override coupling is surfaced as a warning in the MVP
  alias_id: CAP-0042
  alias_name: deterministic-adr-governance-validation
- id: 019fee89-e616-7f80-903e-36b6d56f86fe
  name: Governance Summary Projection
  description: 'Expose ADR governance references and override summaries in manifest
    and

    discovery surfaces without leaking rationale or accepted risk text.

    '
  acceptance_criteria:
  - ADR summaries expose implementation authority and related override IDs
  - Override summaries expose IDs and bounded effect metadata only
  - Projections remain semantically aligned with canonical artifacts
  alias_id: CAP-0043
  alias_name: governance-summary-projection
