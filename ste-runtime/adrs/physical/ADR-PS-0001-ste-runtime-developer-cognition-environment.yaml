- id: FLOW-0001
  name: Canonical Runtime Cognition Pipeline
  description: Filesystem events or explicit refresh requests enter the supervisor, trigger RECON extraction, refresh authoritative graph state, perform bounded RSS traversal, assemble MVC-oriented context, project rules, and return an inspectable interface response.
  path:
  - Runtime Supervisor
  - Extraction Pipeline
  - Semantic Graph Store
  - Runtime State Slicing (RSS)
  - Context Assembly
  - Rules Projection
  - Interface Layer
  data_type: Semantic runtime cognition state
  latency_requirements: Interactive local responses should remain bounded and inspectable, with correctness taking precedence over speculative speedups.
references_components: []
deployment_model:
  hosting: on-premise
  orchestration: Single-process local runtime by default; service-separated deployment deferred.
  scaling_strategy: The default deployment is local-first and single-user. Future service separation may scale individual subsystems independently, but this ADR does not commit to a distributed deployment design.
scalability_strategy:
  horizontal_scaling: Not required for the default local deployment. Horizontal separation is reserved for future component ADRs if shared or networked runtime operation becomes necessary.
  vertical_scaling: Local execution scales by improving incremental refresh, bounded traversal, and regenerable query acceleration while preserving YAML authority.
  bottlenecks:
  - Full-workspace RECON on large repositories
  - Deep graph traversal and context assembly cost
  - Query-index rebuild duration
  - Rule projection cost for oversized bundles
  capacity_planning: Capacity planning is driven by workspace size, slice count, refresh frequency, and bounded context assembly requirements rather than by network concurrency targets.
failure_modes:
- scenario: Graph staleness
  impact: high
  mitigation: Use watchdog-driven incremental refresh and explicit freshness tracking so stale state becomes observable rather than implicit.
  detection: Manifest or freshness mismatch between source changes and semantic state, missing recent refresh events, or explicit stale-state diagnostics.
  recovery: Run incremental RECON for affected files; fall back to full RECON when incremental equivalence cannot be trusted.
- scenario: Extraction drift
  impact: high
  mitigation: Keep extraction deterministic, report validation findings, and preserve the ability to inspect authoritative YAML output directly.
  detection: Self-validation findings, schema violations, repeatability mismatches, or graph anomalies after extraction.
  recovery: Correct extractor behavior and regenerate state through incremental or full RECON as appropriate.
- scenario: Rule misfire
  impact: medium
  mitigation: Require explicit activation rationale and expose rule diagnostics so incorrect projection remains inspectable.
  detection: Unexpected obligation reports, mismatched rule activation evidence, or human review identifying incorrect projection.
  recovery: Correct rule definitions or projection logic and re-run projection against the affected context bundle.
- scenario: Context explosion
  impact: medium
  mitigation: Enforce bounded traversal and MVC-oriented assembly so bundle growth is constrained before interface delivery.
  detection: Bundle diagnostics showing excessive slice counts, token growth, or traversal depth exceeding expected bounds.
  recovery: Tighten entry points, reduce traversal depth, or refine bundle filters while preserving required provenance.
- scenario: Refresh loops
  impact: medium
  mitigation: Separate source artifact watching from derived state writes and track self-generated writes explicitly.
  detection: Repeated watch-triggered refresh activity on derived-state paths or loop diagnostics in watchdog logs.
  recovery: Suppress derived-state events, reset watch state, and re-enter refresh only from valid source changes.
operational_requirements:
  monitoring: Expose graph freshness, RSS traceability, context bundle composition, rule activation evidence, and watchdog health as first-class inspection surfaces.
  logging: Use structured runtime diagnostics for refresh events, extraction findings, traversal decisions, bundle assembly, and rule projection.
  backup_recovery: Authoritative YAML state is the recovery baseline; local query acceleration state must be discardable and rebuildable from authoritative state.
  security: The runtime operates within the workspace development boundary and must not claim canonical attestation authority or override ste-spec governance boundaries.
gaps: []
