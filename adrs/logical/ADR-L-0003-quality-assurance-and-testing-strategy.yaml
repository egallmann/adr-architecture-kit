decisions:
- id: 019fee89-e615-79a1-be3d-03af8c291326
  summary: Adopt Multi-Layer Testing Strategy
  rationale: 'Different types of tests serve different purposes. A layered approach
    provides

    comprehensive coverage while maintaining fast feedback loops.


    Layers:

    1. **Unit tests**: Fast, isolated, test individual functions/methods

    2. **Integration tests**: Test component interactions

    3. **Real-world tests**: Test against actual workspace ADRs

    4. **Regression tests**: Prevent reintroduction of fixed bugs

    '
  consequences:
    positive:
    - Clear test organization and purpose
    - Fast unit tests for rapid development
    - Integration tests catch interaction bugs
    - Real-world tests ensure practical usability
    - Test suite grows with system complexity
  alias_id: DEC-0008
  alias_name: adopt-multi-layer-testing-strategy
- id: 019fee89-e615-7d1d-a33d-ca62fdaad0be
  summary: Require Tests for All New Components
  rationale: 'Every new component must include tests before acceptance. This ensures

    quality is built in from the start, not retrofitted later.


    Prevents technical debt accumulation and ensures new features are

    immediately verifiable.

    '
  consequences:
    positive:
    - Slower initial development (offset by fewer bugs)
    - Higher confidence in new features
    - Easier refactoring with test safety net
    - Documentation via test examples
  alias_id: DEC-0015
  alias_name: require-tests-for-all-new-components
- id: 019fee89-e615-78ee-a53f-99d85ea925a3
  summary: Test Against Real Workspace ADRs
  rationale: 'The toolkit must work with actual ADRs in the workspace. Testing against

    synthetic fixtures alone is insufficient - real-world ADRs expose edge

    cases and integration issues.


    This provides dogfooding and ensures the toolkit works on its own

    documentation.

    '
  consequences:
    positive:
    - Tests depend on workspace ADR quality
    - Tests may break when ADRs change (intentional)
    - Immediate feedback on ADR schema changes
    - Confidence in real-world usability
  alias_id: DEC-0022
  alias_name: test-against-real-workspace-adrs
- id: 019fee89-e615-7e99-8137-8ac8d0972e1b
  summary: Enforce Testing in CI/CD Pipeline
  rationale: 'Automated testing in CI/CD prevents regressions and ensures all

    contributors maintain quality standards. Manual testing is insufficient

    for a governance tool.

    '
  consequences:
    positive:
    - PRs cannot merge without passing tests
    - Consistent quality across contributions
    - Automated regression detection
    - Slower PR merge (acceptable trade-off)
  alias_id: DEC-0029
  alias_name: enforce-testing-in-ci-cd-pipeline
- id: 019fee89-e615-760b-a43f-b3fe08e0d6ef
  summary: Adopt Test-Driven Development (TDD) Methodology
  rationale: "TDD (Red-Green-Refactor) is architecturally aligned with STE principles:\n\
    \n**Alignment with STE**:\n- SYS-2 (Deterministic Cognition): Tests enforce deterministic\
    \ behavior\n- SYS-4 (Drift Prevention): Tests detect drift immediately  \n- PRIME-1\
    \ (No Implicit Assumptions): Tests make behavior explicit\n- INV-0001 (Schema\
    \ Validation): Tests prove validation correctness\n\n**Why TDD for this system**:\n\
    1. This is a governance tool - it MUST be provably correct\n2. Validation logic\
    \ is complex - tests clarify expected behavior\n3. Multi-scope functionality has\
    \ many edge cases\n4. Schema validation errors are costly (halt workflows)\n5.\
    \ Generated manifests are consumed by AI systems (must be reliable)\n\n**TDD Cycle**:\n\
    1. Red: Write failing test (executable specification)\n2. Green: Implement minimum\
    \ code to pass (correctness proof)\n3. Refactor: Improve design while maintaining\
    \ tests (quality)\n\n**Benefits for ADR Kit**:\n- Tests become executable specifications\
    \ of ADR behavior\n- Validation logic is provably correct before deployment\n\
    - Refactoring is safe (tests prevent regressions)\n- API design improves (testability\
    \ forces good interfaces)\n- Documentation via test examples\n"
  consequences:
    positive:
    - 'Development workflow changes: test-first, not test-after'
    - Initial development may feel slower (pays off in debugging time)
    - Forces thinking about behavior before implementation
    - Creates comprehensive test suite organically
    - Reduces debugging time (tests isolate issues)
    - Higher confidence in correctness
    - Better API design (testability constraint)
  alias_id: DEC-0033
  alias_name: adopt-test-driven-development-tdd-methodology
- id: 019fee89-e615-7e36-8e3f-c0e37def8629
  summary: Require retained release-artifact testing and no-regression quality controls
  rationale: 'Source-tree tests alone cannot prove that an installed distribution
    contains

    the documented modules and package data, and rebuilding during publication

    breaks the identity between tested and published artifacts. Existing Ruff,

    strict-mypy, and Black debt must remain visible without permitting new debt.


    CI therefore tests source installs and the exact retained wheel on every

    supported Python version, measures coverage through the canonical `adr_kit`

    namespace, ratchets legacy quality findings, and promotes a verified wheel

    and sdist without rebuilding them in the publishing job.


    Metadata renderability alone is insufficient for the PyPI-facing package

    description: repository-relative README links resolve on GitHub but break

    when rendered under the PyPI project page. Release qualification therefore

    also requires portable link forms in the README used as `project.readme`.


    Release qualification may complete for an exact source commit and its exact

    retained distribution before a release tag exists, provided every required

    qualification gate has already passed for that commit and artifact. Creating

    `v<version>` does not, by itself, require a second independent qualification

    of the same commit and artifact. Tag publication is the promotion boundary for

    a previously qualified retained bundle.

    '
  consequences:
    positive:
    - Installed-package behavior becomes release evidence rather than an assumption
    - Published artifacts are byte-identical to the tested release bundle
    - Existing quality debt can only stay level or decrease
    - Supported Python claims are backed by source and wheel execution
    - PyPI package-description links remain valid independently of GitHub rendering
    - Tag publication promotes previously qualified artifacts without requalifying
  alias_id: DEC-0078
  alias_name: require-retained-release-artifact-testing-and-no-regression-quality-controls
- id: 019fee89-e615-713f-a73d-10442c1dc6b9
  summary: Make installed distribution metadata the runtime package-version authority
  rationale: 'A manually synchronized package literal can drift from build metadata
    and

    from the artifact exercised by an installed consumer. Runtime package, CLI,

    SDK result, and capability versions therefore resolve from installed

    `adr-architecture-kit` metadata. Only `PackageNotFoundError` permits a

    direct-source fallback to a name-verified `pyproject.toml`; an unavailable

    or invalid source fallback returns the explicit non-release sentinel

    `0+unknown`.


    `pyproject.toml:[project].version` remains the sole manually edited package

    version. Editable and wheel tests must prove metadata resolution rather than

    silently relying on source-tree importability.

    '
  consequences:
    positive:
    - Package, CLI, SDK, and installed-distribution version reports share one authority
    - Direct-source execution remains supported without masking packaging defects
    - Release evidence detects drift instead of synchronizing duplicate literals
  alias_id: DEC-0081
  alias_name: make-installed-distribution-metadata-the-runtime-package-version-authority
invariants:
- id: 019fee89-e615-7c97-a633-fbfd69ffa030
  statement: 'Every component with public API MUST have unit tests covering:

    - Happy path (valid inputs)

    - Error cases (invalid inputs)

    - Edge cases (boundary conditions)

    - Backward compatibility (when applicable)

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Public APIs are contracts. Tests document expected behavior and prevent

    breaking changes.

    '
  alias_id: INV-0020
  alias_name: inv-0020
- id: 019fee89-e615-74c8-a813-5f18ee19f9a8
  statement: 'Schema validators MUST have tests proving correctness against:

    - Valid ADRs (should pass)

    - Invalid ADRs (should fail with clear errors)

    - Edge cases (empty fields, special characters, etc.)

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Schema validation is the foundation of machine-verifiable architecture.

    Incorrect validation undermines the entire system.

    '
  alias_id: INV-0021
  alias_name: inv-0021
- id: 019fee89-e615-729d-873d-f2bf925d1846
  statement: 'Multi-scope functionality MUST have tests covering:

    - Single scope (backward compatibility)

    - Multiple scopes (recursive operations)

    - Scope boundary enforcement (security)

    - Parent-child relationships

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Multi-scope is complex and affects multiple projects. Comprehensive

    testing prevents cross-project contamination and security issues.

    '
  alias_id: INV-0022
  alias_name: inv-0022
- id: 019fee89-e615-758b-a31f-a0dcb8d9d09a
  statement: 'Test suite MUST complete in under 30 seconds for fast feedback

    '
  scope: global
  enforcement_level: should
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Slow tests discourage running them frequently. Fast feedback enables

    test-driven development and rapid iteration.

    '
  alias_id: INV-0023
  alias_name: inv-0023
- id: 019fee89-e615-7871-b719-23a5128874ae
  statement: 'Tests MUST be deterministic - same input always produces same output

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Non-deterministic tests (flaky tests) erode trust and waste time.

    Aligns with SYS-2 (deterministic cognition).

    '
  alias_id: INV-0024
  alias_name: inv-0024
- id: 019fee89-e615-75e2-a33f-645d3f0970a1
  statement: 'Breaking changes to public APIs MUST be detected by tests

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Backward compatibility is critical for existing users. Tests should

    fail when APIs change incompatibly.

    '
  alias_id: INV-0025
  alias_name: inv-0025
- id: 019fee89-e615-7a08-8b0f-d2b2ed57eacb
  statement: 'Test coverage SHOULD be measured and tracked, with minimum 80% coverage

    for critical components (parsers, validators, generators)

    '
  scope: global
  enforcement_level: should
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Coverage metrics identify untested code paths. 80% is pragmatic balance

    between thoroughness and diminishing returns.

    '
  alias_id: INV-0026
  alias_name: inv-0026
- id: 019fee89-e615-74af-a113-f1a7a9e5d49e
  statement: 'Pull-request and release validation MUST install the project before
    tests,

    MUST measure canonical `adr_kit` namespace coverage at no less than 80%,

    and MUST exercise both a source installation and the exact retained wheel

    on every claimed Python version.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Source-package leakage and namespace aliases can produce misleading

    coverage and allow incomplete wheels to pass repository-local tests.

    '
  alias_id: INV-0072
  alias_name: inv-0072
- id: 019fee89-e615-7519-972f-504bac832107
  statement: 'Release publication MUST promote exactly one previously tested wheel
    and

    one previously tested sdist without rebuilding. Their filenames, sizes,

    SHA-256 hashes, package version, source commit, and `v<version>` tag MUST

    be verified before the privileged publish step. Ruff, strict-mypy, and

    Black debt MUST be guarded by committed no-regression baselines that allow

    removals but reject additions or count increases.


    When a successful qualification already exists for the exact tagged source

    commit and its retained release bundle, the tag publication path MUST act as

    a promotion and identity-verification boundary only. It MUST NOT rebuild

    distributions or re-run the independent qualification suite solely because a

    tag was created. Publication MUST fail closed if successful qualification

    evidence or the retained bundle for that exact commit cannot be proven.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Artifact identity and truthful quality measurements are required for
    a

    trustworthy release chain while pre-existing debt is retired incrementally.

    '
  alias_id: INV-0073
  alias_name: inv-0073
- id: 019fee89-e615-701c-8e3e-d463d56f89ce
  statement: 'Source, editable-install, and clean retained-wheel consumers MUST exercise

    the supported SDK and MUST agree on package, CLI, SDK result, capability,

    and installed-distribution versions wherever distribution metadata exists.

    Direct-source fallback MUST occur only when metadata is absent and MUST NOT

    hide invalid installed metadata or package-resource failures.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'A supported SDK and release chain require equivalent behavior from the

    checkout, editable installation, and the exact artifact selected for

    promotion.

    '
  alias_id: INV-0075
  alias_name: inv-0075
- id: 019fee89-e615-7235-8135-9a274f82afc8
  statement: 'The PyPI-facing package description (the file declared as `project.readme`)

    MUST contain only Markdown link and image targets that resolve independently

    of GitHub repository-relative rendering: same-document anchors, absolute

    `https://` URLs (optional fragment), and `mailto:` URIs. Repository-relative

    file or directory targets and `http://` URLs MUST be rejected by automated

    release qualification before merge or publication.

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: test
  verification_method: automated
  rationale: 'Observed on the published `0.3.0` long description: GitHub-valid relative

    README links became invalid PyPI package-description URLs. `twine check`

    validates metadata renderability but not cross-surface link portability.

    '
  alias_id: INV-0083
  alias_name: inv-0083
- id: 019fee89-e615-74f0-9826-fcaa4052cfdc
  statement: adr_kit MUST not ship deprecated runtime API usage, and its direct dependencies
    MUST be audited for vulnerabilities and upgrade freshness
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: automated
  rationale: 'adr_kit is a governance and architecture-authority tool. If it relies
    on

    deprecated modules, stale runtimes, or vulnerable packages, it undermines

    its own authority. CI hooks include `scripts/check_runtime_hygiene.py` and

    `adr audit-runtime`.

    '
  alias_id: INV-0095
  alias_name: inv-0095
- id: 019fee89-e615-792a-aa3e-a9f0f34c1b93
  statement: Repository changes must be committed at meaningful verified boundaries
    rather than accumulated indefinitely.
  scope: global
  enforcement_level: must
  enforcement_mechanism: policy
  verification_method: audit
  rationale: 'Small, verified commits reduce review ambiguity and preserve architectural

    intent. A meaningful boundary requires a coherent slice, relevant tests and

    validation, and a reviewable repository state.

    '
  alias_id: INV-0096
  alias_name: inv-0096
capabilities:
- id: 019fee89-e615-7498-9825-b465a8830d8a
  name: Automated Quality Gates
  description: 'CI/CD pipeline automatically runs test suite on every commit and PR.

    Prevents merging code that fails tests or reduces coverage.

    '
  acceptance_criteria:
  - All tests pass before merge
  - Coverage does not decrease
  - Linting passes (code quality)
  - Type checking passes (mypy)
  alias_id: CAP-0020
  alias_name: automated-quality-gates
- id: 019fee89-e615-7958-822b-bbd40f3a5ebc
  name: Test-Driven Development Support
  description: 'Test infrastructure supports TDD workflow - write failing test, implement

    feature, test passes. Fast test execution enables rapid iteration.

    '
  acceptance_criteria:
  - Tests run in under 30 seconds
  - Clear test output (pass/fail/error)
  - Easy to run subset of tests
  - Good test isolation (no shared state)
  alias_id: CAP-0023
  alias_name: test-driven-development-support
- id: 019fee89-e615-7d32-8d01-f61b4d7aae40
  name: Regression Prevention
  description: 'Once a bug is fixed, a test is added to prevent reintroduction. Test

    suite grows to cover discovered edge cases.

    '
  acceptance_criteria:
  - Bug fixes include regression test
  - Regression tests documented with issue reference
  - Tests prevent reintroduction of bug
  alias_id: CAP-0026
  alias_name: regression-prevention
- id: 019fee89-e615-722d-bf3a-9ed33338beaf
  name: Documentation via Tests
  description: 'Tests serve as executable documentation showing how to use components.

    Examples in tests demonstrate API usage patterns.

    '
  acceptance_criteria:
  - Tests show common usage patterns
  - Tests demonstrate error handling
  - Tests illustrate edge cases
  - Test names clearly describe behavior
  alias_id: CAP-0029
  alias_name: documentation-via-tests
- id: 019fee89-e615-7402-b43f-a03be950d0b3
  name: Verified Build-Once Release Promotion
  description: 'Build one release bundle, verify its metadata and identity, exercise
    the

    retained wheel across the supported Python matrix, and publish that exact

    bundle without a second build.

    '
  acceptance_criteria:
  - CI supports Python 3.11, 3.12, 3.13, and 3.14 only after source and retained-wheel
    jobs pass
  - canonical package coverage remains at or above 80%
  - Ruff, strict-mypy, and Black controls reject new debt
  - the release manifest requires exactly one wheel and one sdist
  - the publish job has no build step and confines OIDC and the PyPI environment to
    publication
  - the PyPI-facing package description (`project.readme`) contains only portable
    link forms valid outside GitHub repository-relative rendering
  - tag publication promotes a previously qualified retained bundle for the exact
    tagged SHA
  - re-qualification is not required solely because a release tag was created
  - publication fails closed when qualification evidence or the retained bundle is
    missing or fails identity verification
  - release-eligible qualification includes OS-portability evidence on Ubuntu/Linux,
    Windows, and macOS as separate axes from Python-version compatibility
  - Windows/macOS Python 3.12 complete-suite evidence proves source/runtime OS
    portability; the exact retained wheel additionally passes the installed-wheel
    harness on Windows/macOS Python 3.12 without rebuilding per OS
  alias_id: CAP-0046
  alias_name: verified-build-once-release-promotion
