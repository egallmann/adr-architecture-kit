schema_version: "1.0"
type: invariant
id: INV-0006
statement: "In-scope implementation artifacts must declare the ADRs that justify their existence through @implements_adr or an equivalent metadata-level attribution mechanism."
scope: global
enforcement_level: must
enforcement_mechanism: design
verification_method: automated
rationale: |
  Deterministic implementation-to-architecture traceability is required for
  drift detection, architecture coverage, embodied decision evidence, and
  machine navigation of implementation intent.

  The attribution mechanism depends on artifact type:
  - code surfaces use decorators or language-equivalent annotations
  - infrastructure, configuration, schema, pipeline, and script artifacts use
    file-level or stack-level metadata declarations

  Legacy onboarding remains profile-aware rather than schema-forked:
  greenfield scope is enforced strictly, while brownfield and migration
  profiles can tolerate staged attribution during onboarding.

defined_in: ADR-L-0004
enforced_by: ["ADR-P-0001"]
related_constraints: []

policy_reference: "ORG-POL-003"
compliance_frameworks: ["STE"]

validation_query: |
  For each in-scope implementation attribution evidence record:
  - require at least one ADR reference in greenfield mode
  - allow onboarding warnings rather than hard failure in brownfield and
    migration where attribution is not yet complete
  - require every referenced ADR ID to resolve to a canonical ADR entity
  - warn when evidence references a superseded ADR

validation_frequency: on_change
