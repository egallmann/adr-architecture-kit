name: Integration Assurance

on:
  workflow_call:
    inputs:
      full_os_portability:
        description: Run complete Windows and macOS source-suite qualification (release boundary).
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  semantic-core:
    uses: ./.github/workflows/semantic-core-qualification.yml

  source-compatibility:
    name: Source install / Python 3.14
    needs: semantic-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: semantic-core-${{ github.sha }}
          path: semantic-core-artifact
      - name: Install the qualified artifact for this commit
        run: >-
          python scripts/semantic_core_artifact_bundle.py consume
          --bundle-dir semantic-core-artifact
          --source-commit "${{ github.sha }}"
      - run: python scripts/verify_semantic_core_artifact.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - name: Enforce capability-based repository naming
        run: python scripts/check_repository_naming.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - name: Exercise portable source/SDK compatibility harness
        run: python scripts/run_source_compat.py

  typescript-consumer:
    name: TypeScript consumer binding / Node 20
    needs: semantic-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: semantic-core-${{ github.sha }}
          path: semantic-core-artifact
      - name: Install the qualified artifact for this commit
        run: >-
          python scripts/semantic_core_artifact_bundle.py consume
          --bundle-dir semantic-core-artifact
          --source-commit "${{ github.sha }}"
      - run: python scripts/verify_semantic_core_artifact.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: npm ci
        working-directory: packages/node
      - name: Audit Node dependencies
        run: |
          last_status=1
          for attempt in 1 2 3; do
            if npm audit --audit-level=moderate; then
              exit 0
            else
              last_status=$?
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed on attempt ${attempt}; retrying after a transient registry failure window"
              sleep $((attempt * 10))
            fi
          done
          exit "$last_status"
        working-directory: packages/node
      - run: npm run build
        working-directory: packages/node
      - run: npm run typecheck
        working-directory: packages/node
      - run: npm test
        working-directory: packages/node
      - name: Consumer binding contract conformance
        run: python -m pytest -q tests/test_consumer_binding_conformance.py tests/test_consumer_binding_vocabulary_versions.py
      - run: npm run browser:check
        working-directory: packages/node
      - run: npm run pack:check
        working-directory: packages/node

  governance:
    name: ADR, generated artifact, and contract governance
    needs: semantic-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: semantic-core-${{ github.sha }}
          path: semantic-core-artifact
      - name: Install the qualified artifact for this commit
        run: >-
          python scripts/semantic_core_artifact_bundle.py consume
          --bundle-dir semantic-core-artifact
          --source-commit "${{ github.sha }}"
      - run: python scripts/verify_semantic_core_artifact.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - name: Enforce capability-based repository naming
        run: python scripts/check_repository_naming.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: adr repair-canonical-ids --check
      - run: adr governance-checks --skip-tests
      - run: adr validate-generated-docs
      - run: adr validate-system-overview

  full-python-coverage:
    name: Python behavioral suite and coverage
    needs: semantic-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: semantic-core-${{ github.sha }}
          path: semantic-core-artifact
      - name: Install the qualified artifact for this commit
        run: >-
          python scripts/semantic_core_artifact_bundle.py consume
          --bundle-dir semantic-core-artifact
          --source-commit "${{ github.sha }}"
      - run: python scripts/verify_semantic_core_artifact.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - name: Run the non-governance suite with slow-test reporting and coverage
        run: >-
          python -m pytest -m "not governance" --durations=30
          --cov=adr_kit --cov-report=term-missing --cov-fail-under=80

  os-portability:
    name: Full Python suite / ${{ matrix.os }} / Python 3.14
    if: inputs.full_os_portability
    needs: semantic-core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: semantic-core-${{ github.sha }}
          path: semantic-core-artifact
      - name: Install the qualified artifact for this commit
        run: >-
          python scripts/semantic_core_artifact_bundle.py consume
          --bundle-dir semantic-core-artifact
          --source-commit "${{ github.sha }}"
      - run: python scripts/verify_semantic_core_artifact.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - name: Run full suite with slow-test reporting
        run: python -m pytest --durations=30

  quality-ratchets:
    name: Ruff / mypy / Black no-regression ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python scripts/check_quality_ratchets.py

  dependency-audit:
    name: Project dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Record interpreter
        run: python --version
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python -m pip_audit .
