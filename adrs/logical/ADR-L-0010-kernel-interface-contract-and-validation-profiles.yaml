schema_version: '1.0'
adr_type: logical
id: ADR-L-0010
title: Kernel Interface Contract and Validation Profiles
status: proposed
created_date: '2026-03-14'
authors:
- adr-architecture-kit
domains:
- kernel
- contract
- governance
- validation
tags:
- contract
