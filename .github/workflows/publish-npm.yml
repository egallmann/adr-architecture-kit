# Promote the exact tested npm bundle to npm through trusted publishing.
name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)promote to npm (e.g. v0.8.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-bundle:
    name: Resolve and verify retained npm bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Record interpreter
        run: python --version
      - name: Resolve release SHA
        id: release_sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="$(git rev-list -n 1 "${{ inputs.tag }}")"
          else
            sha="${{ github.sha }}"
          fi
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved release SHA: $sha"
      - name: Resolve release-eligible main qualification
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release_sha.outputs.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          completed = subprocess.run(
              [
                  sys.executable,
                  "scripts/resolve_qualified_release_bundle.py",
                  "resolve",
                  "--sha",
                  os.environ["RELEASE_SHA"],
                  "--workflow",
                  "adr-governance.yml",
                  "--branch",
                  "main",
                  "--event",
                  "push",
                  "--artifact-name",
                  "release-bundle",
              ],
              text=True,
              capture_output=True,
              check=False,
          )
          sys.stderr.write(completed.stderr)
          sys.stdout.write(completed.stdout)
          if completed.returncode != 0:
              raise SystemExit(completed.returncode)
          run_id = next((line.split("=", 1)[1].strip() for line in completed.stdout.splitlines() if line.startswith("run_id=")), None)
          if not run_id:
              raise SystemExit("resolver did not emit run_id")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"run_id={run_id}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release-bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.resolve.outputs.run_id }}
      - name: Verify retained npm bundle
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tarball="$(find release-bundle/node-dist -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          python scripts/verify_npm_tarball.py --tarball "$tarball" --expected-version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release-bundle
          path: release-bundle/node-dist/
          if-no-files-found: error

  publish:
    name: Publish retained bundle to npm
    needs: [resolve-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@system-of-thought/adr-kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install and verify Trusted Publishing toolchain
        run: |
          npm install --global npm@11.15.0
          test "$(node --version)" = "v22.14.0"
          test "$(npm --version)" = "11.15.0"
      - uses: actions/download-artifact@v4
        with:
          name: npm-release-bundle
          path: npm-release-bundle
      - name: Publish or confirm exact retained bundle without rebuilding
        run: |
          tarball="$(find npm-release-bundle -maxdepth 2 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          # Require an explicit relative/absolute path. A bare "dir/file.tgz" is
          # misread by npm as a GitHub package locator (git ls-remote ...tgz.git).
          case "$tarball" in
            /*|./*|../*) ;;
            *) tarball="./$tarball" ;;
          esac
          test -f "$tarball"
          publication_status="$(python scripts/check_npm_publication.py --tarball "$tarball")"
          case "$publication_status" in
            publish)
              npm publish "$tarball" --provenance --access public --registry https://registry.npmjs.org
              ;;
            noop)
              echo "exact npm version already exists; publication is an intentional no-op"
              ;;
            *)
              echo "unexpected npm publication status: $publication_status" >&2
              exit 1
              ;;
          esac
