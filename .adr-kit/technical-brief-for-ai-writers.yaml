ecosystem_integration:
  ste_runtime:
    relationship: "ADR Kit is Documentation-State Layer (Layer 5) of STE system"
    integration: "ste-runtime extracts ADRs via RECON, builds semantic graph"
    enables: "Graph queries, blast radius analysis, policy propagation"
    
    semantic_graph_architecture:
      type: "Bi-directional boundary tree"
      key_property: "Converges on relevant subgraph of insertion point"
      query_speed: "<100ms for complete context assembly"
      
      how_it_works: |
        1. RECON scans ADR YAML files
        2. Extracts entities (ADRs, components, interfaces, invariants)
        3. Builds graph with explicit relationships (implements, references, supersedes)
        4. RSS queries graph with natural language or entity IDs
        5. Graph returns complete subgraph (not just direct neighbors)
      
      example_subgraph_query:
        query: "context ADR-PC-0042"
        returns:
          - "ADR-PC-0042 (Physical-Component ADR)"
          - "ADR-PS-0012 (Physical-System it implements)"
          - "ADR-L-0042 (Logical capability it implements)"
          - "ADR-PC-0024 (Database component it depends on)"
          - "INV-001 (Invariants it must enforce)"
          - "src/api/user.py (Code that implements it)"
          - "tests/test_user.py (Tests that validate it)"
        time: "<100ms"
        traditional_approach: "Minutes of grep + file reading"
      
      boundary_tree_convergence:
        definition: |
          Bi-directional traversal from insertion point:
          - Upstream: What does this depend on? (ADR-PS, ADR-L, dependencies)
          - Downstream: What depends on this? (code, tests, other ADRs)
          - Boundary: Stop at natural boundaries (system boundaries, interface contracts)
        
        result: "Consistently rich context without noise or missing pieces"
        
        why_better_than_full_graph: |
          Full graph: 10,000 nodes (too much context, LLM overwhelmed)
          Boundary tree: 45 nodes (complete context, LLM optimized)
          
          The graph "knows" what's relevant based on relationships and boundaries.
      
      integration_with_adr_kit:
        adr_creation: "AI generates YAML → RECON extracts to graph"
        adr_query: "AI queries graph for context → Gets subgraph"
        adr_validation: "Compliance Watchdog queries graph → Detects drift"
        code_generation: "AI queries graph for ADR → Generates code → Links via decorators"
        
        key_insight: |
          ADR YAML is "source code" (human-readable, git-tracked)
          Semantic graph is "compiled form" (machine-optimized, queryable)
          
          Just like you don't read assembly to understand C code,
          AI doesn't read YAML to understand architecture - it queries the graph.
  
  specialized_providers:
    stackhawk: "Security vulnerability scanning, ADR-compliant fix proposals"
    mabl: "Automated testing, test generation from ADR specifications"
    qodo: "Code quality analysis, improvement proposals"
    
    value: "Providers speak common language (ADR format), automated evaluation"
  
  ai_model_providers:
    openai: "GPT-4 for validation, o1 for complex reasoning"
    anthropic: "Claude for code generation, analysis"
    local_models: "Llama, Mistral for interviews, inference"
    
    optimization: "Model-specific prompts generated from ADRs (20% better performance)"

