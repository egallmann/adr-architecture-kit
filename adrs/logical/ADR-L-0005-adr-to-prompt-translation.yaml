decisions:
- id: 019fee89-e615-71c4-b71d-61aed9baa000
  summary: Create ADR-to-Prompt Translator
  rationale: 'Automate the generation of implementation prompts from ADR specifications

    to ensure consistency, completeness, and scalability.


    Benefits:

    - **Consistency**: Same ADR always generates same prompt structure

    - **Completeness**: All invariants, capabilities, and specs included

    - **Traceability**: Prompt explicitly references source ADR

    - **Maintainability**: Update ADR → regenerate prompt automatically

    - **Scalability**: Works for any number of ADRs

    - **Quality**: Reduces human error in translation

    '
  alternatives_considered:
  - name: Manual prompt crafting
    rejected_because: Not scalable, error-prone
  - name: Template-based generation
    rejected_because: Less flexible, hard to maintain
  - name: LLM-based translation
    rejected_because: Non-deterministic, requires validation
  consequences:
    positive:
    - Prompts are generated, not hand-crafted
    - ADR changes automatically propagate to prompts
    - AI agents receive consistent, complete specifications
    - Reduces cognitive load on architects
    - Enables automated implementation pipelines
  alias_id: DEC-0010
  alias_name: create-adr-to-prompt-translator
- id: 019fee89-e615-7102-8f0f-d4652f6da679
  summary: Generate Prompts Per Component
  rationale: 'Physical ADRs contain multiple component specifications (COMP-*). Each

    component should have its own implementation prompt to enable:

    - Focused implementation (one component at a time)

    - Parallel implementation (multiple agents)

    - Incremental validation (per component)

    - Clear scope boundaries

    '
  consequences:
    positive:
    - One Physical ADR → Multiple prompts (one per component)
    - Prompts reference parent ADR for context
    - Prompts can be executed independently or sequentially
  alias_id: DEC-0017
  alias_name: generate-prompts-per-component
- id: 019fee89-e615-76e9-973a-af0e2b391d35
  summary: Include Validation Criteria in Prompts
  rationale: 'Each prompt should include explicit validation criteria so the implementing

    agent knows when it''s done and how to verify correctness. This enables

    self-validation and reduces iteration cycles.

    '
  consequences:
    positive:
    - Prompts are self-contained with success criteria
    - AI agents can self-validate before handoff
    - Reduces back-and-forth between design and implementation
  alias_id: DEC-0024
  alias_name: include-validation-criteria-in-prompts
- id: 019fee89-e615-753d-8537-efcdb8369a99
  summary: Support Multiple Target Agents
  rationale: 'Different AI agents (CODEX, Cursor, Claude, GPT) have different capabilities

    and prompt formats. The translator should support generating prompts optimized

    for specific target agents.

    '
  alternatives_considered:
  - name: Single universal prompt
    rejected_because: May not leverage agent-specific features
  - name: Manual per-agent prompts
    rejected_because: Not scalable
  consequences:
    positive:
    - Translator has agent-specific formatters
    - Can optimize for agent strengths
    - Maintains core content consistency across formats
  alias_id: DEC-0030
  alias_name: support-multiple-target-agents
invariants:
- id: 019fee89-e615-7e07-9f3f-9204fcab0da7
  statement: 'Generated prompts MUST include all invariants from the source ADR with

    their enforcement levels (must/should/may)

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Invariants are architectural constraints that MUST be enforced in implementation.

    Missing invariants in prompts leads to non-compliant code.

    '
  alias_id: INV-0046
  alias_name: inv-0046
- id: 019fee89-e615-755a-af33-7d2524161a7a
  statement: 'Generated prompts MUST include component specifications with complete

    interface definitions (methods, parameters, return types)

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Component specs define what to build. Incomplete specs lead to incorrect

    implementations that don''t match the architecture.

    '
  alias_id: INV-0047
  alias_name: inv-0047
- id: 019fee89-e615-7f70-901f-75cfe9860b82
  statement: 'Generated prompts MUST reference the source ADR ID and specific sections

    (invariant IDs, component IDs) for traceability

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Traceability enables validation of implementation against original ADR

    and helps AI agents understand authority chain.

    '
  alias_id: INV-0048
  alias_name: inv-0048
- id: 019fee89-e615-7572-b71e-6720464e70af
  statement: 'Generated prompts MUST include test requirements from the ADR

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Tests are part of the specification. Per ADR-L-0003, TDD methodology

    requires tests to be specified before implementation.

    '
  alias_id: INV-0049
  alias_name: inv-0049
- id: 019fee89-e615-7d44-8f3a-c6db615e9e28
  statement: 'Generated prompts SHOULD include implementation strategy guidance

    (e.g., TDD cycle, dependency injection patterns)

    '
  scope: global
  enforcement_level: should
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Implementation patterns help AI agents produce consistent, high-quality

    code that follows project conventions.

    '
  alias_id: INV-0050
  alias_name: inv-0050
- id: 019fee89-e615-7603-ab3f-2ec4a655831c
  statement: 'Prompt generator MUST be deterministic - same ADR input always produces

    same prompt output

    '
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: 'Non-deterministic generation violates SYS-2 (Deterministic Cognition).

    Prompts must be reproducible for validation and debugging.

    '
  alias_id: INV-0051
  alias_name: inv-0051
capabilities:
- id: 019fee89-e615-71de-ad3f-2d5d886efee2
  name: Parse Physical ADR Components
  description: 'Parse Physical ADRs to extract component specifications, including:

    - Component ID, name, type, description

    - Responsibilities

    - Interface definitions (methods, parameters, types)

    - Implementation identifiers (file paths)

    - Dependencies

    - Testing requirements

    '
  acceptance_criteria:
  - Extracts all COMP-* sections from Physical ADR
  - Parses interface definitions into structured data
  - Validates component specification completeness
  - Returns structured component metadata
  alias_id: CAP-0031
  alias_name: parse-physical-adr-components
- id: 019fee89-e615-7c78-8337-ff658fd422f8
  name: Generate Implementation Prompt
  description: 'Generate implementation prompt for a specific component that includes:

    - Context (what is being built and why)

    - Constraints (invariants to enforce)

    - Specifications (what to build)

    - Test requirements (what to verify)

    - Implementation strategy (how to build)

    - Validation criteria (how to verify correctness)

    '
  acceptance_criteria:
  - Prompt includes all relevant invariants
  - Prompt includes complete component spec
  - Prompt includes test requirements
  - Prompt references source ADR
  - Prompt is self-contained and executable
  alias_id: CAP-0032
  alias_name: generate-implementation-prompt
- id: 019fee89-e615-7e34-900f-7e37891efa10
  name: Generate Validation Checklist
  description: 'Generate validation checklist for verifying implementation against
    ADR,

    including checks for:

    - Code structure (files, classes, methods exist)

    - Invariant enforcement (constraints are enforced)

    - Test coverage (all required tests exist)

    - Integration testing (works in real environment)

    - Documentation (docstrings, type hints)

    '
  acceptance_criteria:
  - Checklist covers all invariants
  - Checklist covers all capabilities
  - Checklist covers all components
  - Checklist is actionable (clear pass/fail)
  alias_id: CAP-0033
  alias_name: generate-validation-checklist
- id: 019fee89-e615-7695-923e-7ae538b2d1d5
  name: Multi-Agent Prompt Generation
  description: 'Generate prompts for multiple components that can be executed in parallel

    by different AI agents, with clear dependency ordering

    '
  acceptance_criteria:
  - Identifies component dependencies
  - Generates execution order
  - Prompts can be executed independently
  - Dependency information included
  alias_id: CAP-0008
  alias_name: multi-agent-prompt-generation
- id: 019fee89-e615-76f9-9627-02674f7f34cc
  name: Prompt Format Adaptation
  description: 'Adapt prompt format for different target AI agents (CODEX, Cursor,
    Claude, GPT)

    while maintaining core content consistency

    '
  acceptance_criteria:
  - Supports multiple target formats
  - Core content identical across formats
  - Format optimized for target agent
  - Easy to add new formats
  alias_id: CAP-0009
  alias_name: prompt-format-adaptation
architectural_boundaries:
- id: 019fee89-e615-796d-a21f-4b1a70916550
  name: Prompt Translator
  description: 'Translates ADRs into implementation prompts

    '
  rationale: 'Separates ADR parsing from prompt generation for single responsibility.

    '
  inputs:
  - Physical ADR (YAML)
  - Component ID (optional, for single component)
  - Target agent (CODEX, Cursor, etc.)
  outputs:
  - Implementation prompt (markdown)
  - Validation checklist (markdown)
  constraints:
  - Must be deterministic (same input → same output)
  - Must preserve all invariants
  - Must include complete specifications
  alias_id: BOUND-0004
  alias_name: prompt-translator
