  alternatives_considered:
  - name: External unqualified ACC 1.1 extension or ambient ADR/repository configuration
    rejected_because: ACC 1.1 closed request and construction_qualification schemas cannot name or prove a fourth authority, and ambient repository state is not exact content qualification under INV-0116.
  - name: Separately versioned composition-binding SCF joined to ACC 1.1 by SCS or materialization profile
    rejected_because: ACC 1.1 cannot express the composite in its closed request or Constructed qualification; INV-0214 forbids a profile from redefining a set; INV-0216 forbids pairwise compatibility from qualifying an undeclared combination; no architecture-authoring profile exists; and a new ACC request schema would still be required, making this ACC 1.2 plus unused SCS machinery.
  - name: ADC-only successor that carries the binding row
    rejected_because: ADC is descriptive_only for construction execution, ADC 1.0 remains the advertised binding discovery version, and the relation token, endpoint rule, and writer are construction-procedure facts. ACC 1.1 pins ADC 1.1, so an ADC change would still require an ACC successor.
  - name: Protocol-defined semantic binding or semantic-core capability flag as authority
    rejected_because: Protocol is transport and capability advertisement. It is not a member of an ACC resource closure and cannot authorize new semantic meaning.
  - name: Rust-hardcoded semantic rows or host-local binding tables
    rejected_because: Hard-coded rows would create an independently interpreted semantic compiler beside the verified ACC closure and would allow the row to change without changing execution authority identity.
  consequences:
    positive:
    - One exact qualified closure member governs the binding without mutating ACC 1.0 or ACC 1.1.
    - Future rows are data publications under successor ACC versions rather than architecture redesigns.
    - ADC input_contract and Authoring 1.7 decision schema remain unchanged while their roles are partitioned explicitly.
    negative:
    - ACC 1.2 must be published before any composition execution can be qualified.
    - Composed ADR synthesis under a release target that currently names ACC 1.1 must revise that target to ACC 1.2.
