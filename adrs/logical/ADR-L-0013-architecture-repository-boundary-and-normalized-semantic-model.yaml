notes: 'Explicitly deferred beyond Phase 2 / into Phase 3 or later: graph bundles,
  transactional authoring, Assembler implementation, MCP, runtime extraction, rules,
  substrate, and admission capability. Topology remains structural-ID-only; intrinsic
  UUID identity for topology records remains deferred (D-09). Phase 2 completed deferrals
  no longer listed here: assertion identity, entity/schema expansion, bindings, and
  normalized-model expansion (now model 2.0).

  '
