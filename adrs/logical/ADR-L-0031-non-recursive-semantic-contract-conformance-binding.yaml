context: |
  Accepted semantic-contract authority defines SCF v1 as an identity over an
  immutable semantic-contract definition whose resource manifest contains
  exact content digests. Frozen normative conformance resources are members of
  that manifest, and resource closure verifies the supplied canonical bytes
  against those digests.

  A frozen conformance resource may need to exercise requests or results that
  carry the exact identity of its enclosing semantic contract. Literal
  insertion of that enclosing SCF into the same resource would make the
  resource bytes depend on the resource digest that participates in the SCF,
  creating an identity cycle. Fixed-point iteration is not a semantic identity
  mechanism and cannot resolve this recursive dependency.

  This ADR promotes the non-recursive authority boundary required for exact
  conformance resources. It preserves SCF v1 and exact closure, authorizes a
  conformance-only self-binding marker, and defines the bound value as a
  verified derived execution projection. It does not implement binding,
  modify ACC resources, add production APIs, or advertise construction.
decisions:
- id: 01a0b75d-8a02-70e6-b59c-63de2c0d119a
  alias_id: DEC-0240
  alias_name: preserve-scf-v1-exact-resource-identity
  summary: Preserve SCF v1 as exact immutable definition and resource-closure identity
  rationale: |
    SCF v1 remains scf:v1:sha256 over the immutable semantic-contract
    definition. Exact resource bytes, their content digests, the resource
    manifest, and frozen normative conformance membership remain semantic
    identity inputs. No field exclusion, alternate resource digest, or
    conformance-specific fingerprint calculation is introduced.
  related_invariants:
  - 01a0b75d-8a02-70e6-b59c-63e53aaa543e
- id: 01a0b75d-8a02-70e6-b59c-63df0f406680
  alias_id: DEC-0241
  alias_name: prohibit-literal-enclosing-scf-recursion
  summary: Prohibit a manifest-contributing resource from literally requiring its enclosing SCF
  rationale: |
    A resource whose exact content digest participates in an enclosing
    contract's SCF cannot contain a literal copy of that same final SCF as a
    required frozen value. The prohibition prevents an identity cycle without
    weakening exact qualification or removing the resource from semantic
    identity.
  related_invariants:
  - 01a0b75d-8a02-70e6-b59c-63e684f454c3
- id: 01a0b75d-8a02-70e6-b59c-63e0f6a94c2d
  alias_id: DEC-0242
  alias_name: authorize-conformance-only-enclosing-scf-marker
  summary: Authorize an explicit conformance-only self-binding marker
  rationale: |
    A frozen normative conformance resource MAY use the reserved marker
    $enclosing_scf at contract-declared binding locations. The marker means
    only the semanticContractFingerprint of the exact enclosing semantic
    contract whose verified resource closure contains the resource. It never
    means latest, current, installed, repository-derived, or default
    authority.
  related_invariants:
  - 01a0b75d-8a02-70e6-b59c-63e7c9b9778f
- id: 01a0b75d-8a02-70e6-b59c-63e1f2aea4ba
  alias_id: DEC-0243
  alias_name: require-verified-enclosing-contract-before-binding
  summary: Require enclosing definition and complete closure verification before self-binding
  rationale: |
    Binding is permitted only after the enclosing definition verifies against
    its declared SCF, every required resource in the manifest closes against
    exact supplied bytes, and the conformance resource is proven to be the
    exact manifest-qualified resource being bound. A caller-provided or
    ambient fingerprint cannot supply the replacement value.
  related_invariants:
  - 01a0b75d-8a02-70e6-b59c-63e83840bbf0
- id: 01a0b75d-8a02-70e6-b59c-63e2b630f585
  alias_id: DEC-0244
  alias_name: treat-bound-conformance-as-derived-execution-projection
  summary: Treat self-binding as a deterministic derived execution projection
  rationale: |
    Replacing an authorized marker with the verified enclosing SCF produces a
    bound request or result for conformance execution. That projection is not
    a new semantic-contract resource, does not enter the enclosing SCF
    preimage, does not mutate the frozen resource, and does not acquire
    independent semantic authority.
  related_invariants:
  - 01a0b75d-8a02-70e6-b59c-63e911e0a757
- id: 01a0b75d-8a02-70e6-b59c-63e324472903
  alias_id: DEC-0245
  alias_name: make-self-binding-path-scoped-and-closed
  summary: Restrict self-binding to explicit contract-declared locations
  rationale: |
    Binding must not be arbitrary recursive textual replacement. The
    conformance resource must declare the permitted locations and each marker
    is replaced only there by the verified enclosing SCF. Unknown markers,
    undeclared locations, conflicting binding sources, or markers remaining
    after binding fail closed.
  related_invariants:
  - 01a0b75d-8a02-70e6-b59c-63ea6b065e5b
- id: 01a0b75d-8a02-70e6-b59c-63e45624b3fa
  alias_id: DEC-0246
  alias_name: keep-self-binding-conformance-only-and-authority-neutral
  summary: Keep self-binding out of production semantics and preserve responsibility boundaries
  rationale: |
    The marker is permitted only in frozen conformance material. Production
    requests, results, retained exact source bases, and public schemas require
    the real verified SCF and reject the unbound marker. This authority adds no
    persistence, admission, governance, alias reservation, Runtime mutation,
    semantic inference, public capability, or host-specific semantic
    implementation.
  related_invariants:
  - 01a0b75d-8a02-70e6-b59c-63ec8e13995a
  - 01a0b75d-8a02-70e6-b59c-63ed9af7ac12
invariants:
- id: 01a0b75d-8a02-70e6-b59c-63e53aaa543e
  alias_id: INV-0240
  alias_name: scf-v1-remains-exact-resource-closure-identity
  statement: SCF v1 MUST remain an identity over the immutable semantic-contract definition and exact content-addressed resource closure; implementations MUST NOT exclude conformance resources, ignore fields in exact resource digests, or introduce an alternate semantic digest for this rule.
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: Exact closure and SCF identity remain one semantic authority.
- id: 01a0b75d-8a02-70e6-b59c-63e684f454c3
  alias_id: INV-0241
  alias_name: manifest-resource-must-not-literally-self-embed-enclosing-scf
  statement: A semantic resource whose exact content digest participates in an enclosing semantic contract SCF MUST NOT require a literal copy of that same enclosing SCF in its frozen bytes.
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: Literal self-embedding creates a recursive identity dependency.
- id: 01a0b75d-8a02-70e6-b59c-63e7c9b9778f
  alias_id: INV-0242
  alias_name: enclosing-scf-marker-is-conformance-only
  statement: The reserved marker $enclosing_scf MAY occur only in a frozen normative conformance resource at an explicitly declared self-binding location and MUST denote only the verified SCF of its exact enclosing semantic contract.
  scope: conformance
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: The marker is a closed conformance binding mechanism, not ambient authority.
- id: 01a0b75d-8a02-70e6-b59c-63e83840bbf0
  alias_id: INV-0243
  alias_name: self-binding-requires-verified-definition-and-closure
  statement: Self-binding MUST occur only after the enclosing semantic-contract definition verifies against its declared SCF, complete required resource closure verifies successfully, and the conformance resource is proven to be the exact manifest-qualified resource being bound.
  scope: conformance
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: Binding cannot establish or repair the authority it consumes.
- id: 01a0b75d-8a02-70e6-b59c-63e911e0a757
  alias_id: INV-0244
  alias_name: bound-conformance-is-derived-and-non-authoritative
  statement: A projection that replaces an authorized self-binding marker with the verified enclosing SCF MUST be treated as a deterministic execution projection, MUST NOT be a new semantic-contract resource, and MUST NOT mutate or replace the frozen resource.
  scope: conformance
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: Execution binding does not create a second identity or authority.
- id: 01a0b75d-8a02-70e6-b59c-63eba3864cbe
  alias_id: INV-0245
  alias_name: self-binding-locations-are-closed-and-path-scoped
  statement: Self-binding MUST replace markers only at contract-declared locations; unknown markers, undeclared locations, multiple conflicting binding sources, and markers remaining after binding MUST fail closed.
  scope: conformance
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: Closed paths prevent arbitrary recursive replacement from becoming semantic behavior.
- id: 01a0b75d-8a02-70e6-b59c-63ea6b065e5b
  alias_id: INV-0246
  alias_name: production-wire-surfaces-reject-unbound-marker
  statement: Production wire schemas, public APIs, ordinary consumer requests, semantic results, and retained exact source bases MUST require the real verified scf:v1:sha256 value and MUST reject an unbound $enclosing_scf marker.
  scope: production
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: Conformance-only self-binding cannot weaken production exact qualification.
- id: 01a0b75d-8a02-70e6-b59c-63ec8e13995a
  alias_id: INV-0247
  alias_name: corpus-changes-change-enclosing-contract-identity
  statement: Any change to a frozen unbound conformance resource, including case meaning, expected results, diagnostics, binding declarations, binding locations, or the self-binding marker, MUST change its exact resource digest and therefore the enclosing semantic-contract identity.
  scope: conformance
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: automated
  rationale: Self-binding must not provide a loophole around normative contract identity.
- id: 01a0b75d-8a02-70e6-b59c-63ed9af7ac12
  alias_id: INV-0248
  alias_name: self-binding-does-not-move-authority-or-add-capability
  statement: Self-binding MUST NOT create persistence, repository admission, governance promotion, alias reservation, Runtime mutation, semantic inference, or a host-specific semantic implementation, and peer hosts MUST obtain equivalent binding semantics from one canonical authority when implemented.
  scope: global
  enforcement_level: must
  enforcement_mechanism: design
  verification_method: manual
  rationale: Binding preserves the existing responsibility boundaries and canonical execution authority.
gaps: []
notes: |
  This promotion responds to the recursive identity contradiction exposed while
  hardening Authoring Construction Contract 1.0. The unbound frozen
  conformance resource remains the normative content-addressed resource. A
  future shared semantic authority may derive a bound execution projection
  only after verified definition and closure checks.

  The marker and binding declarations are conformance-only authority. They do
  not authorize ACC schema changes, semantic-core 1.2 implementation,
  architecture-authoring@1.0, public construction or validation capabilities,
  persistence, Runtime integration, or release packaging. Python and
  TypeScript/Node MUST NOT independently evolve binding semantics; future
  execution belongs to the shared canonical semantic authority.

  No accepted historical semantic-contract definition is amended or replaced
  by this ADR. ACC cleanup may proceed in a later bounded slice after the
  conformance resource uses this non-recursive authority boundary.
