id: 01a0b75d-8a02-70e6-b59c-63dd6133c637
alias_id: ADR-L-0031
alias_name: non-recursive-semantic-contract-conformance-binding
title: Non-Recursive Semantic Contract Conformance Binding
status: accepted
created_date: '2026-09-18'
authors:
