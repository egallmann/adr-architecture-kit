  alias_id: CAP-0003
  alias_name: semantic-graph-integration
- id: 019fee89-e614-733f-9e37-fbd70087182d
  name: Explicit Gap Tracking
  description: 'Incomplete designs are first-class schema elements. Gaps are structured
