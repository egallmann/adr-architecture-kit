context: "# ADR Architecture Kit — STE Authoring Subsystem\n\nThis ADR captures the\
  \ design of the ADR Architecture Kit as the STE authoring\nsubsystem for canonical\
  \ ADR encoding and authoring-time validation. ADR Kit is\nsubordinate to ste-spec\
  \ (normative contracts), ste-runtime (runtime evidence),\nand ste-kernel (admission\
  \ and governance). It does not own those responsibilities.\n\n## Problem Space\n\
  \nArchitecture documentation suffers from fundamental problems:\n\n1. **Implicit\
  \ assumptions** - Architecture decisions rely on undocumented context\n2. **Drift**\
  \ - Documentation diverges from implementation without detection\n3. **Narrative\
  \ ambiguity** - Free-form markdown prevents deterministic reasoning\n4. **Manual\
  \ governance** - No automated validation of architectural compliance\n5. **Disconnected\
  \ artifacts** - Architecture docs don't participate in semantic reasoning\n\n##\
  \ Business Drivers\n\nThe System of Thought Engineering (STE) framework provides\
  \ a normative specification for\ngovernable AI cognition. ADR Kit provides the authoring-time\
  \ layer for canonical ADR\nencoding, enabling:\n\n- **Deterministic architecture\
  \ reasoning** - AI systems reason over structured artifacts\n- **Automated governance**\
  \ - Schema validation replaces manual review\n- **Semantic graph integration** -\
  \ Architecture participates in downstream graph extraction\n- **Policy propagation**\
  \ - Architectural decisions become enforceable constraints downstream\n- **Authoring\
  \ correctness** - Schema-validated ADRs before they enter the runtime pipeline\n\
  \n## Constraints\n\nThis system operates under STE invariants:\n\n- **PRIME-1**:\
  \ No implicit assumptions (all architecture explicit)\n- **PRIME-2**: No undeclared\
  \ state (all metadata in frontmatter)\n- **SYS-2**: Deterministic cognition through\
  \ constraints (schema validation)\n- **SYS-4**: Drift prevention as first-class\
  \ objective (violations halt execution)\n- **SYS-5**: ADRs as authoritative authoring\
  \ source (ADRs precede implementation)\n- **SYS-6**: RECON completion prerequisite\
  \ (architecture extracted before reasoning)\n- **SYS-13**: Graph completeness (bidirectional\
  \ relationships)\n- **SYS-14**: Index currency (manifest generated from ADRs)\n\n\
  ## STE Platform Position\n\nADR Kit is the authoring subsystem in the STE platform.\
  \ Its authority is scoped\nto authoring correctness and the adapter layer into the\
  \ public Architecture IR contract:\n\n```\nste-spec (normative contracts and public\
  \ Architecture IR schema)\n    ↓ governs\nadr-architecture-kit (authoring subsystem\
  \ — this project)\n    ↓ emits ADR-derived IR fragments conforming to ste-spec contract\n\
  ste-runtime (runtime evidence extraction and composition)\n    ↓ provides evidence\
  \ to\nste-kernel (admission and governance over compiled inputs)\n```\n"
capabilities:
- id: 019fee89-e614-7c68-be36-2c84d4579279
  name: Machine-Verifiable Architecture Documentation
  description: 'Enable AI systems to deterministically reason over architecture decisions
    through

    structured, schema-validated artifacts. No ambiguous markdown parsing, no implicit

    assumptions, no narrative drift.

    '
