  alias_id: CAP-0005
  alias_name: derived-manifest-generation
- id: 019fee89-e615-7946-a53f-af6bf655dc11
  name: Policy Integration Readiness
  description: 'Schema includes policy_reference, enforcement_level, compliance_frameworks
