schema_version: '1.0'
id: ADR-V-0012
adr_type: logical
vision_category: true
promotable_to_logical: true
title: Code Decorators (Intent Primitive)
absorbs_concepts_from:
- ADR-L-0004
status: proposed
created_date: '2024-03-10'
authors:
- adr-architecture-kit
tags:
- code-decorators
- intent
- traceability
- semantic-graph
context: |
  Code lacks explicit architectural intent:
  - Functions exist but don't explain why
  - Classes exist but don't link to design
  - Modules exist but don't reference ADRs

  Problems:
  - Intent is implicit (must infer from code)
  - Traceability is manual (search for related ADRs)
  - Validation is impossible (can't verify code matches ADR)
  - Review is broad (can't isolate relevant code)

  Example:
  ```python
  def authenticate_user(token: str) -> User:
      # Why does this exist?
      # Which ADR defines this?
      # What invariants must it maintain?
      # Unknown.
  ```

  Opportunity: Explicit intent markers in code.

  ## The Slice Architecture Insight

  RECON extracts code into slices (AST-based semantic entities):
  - Function slices (function definitions, signatures, dependencies)
  - Class slices (class definitions, methods, relationships)
  - Module slices (imports, exports, structure)

  ADRs are also extracted into slices:
  - ADR metadata slices (id, title, status, tags)
  - Component specification slices (interfaces, requirements)
  - Relationship slices (implements, references, supersedes)

  **Problem**: How do we link ADR slices to code slices?

  **Solution**: Code decorators are explicit edges in the semantic graph.

  ```
  ADR Slice (ADR-PC-0042)
        ↓
    [edge: implements]
        ↓
  Code Slice (authenticate_user function)
  ```

  Just like AST code slices have edges (function calls, imports),
  ADR-to-code relationships need explicit edges (decorators).

  **This is how the decorator idea emerged**: We needed explicit, extractable
  edges to build a bidirectional graph between architecture (ADRs) and
  implementation (code).
capability:
  name: Code Decorators (Intent Primitive)
  description: |
    A system of code decorators that explicitly link code to architectural
    intent (ADRs), enabling traceability, validation, and surgical code review.

    Decorators are explicit edges in the semantic graph that connect ADR slices
    to code slices, creating a bidirectional, queryable architecture-to-code graph.
  slice_architecture:
    description: |
      RECON extracts both ADRs and code into slices (semantic entities).
      Decorators create explicit edges between these slices.
    adr_slices:
      extraction: RECON scans ADR YAML files
      slice_types:
      - type: ADR metadata slice
        contains:
        - id
        - title
        - status
        - tags
        - created_date
        example: ADR-PC-0042 (User Service API Component)
      - type: Component specification slice
        contains:
        - interfaces
        - algorithms
        - error_handling
        - testing_requirements
        example: COMP-0001 (User Service API)
      - type: Interface slice
        contains:
        - type
        - endpoints
        - specification
        example: 'IFACE-0001 (REST API: GET /users, POST /users)'
      - type: Relationship slice
        contains:
        - implements
        - references
        - supersedes
        example: ADR-PC-0042 implements ADR-PS-0012
    code_slices:
      extraction: RECON scans source code (AST-based)
      slice_types:
      - type: Function slice
        contains:
        - signature
        - parameters
        - return_type
        - dependencies
        example: 'authenticate_user(token: str) -> User'
      - type: Class slice
        contains:
        - class_name
        - methods
        - properties
        - inheritance
        example: UserService class
      - type: Module slice
        contains:
        - imports
        - exports
        - functions
        - classes
        example: src/api/user.py module
    decorator_edges:
      description: Decorators create explicit edges between ADR slices and code slices
      edge_types:
      - edge: implements
        from: Code slice (function/class)
        to: ADR slice (component/interface)
        decorator: '@adr_implements(adr_id, component_id, interface_id)'
        example: authenticate_user → ADR-PC-0042 → COMP-0001 → IFACE-0001
      - edge: enforces
        from: Code slice (function)
        to: Invariant slice
        decorator: '@adr_invariant(invariant_id, description)'
        example: validate_token_expiry → INV-001
      - edge: uses_algorithm
        from: Code slice (function)
        to: Algorithm slice (within ADR)
        decorator: '@adr_algorithm(adr_id, algorithm_name)'
        example: hash_password → ADR-PC-0042 → bcrypt algorithm
      bidirectional_traversal:
        forward: ADR → Code (what code implements this ADR?)
        backward: Code → ADR (why does this code exist?)
        example_queries:
        - query: Find all code that implements ADR-PC-0042
          graph_traversal: ADR-PC-0042 → [implements edges] → code slices
          result:
          - authenticate_user()
          - create_user()
          - get_user()
        - query: Why does authenticate_user() exist?
          graph_traversal: authenticate_user() → [implements edge] → ADR-PC-0042
          result: Implements authentication-api interface of user-service component
        - query: What code enforces security invariants?
          graph_traversal: INV-* (security tag) → [enforces edges] → code slices
          result:
          - validate_token_expiry()
          - check_permissions()
          - encrypt_data()
    graph_structure:
      visualization: |
        ┌─────────────────────────────────────────────────────────────┐
        │                    Semantic Graph                           │
        ├─────────────────────────────────────────────────────────────┤
        │                                                             │
        │  ADR Slices                    Code Slices                 │
        │  ┌──────────────┐              ┌──────────────┐            │
        │  │ ADR-PC-0042  │              │ user.py      │            │
        │  │ (metadata)   │              │ (module)     │            │
        │  └──────────────┘              └──────────────┘            │
        │         │                              │                   │
        │         │ contains                     │ contains          │
        │         ↓                              ↓                   │
        │  ┌──────────────┐              ┌──────────────┐            │
        │  │ COMP-0001    │←─implements──│authenticate_ │            │
        │  │ (component)  │              │user()        │            │
        │  └──────────────┘              └──────────────┘            │
        │         │                              │                   │
        │         │ contains                     │ enforces          │
        │         ↓                              ↓                   │
        │  ┌──────────────┐              ┌──────────────┐            │
        │  │ IFACE-0001   │              │ INV-001      │            │
        │  │ (interface)  │              │ (invariant)  │            │
        │  └──────────────┘              └──────────────┘            │
        │                                                             │
        │  Edges created by:                                         │
        │  - RECON extraction (ADR structure, code AST)              │
        │  - Decorator extraction (@adr_implements, @adr_invariant)  │
        │                                                             │
        └─────────────────────────────────────────────────────────────┘
      key_insight: |
        Decorators are not just comments or metadata.
        They are explicit, extractable edges in the semantic graph.

        RECON extracts decorators from code → Creates graph edges → Enables queries

        This is why decorators solve the "missing intent primitive":
        They make architectural intent explicit, extractable, and queryable.
  decorator_types:
  - decorator: '@adr_implements'
    purpose: Link code to ADR component/interface
    syntax: '@adr_implements(adr_id, component_id, interface_id)'
    example:
      code: |
        @adr_implements("ADR-PC-0042", "user-service", "authentication-api")
        def authenticate_user(token: str) -> User:
            """Authenticate user via JWT token."""
            # Implementation
      meaning:
      - This function implements ADR-PC-0042
      - Specifically the user-service component
      - Specifically the authentication-api interface
    benefits:
    - Traceability (code → ADR)
    - Validation (verify code matches ADR spec)
    - Review (isolate code for specific ADR)
  - decorator: '@adr_invariant'
    purpose: Mark code that enforces invariants
    syntax: '@adr_invariant(invariant_id, description)'
    example:
      code: |
        @adr_invariant("INV-001", "Token expiry must be <= 15 minutes")
        def validate_token_expiry(token: Token) -> bool:
            return token.expiry_minutes <= 15
      meaning:
      - This function enforces INV-001
      - 'Invariant: Token expiry <= 15 minutes'
    benefits:
    - Invariant visibility (know what's enforced)
    - Invariant validation (verify enforcement)
    - Invariant review (isolate invariant code)
  - decorator: '@adr_algorithm'
    purpose: Link code to ADR algorithm specification
    syntax: '@adr_algorithm(adr_id, algorithm_id)'
    example:
      code: |
        @adr_algorithm("ADR-PC-0042", "jwt-validation")
        def validate_jwt(token: str) -> bool:
            """Validate JWT using RS256."""
            # Implementation matches ADR-PC-0042 algorithm spec
      meaning:
      - This function implements jwt-validation algorithm
      - Algorithm defined in ADR-PC-0042
    benefits:
    - Algorithm traceability (code → spec)
    - Algorithm validation (verify correct implementation)
  - decorator: '@adr_test'
    purpose: Link tests to ADR requirements
    syntax: '@adr_test(adr_id, requirement_id)'
    example:
      code: |
        @adr_test("ADR-PC-0042", "REQ-AUTH-001")
        def test_jwt_validation():
            """Test JWT validation per ADR-PC-0042."""
            # Test implementation
      meaning:
      - This test validates REQ-AUTH-001
      - Requirement defined in ADR-PC-0042
    benefits:
    - Test traceability (test → requirement)
    - Coverage validation (all requirements tested)
  extraction_and_validation:
  - phase: Extraction (RECON)
    description: Extract decorator information from code
    process:
    - Parse source code (AST analysis)
    - Extract decorator metadata
    - Build code-to-ADR mapping
    - Generate EDR (Extracted Design Record)
    output:
      format: EDR with decorator metadata
      includes:
      - Which code implements which ADR
      - Which code enforces which invariant
      - Which tests validate which requirement
  - phase: Validation (Compliance Watchdog)
    description: Validate code matches ADR specifications
    checks:
    - All ADR components have implementing code
    - All implementing code matches ADR spec
    - All invariants are enforced
    - All requirements are tested
    output:
      format: Compliance report
      includes:
      - Missing implementations (ADR without code)
      - Undocumented code (code without ADR)
      - Unenforced invariants (invariant without code)
      - Untested requirements (requirement without test)
  - phase: Semantic Graph
    description: Build graph of relationships
    nodes:
    - ADRs (architecture decisions)
    - Code (functions, classes, modules)
    - Invariants (constraints)
    - Tests (validations)
    edges:
    - implements (code → ADR)
    - enforces (code → invariant)
    - validates (test → requirement)
    - depends_on (ADR → ADR)
    queries:
    - Find all code implementing ADR-PC-0042
    - Find all invariants enforced by user-service
    - Find all tests validating authentication
    - Find all code affected by security signal
boundaries:
  in_scope:
  - Decorator syntax and semantics
  - Extraction from code (RECON)
  - Validation against ADRs
  - Semantic graph construction
  out_of_scope:
  - Language-specific implementations (support multiple languages)
  - IDE integration (separate tooling)
  - Automatic decorator generation (future)
contracts:
  decorator_schema:
    description: Standard format for decorators
    decorators:
    - name: '@adr_implements'
      parameters:
      - adr_id (string, required)
      - component_id (string, optional)
      - interface_id (string, optional)
    - name: '@adr_invariant'
      parameters:
      - invariant_id (string, required)
      - description (string, required)
    - name: '@adr_algorithm'
      parameters:
      - adr_id (string, required)
      - algorithm_id (string, required)
    - name: '@adr_test'
      parameters:
      - adr_id (string, required)
      - requirement_id (string, required)
  edr_schema:
    description: EDR format with decorator metadata
    fields:
    - code_elements (functions, classes, modules)
    - adr_mappings (code → ADR)
    - invariant_mappings (code → invariant)
    - test_mappings (test → requirement)
quality_attributes:
- attribute: Traceability
  requirement: Easily trace code to ADRs
  measurement: Percentage of code with ADR decorators
  target: '> 90%'
- attribute: Validation Accuracy
  requirement: Accurately validate code matches ADRs
  measurement: False positive/negative rate
  target: < 1%
- attribute: Review Efficiency
  requirement: Quickly isolate relevant code
  measurement: Time to find code for specific ADR
  target: < 1 minute
- attribute: Adoption
  requirement: Developers use decorators
  measurement: Percentage of new code with decorators
  target: '> 95%'
rationale: |
  **Why code decorators?**

  Code is missing the "why":
  - Function exists → but why?
  - Class exists → but which ADR?
  - Module exists → but what invariants?

  Decorators make intent explicit:
  - @adr_implements → this code implements this ADR
  - @adr_invariant → this code enforces this invariant
  - @adr_algorithm → this code implements this algorithm

  **Benefits:**

  1. Traceability
     - Code → ADR (find design for code)
     - ADR → Code (find code for design)

  2. Validation
     - Verify code matches ADR spec
     - Detect missing implementations
     - Detect undocumented code

  3. Surgical Code Review
     - Isolate code by signal
     - Review only relevant code
     - Ignore unrelated code

  **Example: Security audit**

  Traditional approach:
  - Review all code (10,000 lines)
  - Manually find security-related code
  - Miss some code (human error)
  - Timeline: 1-2 weeks

  Decorator approach:
  - Query: "Find all code with signal:security-audit"
  - Semantic graph returns: 500 lines (5% of codebase)
  - Review only relevant code
  - Timeline: 1-2 days

  **10x faster, 100% coverage.**

  **Example: Surgical code review**

  Signal: "security-audit"

  Query semantic graph:
  ```
  FIND code WHERE:
    - @adr_implements(adr_id) AND adr_id.tags CONTAINS "security"
    - OR @adr_invariant(invariant_id) AND invariant_id.category = "security"
    - OR @adr_algorithm(adr_id, algorithm_id) AND algorithm_id CONTAINS "auth"
  ```

  Result:
  - authenticate_user() (ADR-PC-0042, authentication-api)
  - validate_token_expiry() (INV-001, token expiry)
  - validate_jwt() (ADR-PC-0042, jwt-validation)
  - encrypt_password() (ADR-PC-0042, password-hashing)

  Review only these functions (500 lines vs 10,000 lines).

  **Why this solves the "missing intent primitive"?**

  Code has primitives for:
  - Data (variables, constants)
  - Behavior (functions, methods)
  - Structure (classes, modules)

  But no primitive for:
  - Intent (why does this exist?)
  - Design (which ADR defines this?)
  - Constraints (what invariants must hold?)

  Decorators add the missing primitive:
  - @adr_implements → intent
  - @adr_invariant → constraints
  - @adr_algorithm → design

  Now code is self-documenting.
alternatives_considered:
- alternative: Comments only
  pros:
  - Simple (no new syntax)
  - Flexible (free-form text)
  cons:
  - Not machine-readable (can't parse)
  - Not enforced (can be outdated)
  - Not queryable (can't search)
  why_not_chosen: Need machine-readable, enforceable intent
- alternative: Separate mapping file
  pros:
  - Doesn't modify code
  - Centralized (one file)
  cons:
  - Separated from code (easy to drift)
  - Manual maintenance (error-prone)
  - Not visible in code (developers don't see)
  why_not_chosen: Intent should be co-located with code
- alternative: No explicit intent
  pros:
  - Simpler (no decorators)
  - Less code (no annotations)
  cons:
  - Intent implicit (must infer)
  - Traceability manual (search for ADRs)
  - Validation impossible (can't verify)
  why_not_chosen: Explicit intent enables automation
trade_offs:
- trade_off: Decorators add boilerplate
  acceptance: Boilerplate is minimal, value is high
  mitigation: IDE snippets, auto-generation (future)
- trade_off: Decorators may become outdated
  acceptance: Validation detects outdated decorators
  mitigation: Automated validation in CI/CD
- trade_off: Language-specific syntax
  acceptance: Each language has decorator/annotation syntax
  mitigation: Standard semantics, language-specific syntax
success_criteria:
- criterion: Adoption rate
  measurement: Percentage of code with decorators
  target: '> 90%'
- criterion: Traceability
  measurement: Time to find code for ADR
  target: < 1 minute
- criterion: Validation accuracy
  measurement: False positive/negative rate
  target: < 1%
- criterion: Review efficiency
  measurement: Time for surgical code review
  target: < 1 day (vs 1-2 weeks)
dependencies:
  requires:
  - ADR system (provides ADR IDs, component IDs)
  - RECON extractor (extracts decorators from code)
  - Semantic graph (stores relationships)
  enables:
  - Surgical code review (isolate by signal)
  - Compliance validation (verify code matches ADR)
  - Self-evolving infrastructure (know what code to update)
risks:
- risk: Developers don't use decorators
  likelihood: medium
  impact: high
  mitigation: Validation in CI/CD, IDE integration, education
- risk: Decorators become outdated
  likelihood: medium
  impact: medium
  mitigation: Automated validation, update prompts
- risk: Performance overhead (decorator processing)
  likelihood: low
  impact: low
  mitigation: Decorators are metadata only, no runtime cost
notes: "This is the \"intent primitive\" capability.\n\nCode before decorators:\n\
  ```python\ndef authenticate_user(token: str) -> User:\n    # Why does this exist?\
  \ Unknown.\n    # Which ADR? Unknown.\n    # What invariants? Unknown.\n    pass\n\
  ```\n\nCode with decorators:\n```python\n@adr_implements(\"ADR-PC-0042\", \"user-service\"\
  , \"authentication-api\")\n@adr_algorithm(\"ADR-PC-0042\", \"jwt-validation\")\n\
  def authenticate_user(token: str) -> User:\n    \"\"\"Authenticate user via JWT\
  \ token.\"\"\"\n    \n    @adr_invariant(\"INV-001\", \"Token expiry <= 15 minutes\"\
  )\n    def validate_expiry():\n        return token.expiry_minutes <= 15\n    \n\
  \    # Implementation\n```\n\nNow the code is self-documenting:\n- Implements ADR-PC-0042\n\
  - Specifically authentication-api interface\n- Uses jwt-validation algorithm\n-\
  \ Enforces INV-001 invariant\n\nThis enables:\n- Traceability (code → ADR → design)\n\
  - Validation (verify code matches spec)\n- Surgical review (isolate by signal)\n\
  \nExample surgical review query:\n\n\"Find all code related to security-audit signal\"\
  \n\nSemantic graph query:\n```cypher\nMATCH (code:Function)-[:IMPLEMENTS]->(adr:ADR)\n\
  WHERE adr.tags CONTAINS \"security\"\nRETURN code\n\nUNION\n\nMATCH (code:Function)-[:ENFORCES]->(inv:Invariant)\n\
  WHERE inv.category = \"security\"\nRETURN code\n```\n\nResult: 500 lines of security-related\
  \ code (vs 10,000 lines total).\n\nReview only relevant code, 10x faster.\n"
