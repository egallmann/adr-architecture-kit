schema_version: "1.0"
type: invariant
id: INV-0001
statement: "All ADRs must validate against JSON Schema before commit"
scope: global
enforcement_level: must
enforcement_mechanism: policy
verification_method: automated
rationale: |
  Schema validation ensures:
  - Structural integrity (all required fields present)
  - Type correctness (strings are strings, arrays are arrays)
  - Pattern compliance (ID formats, enums)
  - STE compliance (PRIME-1, PRIME-2, SYS-2)
  - Graph extraction readiness (explicit relationships)
  
  Without schema validation, ADRs could contain:
  - Missing required fields
  - Invalid ID formats
  - Type mismatches
  - Broken references
  
  These would cause:
  - Parser failures
  - Graph extraction failures
  - Manifest generation failures
  - CI failures
  
  Schema validation is the first line of defense against divergence (SYS-4).

defined_in: ADR-L-0001
enforced_by: ["ADR-P-0002"]
related_constraints: ["CONST-0001"]

policy_reference: "ORG-POL-001"
compliance_frameworks: ["STE"]

validation_query: |
  Run `adr validate --cross-references` in CI for ADR artifact validation.
  Run `adr governance-checks` for the standard contract-and-test governance bundle.
  Exit code 0 = all validation gates pass.
  Exit code 1 = validation failures (halt build).

validation_frequency: on_change
