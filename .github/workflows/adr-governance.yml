name: ADR Governance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source-tests:
    name: Source install / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - name: Exercise installed SDK consumer outside the checkout
        run: |
          mkdir -p "${RUNNER_TEMP}/sdk-consumer/fixture/adrs/logical"
          cp PROJECT.yaml "${RUNNER_TEMP}/sdk-consumer/fixture/PROJECT.yaml"
          cp tests/fixtures/valid/logical-minimal.yaml "${RUNNER_TEMP}/sdk-consumer/fixture/adrs/logical/ADR-L-9999-minimal.yaml"
          cd "${RUNNER_TEMP}/sdk-consumer"
          env -u PYTHONPATH python "${GITHUB_WORKSPACE}/scripts/test_sdk_consumer.py" --project-root fixture --version-source metadata
      - name: Exercise direct-source version fallback outside the checkout
        run: |
          cd "${RUNNER_TEMP}/sdk-consumer"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" python "${GITHUB_WORKSPACE}/scripts/test_sdk_consumer.py" --project-root fixture --version-source source
      - run: python -m pip install -e .
      - name: Exercise editable SDK consumer outside the checkout
        run: |
          cd "${RUNNER_TEMP}/sdk-consumer"
          env -u PYTHONPATH python "${GITHUB_WORKSPACE}/scripts/test_sdk_consumer.py" --project-root fixture --version-source metadata
      - run: python -m pytest

  governance:
    name: ADR, generated artifact, and contract governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: adr validate --cross-references
      - run: adr repair-canonical-ids --check
      - run: adr governance-checks
      - run: adr validate-generated-docs
      - run: adr validate-system-overview
      - run: python -m pytest tests/test_package_schema_parity.py tests/golden/test_current_outputs.py
      - run: python scripts/run_local_pre_push_checks.py

  coverage:
    name: Canonical package coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python -m pytest --cov=adr_kit --cov-report=term-missing --cov-fail-under=80

  quality-ratchets:
    name: Ruff / mypy / Black no-regression ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python scripts/check_quality_ratchets.py

  dependency-audit:
    name: Project dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python -m pip_audit .

  release-artifacts:
    name: Build and validate the retained release bundle once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python scripts/check_version_consistency.py
      - name: Build retained bundle once
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --outdir python-dist
          python scripts/release_manifest.py normalize-sdist --sdist "$(find python-dist -maxdepth 1 -name '*.tar.gz' -print -quit)" --source-date-epoch "${SOURCE_DATE_EPOCH}"
      - run: python -m twine check python-dist/*
      - run: python scripts/release_manifest.py create --dist-dir python-dist --output python-dist/release-manifest.json --source-commit "${GITHUB_SHA}" --version "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: python-dist/
          if-no-files-found: error

  wheel-smoke:
    name: Retained wheel / Python ${{ matrix.python-version }}
    needs: release-artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: python-dist
      - run: python scripts/test_installed_wheel.py --wheel "$(find python-dist -maxdepth 1 -name '*.whl' -print -quit)"
      - run: python scripts/test_installed_wheel.py --describe | grep sdk-consumer

  reproducibility:
    name: Fixed-epoch distribution reproducibility
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1767225600"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --outdir "${RUNNER_TEMP}/build-one"
      - run: python -m build --outdir "${RUNNER_TEMP}/build-two"
      - run: python scripts/release_manifest.py normalize-sdist --sdist "$(find "${RUNNER_TEMP}/build-one" -maxdepth 1 -name '*.tar.gz' -print -quit)" --source-date-epoch "${SOURCE_DATE_EPOCH}"
      - run: python scripts/release_manifest.py normalize-sdist --sdist "$(find "${RUNNER_TEMP}/build-two" -maxdepth 1 -name '*.tar.gz' -print -quit)" --source-date-epoch "${SOURCE_DATE_EPOCH}"
      - run: python -c "import hashlib,pathlib,sys; a=sorted((pathlib.Path('${RUNNER_TEMP}')/'build-one').iterdir()); b=sorted((pathlib.Path('${RUNNER_TEMP}')/'build-two').iterdir()); ha=[hashlib.sha256(p.read_bytes()).hexdigest() for p in a]; hb=[hashlib.sha256(p.read_bytes()).hexdigest() for p in b]; print(dict(zip([p.name for p in a],ha))); sys.exit(ha != hb)"

  benchmark-smoke:
    name: Deterministic benchmark functional smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .[dev]
      - run: python benchmarks/phase0.py --corpus synthetic --sizes 10 --warmups 0 --repeats 1 --json-out benchmark-smoke.json
