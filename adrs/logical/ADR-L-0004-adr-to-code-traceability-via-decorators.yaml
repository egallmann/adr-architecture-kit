notes: "Implementation phases:\n\nPhase 1: Decorator Library (ADR-PC-0007)\n- Native\
  \ adr_kit.decorators module is the Stable embodiment\n- Legacy @implements_adr / @enforces_invariant\
  \ remain metadata-only\n- UUID @implements / @enforces / @embodies compose canonical\
  \ claims\n\nPhase 2: Evidence Contract + Validation\n- v1.5 semantic attribution\
  \ evidence is UUID-canonical (ADR-L-0020)\n- Validate evidence against canonical\
  \ ADR state with profile-aware onboarding semantics\n- Keep attribution authority\
  \ in ADR-Kit, not in downstream extractors\n- Do not parse consumer source in this\
  \ repository\n\nPhase 3: Downstream Extraction (ste-runtime)\n- Extract decorators\
  \ / metadata from code and infrastructure artifacts\n- Emit implementation attribution\
  \ evidence with provenance and UUID targets\n- Preserve provenance for EDR and drift\
  \ analysis\n\nPhase 4: Legacy Onboarding\n- Selective high-authority annotation only\n\
  - Do not dual-encode equivalent legacy alias and UUID edges\n- Use greenfield, brownfield,\
  \ and migration profiles to control enforcement\n\nPhase 5: Optional Rule Activation\
  \ (ste-rules-library)\n- Encode reusable rule activation only after the authority\
  \ and evidence contracts are stable\n- Keep downstream delivery additive rather\
  \ than redefining semantics\n\nUUID targets are canonical. Aliases are presentation\
  \ and 1.0/1.2 translation input. A decorator declaration is evidence of intent,\
  \ not proof. The governed stages are source declaration, validated embodiment\
  \ linkage, and separately governed graph admission. ADR-Kit owns the first two\
  \ contracts but the linkage projection remains derived evidence and never performs\
  \ graph admission.\n"
