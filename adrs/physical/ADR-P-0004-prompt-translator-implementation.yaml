notes: |
  Implementation priority: HIGH

  This component is foundational for scaling AI-driven development. Once
  implemented, any Physical ADR can be automatically translated into
  implementation prompts, dramatically reducing manual work.

  The prompt translator itself should be implemented following TDD:
  1. Write tests for parsing ADR-P-0003
  2. Implement ComponentParser
  3. Write tests for template rendering
  4. Implement PromptGenerator
  5. Write tests for CLI
  6. Implement CLI command

  Self-referential: Once the prompt translator is implemented, it can
  generate prompts for future components from their ADRs, including
  prompts for enhancing itself!

  Cooperative Signals:
  The prompt translator generates file-based signals for coordinating parallel
  AI agents until proper Rules & Signal Service is built. These signals enable:
  - Component ownership claims (prevent duplicate work)
  - Progress broadcasting (agents see each other's status)
  - Dependency satisfaction signals (Wave 1 complete → Wave 2 can start)
  - Completion signals (component done → validator can check)

  Signal files live in .codex/signals/ and are ephemeral coordination artifacts,
  not tracked in git. This is a temporary file-based coordination mechanism
  that will be replaced by proper Rules & Signal Service (ADR-L-0004) when
  that tier is implemented.
