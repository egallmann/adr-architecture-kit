context: 'Schema and contract validation is now a stable component boundary rather
  than

  a generic legacy physical slice. It validates canonical ADR structure,

  profile-specific contract requirements, project metadata, and implementation

  attribution evidence. Validation of that evidence is structural for schema
  shape and architecture-aware when claims must resolve to canonical UUIDs and
  entity types. Legacy 1.0/1.2 evidence normalizes to the v1.5 claim shape only
  with repository or model 2.0 context.

  '
technology_stack:
- category: language
  name: Python
  version: '3.11'
  rationale: Existing implementation language.
- category: library
  name: jsonschema
  version: 4.x
  rationale: Structural schema validation.
- category: library
  name: Pydantic
  version: 2.x
  rationale: Typed contract and validation result models.
component_specifications:
- id: 019fee89-e617-7060-8f3f-4ecd46a719da
  name: Schema and Contract Validation Surface
  type: service
  responsibilities: '- Validate canonical ADR artifacts against schema and business
    rules

    - Validate kernel-facing contract profiles

    - Validate project metadata and implementation attribution evidence

    - Provide CLI entrypoints for validation workflows

    '
  generation_context:
    purpose: Validate canonical architecture artifacts before downstream use.
    key_responsibilities:
    - Enforce schema and contract expectations
    - Produce deterministic validation issues
    - Fail closed on invalid contract inputs
    constraints:
    - Validation authority must remain canonical-artifact-first
    - Consumer code must not invent a second contract interpretation path
    success_criteria:
    - Contract/profile validation runs through shared validation surfaces
    - Validation failures are deterministic and actionable
  interfaces:
  - id: 019fee89-e617-78b8-852f-9b2c984f9300
    type: CLI
    specification: 'Commands:

      - adr validate

      - adr validate-contract

      - adr validate-project-metadata

      - adr validate-generated-docs

      '
    alias_id: IFACE-0012
    alias_name: iface-0012
  - id: 019fee89-e617-74dd-a62f-5ce1a1994d18
    type: library_api
    specification: 'A private validation application service supports both the compatibility-

      preserved CLI adapter and the `adr_kit.api.validate_architecture` adapter.

      The public adapter accepts one explicit project root, `complete` or

      `structural` mode, and optional cross-reference validation, then translates

      completed schema and semantic failures into immutable public diagnostics.

      '
    alias_id: IFACE-0017
    alias_name: iface-0017
  implementation_identifiers:
    module_path: src/adr_kit/schema/contract_validation.py
    entry_point: src/adr_kit/cli/main.py
    test_path: tests/test_kernel_contract_validation.py
  implementation_requirements:
    error_handling:
      strategy: Fail closed on invalid schema, invalid contract input, and invalid
        attribution evidence.
    observability:
      logging:
        level: info
        structured: false
      metrics:
      - name: validation_runs_total
        type: counter
    testing_requirements:
      unit_test_coverage: '>= 80%'
      integration_tests: '- Contract validation profile checks

        - Project metadata validation

        - Generated docs validation

        '
  alias_id: COMP-0011
  alias_name: schema-and-contract-validation-surface
implementation_decisions:
- id: 019fee89-e617-7fce-8823-fdf2ce5b321f
  summary: Treat schema and contract validation as a component boundary
  rationale: 'Validation surfaces are independently public, stable, and reused across
    CLI

    and downstream canonicalization workflows.

    '
  alias_id: IMPL-0012
  alias_name: treat-schema-and-contract-validation-as-a-component-boundary
- id: 019fee89-e617-7dfd-8e36-f98344f19758
  summary: Translate shared validation service results at the public SDK boundary
  rationale: 'CLI presentation and public SDK contracts have different compatibility

    responsibilities. One private application service prevents divergent

    validation semantics while adapters preserve CLI bytes and exclude validator

    implementation objects from the SDK result graph.

    '
  alias_id: IMPL-0018
  alias_name: translate-shared-validation-service-results-at-the-public-sdk-boundary
