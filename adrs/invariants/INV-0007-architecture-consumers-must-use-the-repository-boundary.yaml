schema_version: "1.0"
type: invariant
id: INV-0007
statement: "In-process architecture consumers must use ArchitectureRepository and its normalized semantic model rather than interpreting compiled registries ad hoc when the repository boundary is available."
scope: global
enforcement_level: must
enforcement_mechanism: design
verification_method: automated
rationale: |
  Direct registry interpretation by multiple consumers creates semantic drift,
  duplicates scope and relationship handling logic, and turns current registry
  layouts into an accidental long-term API.

  The repository boundary exists to centralize:
  - compiled bundle loading
  - contract validation
  - schema and layout adaptation
  - unresolved handling
  - provenance-preserving semantic interpretation

defined_in: ADR-L-0013
enforced_by: ["ADR-P-0001"]
related_constraints: []

policy_reference: "ORG-POL-003"
compliance_frameworks: ["STE"]

validation_query: |
  For in-process consumer code:
  - prefer ArchitectureRepository over direct compiled-registry file reads
  - treat NormalizedArchitectureModel as the stable semantic payload
  - avoid exposing compiler-internal ArchModel as the consumer contract

validation_frequency: on_change
