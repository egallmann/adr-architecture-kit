name: Semantic Core Bootstrap

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build semantic core from Rust source
        run: node scripts/build_semantic_core.mjs
      - name: Upload source-built WASM
        uses: actions/upload-artifact@v4
        with:
          name: semantic-core-wasm-${{ github.sha }}
          path: core/target/wasm32-unknown-unknown/release/adr_kit_semantic_core.wasm
          retention-days: 1
