schema_version: '1.0'
adr_type: logical
id: ADR-L-0011
title: Metadata Schemas and Remediation Ledger Enforcement
status: proposed
created_date: '2026-03-14'
authors:
- adr-architecture-kit
domains:
- governance
- metadata
- migration
- brownfield
tags:
- metadata
- remediation-ledger
- sentinel
- approval
introduces_entities:
- INV-0055
- INV-0056
