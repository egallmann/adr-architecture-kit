# Promote only independently approved retained artifacts; never rebuild.
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_REPOSITORY: ${{ github.repository }}

jobs:
  resolve-bundle:
    name: Resolve and verify approved retained cohort
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      source: ${{ steps.resolve.outputs.source }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      tag: ${{ steps.resolve.outputs.tag }}
      attestation: ${{ steps.verify.outputs.attestation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Record interpreter
        run: python --version
      - name: Install verification dependencies only (never build release payloads)
        run: python -m pip install pydantic PyYAML jsonschema jinja2 click rfc8785 wasmtime
      - name: Resolve successful main-push qualification
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" == "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" ]]
          source="$(git rev-parse HEAD)"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          python scripts/resolve_qualified_release_bundle.py resolve --sha "$source" --workflow release-certification.yml --branch main --event push --artifact-name release-bundle >> "$GITHUB_OUTPUT"
      - name: Download and independently verify approved cohort
        id: verify
        env:
          SOURCE: ${{ steps.resolve.outputs.source }}
          CERTIFICATION: ${{ steps.resolve.outputs.run_id }}
        run: |
          python scripts/release_authority_promotion.py download --bundle release-bundle --source "$SOURCE" --certification-run "$CERTIFICATION"
          python scripts/release_authority_promotion.py verify --bundle release-bundle --source "$SOURCE" --certification-run "$CERTIFICATION" --output promotion-verification.json
          python -c 'import json,os; d=json.load(open("promotion-verification.json")); open(os.environ["GITHUB_OUTPUT"],"a").write("attestation="+d["attestation_digest"]+"\n")'

  publish:
    name: Publish approved retained payloads
    needs: [resolve-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/adr-architecture-kit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-bundle.outputs.source }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Record interpreter
        run: python --version
      - name: Install verification dependencies only (never build release payloads)
        run: python -m pip install pydantic PyYAML jsonschema jinja2 click rfc8785 wasmtime
      - name: Independently re-download and reverify exact promotion evidence
        env:
          SOURCE: ${{ needs.resolve-bundle.outputs.source }}
          CERTIFICATION: ${{ needs.resolve-bundle.outputs.run_id }}
          RELEASE_TAG: ${{ needs.resolve-bundle.outputs.tag }}
          ATTESTATION: ${{ needs.resolve-bundle.outputs.attestation }}
        run: |
          [[ "$RELEASE_TAG" == "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" ]]
          python scripts/release_authority_promotion.py download --bundle release-bundle --source "$SOURCE" --certification-run "$CERTIFICATION"
          python scripts/release_authority_promotion.py verify --bundle release-bundle --source "$SOURCE" --certification-run "$CERTIFICATION" --expected-attestation-digest "$ATTESTATION"
      - name: Publish without rebuilding
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-bundle/python-dist
