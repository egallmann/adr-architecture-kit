schema_version: "1.0"
type: project_metadata

project:
  name: "adr-architecture-kit"
  description: "STE-compliant Python toolkit for machine-verifiable Architecture Decision Records"
  type: library

ownership:
  team: "architecture-systems"
  tech_lead: "@egallmann"

repository:
  url: "github.com/egallmann/adr-architecture-kit"
  primary_branch: "develop"

implementation_identifiers:
  package_name: "adr-kit"
  module_path: "src/adr_kit"

automation:
  auto_merge_allowed: false
  requires_human_review: true
  comfort_level: conservative

development_methodology:
  approach: "test-driven-development"
  testing_framework: "pytest"
  coverage_target: 80
  quality_gates:
    - schema_validation
    - test_suite_passing
    - type_checking
    - linting
    - deprecation_free_runtime
    - dependency_security_audit
    - dependency_freshness_review
  tdd_cycle: "red-green-refactor"
  rationale: |
    TDD is architecturally aligned with STE principles (SYS-2, SYS-4, PRIME-1).
    As a governance tool that validates architecture decisions, provable
    correctness is required. Tests serve as executable specifications.
  authority: "ADR-L-0003 DEC-0005, ADR-P-0003 IMPL-0001"

integrations:
  scm:
    type: github
    required_approvers: ["@egallmann"]

compliance:
  security_level: medium
  data_classification: public
  license: "Apache-2.0"

architecture_documentation:
  adr_directory: "adrs/"
  manifest_path: "adrs/manifest.yaml"
  architecture_namespace: "adr-architecture-kit"
