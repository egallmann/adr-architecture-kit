schema_version: '1.3'
adr_type: logical
id: 019fee89-e615-73a3-8d31-7a4721affae9
title: ADR-to-Prompt Translation for AI Implementation
status: accepted
created_date: '2026-03-08'
authors:
- adr-architecture-kit
modified_date: '2026-03-08'
context: "The ADR Architecture Kit encodes architectural decisions in machine-readable\
  \ YAML\nformat with explicit invariants, capabilities, and component specifications.\
  \ These\nstructured ADRs contain all the information needed to guide AI implementation:\n\
  \n- **Invariants** define constraints (MUST/SHOULD/MAY enforcement levels)\n- **Capabilities**\
  \ define acceptance criteria\n- **Component specifications** define interfaces,\
  \ methods, parameters\n- **Implementation decisions** define technology choices\
  \ and patterns\n- **Testing requirements** define verification strategy\n\nCurrently,\
  \ translating ADRs into implementation prompts for AI agents (CODEX, Cursor,\netc.)\
  \ is a manual process. A human reads the ADR and crafts prompts that capture\nthe\
  \ constraints and specifications.\n\nThis manual translation has several problems:\n\
  1. **Inconsistent**: Different humans extract different information\n2. **Incomplete**:\
  \ Easy to miss invariants or requirements\n3. **Time-consuming**: Requires careful\
  \ reading and synthesis\n4. **Error-prone**: Constraints may be misinterpreted\n\
  5. **Not scalable**: Doesn't scale to 100+ ADRs\n\nSince ADRs are machine-readable,\
  \ we can **automate prompt generation** from ADR\nspecifications. This creates a\
  \ direct pipeline:\n\n```\nADR (machine-readable spec)\n    ↓ parse\nPrompt Translator\n\
  \    ↓ generate\nImplementation Prompt (for AI agent)\n    ↓ execute\nAI Implementation\n\
  \    ↓ validate\nValidation (against original ADR)\n```\n\nThis aligns with STE\
  \ principles:\n- **SYS-2 (Deterministic Cognition)**: Prompts generated deterministically\
  \ from ADRs\n- **PRIME-1 (No Implicit Assumptions)**: All constraints explicit in\
  \ prompt\n- **SYS-4 (Drift Prevention)**: Prompts always match current ADR state\n\
  \nThe prompt translator becomes a **code generator for AI instructions**, ensuring\n\
  AI agents receive complete, accurate specifications.\n"
