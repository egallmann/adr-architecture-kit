technical_brief_metadata:
  document_id: "TECH-BRIEF-2026-03-10"
  title: "ADR Architecture Kit: Conversation Compiler for Executable Architecture"
  purpose: "Technical documentation for AI writers (Composer, GPT-5.4, Claude Sonnet 4.5) to reason over and write about"
  target_audience: "AI writing agents, technical documentation systems, content generation tools"
  last_updated: "2026-03-10"
  version: "1.0"
  
  usage_instructions: |
    This document is optimized for AI reasoning and content generation.
    
    Structure:
    - Core concepts with definitions and examples
    - Code snippets with context
    - Metrics and quantifiable claims
    - Relationships between concepts
    - Use cases with before/after comparisons
    
    When writing about this project:
    - Use the framing provided (conversation compiler, not DSL)
    - Reference specific ADRs by ID (ADR-V-0001, etc.)
    - Include quantifiable metrics (90% cost reduction, 10x faster)
    - Show code examples from this document
    - Emphasize paradigm shift (machine-written, not human-written)

project_overview:
  name: "ADR Architecture Kit"
  tagline: "A conversation compiler that transforms architectural dialogue into executable specifications"
  
  what_it_is:
    primary: "Conversation compiler for architecture"
    not: ["Documentation system", "Architecture DSL", "Schema validator", "Diagramming tool"]
    
  core_value_proposition: |
    Humans describe systems in natural conversation. AI compiles that conversation
    into complete, validated, executable architecture specifications. No YAML writing,
    no syntax learning, no manual documentation.
    
    Input: "I need a user service with JWT authentication"
    Output: Complete ADR with interfaces, algorithms, error handling, testing requirements
    
    The architecture emerges from dialogue, not documents.
  
  paradigm_shift:
    from: "Machine-readable, human-written (humans write YAML)"
    to: "Machine-readable, machine-written, human-designed (AI writes YAML from conversation)"
    
    impact: |
      Eliminates syntax friction. Humans focus on decisions, AI handles structure.
      ADR creation time: 2-4 hours → 15 minutes (90% reduction)

core_concepts:
  overview: |
    The ADR Kit is built on 8 core concepts that work together to enable
    conversational architecture. Each concept addresses a specific challenge
    in traditional architecture documentation and code generation.
  
  concept_1_conversation_compiler:
    definition: "A system that compiles human architectural dialogue into executable specifications"
    
    compilation_pipeline:
      - stage: "Lexical Analysis"
        input: "Human: 'I need a user service with authentication'"
        process: "Extract intent: [user_service, authentication, crud_operations]"
        output: "Intent tokens"
      
      - stage: "Parsing"
        input: "Intent tokens"
        process: "Structure into ADR template (Logical, Physical-System, Physical-Component)"
        output: "Draft ADR (incomplete)"
      
      - stage: "Semantic Analysis"
        input: "Draft ADR"
        process: "Detect gaps: 'Authentication method not specified'"
        output: "Gap list"
      
      - stage: "Optimization"
        input: "Draft ADR + Gaps"
        process: "Watchdog infers: JWT (from context), Node.js (from requirements)"
        output: "Optimized ADR"
      
      - stage: "Code Generation"
        input: "Optimized ADR"
        process: "Generate complete YAML with all fields"
        output: "Complete ADR"
      
      - stage: "Validation"
        input: "Complete ADR"
        process: "Foundation model validates logical consistency"
        output: "Validated ADR (ready for implementation)"
    
    analogy: |
      Traditional compiler: C code → Assembly → Machine code
      Conversation compiler: Human intent → Structured ADRs → AI-executable specs → Generated code
    
    code_example: |
      # Conversation (source code)
      Human: "I need a user service with JWT authentication"
      AI: "What endpoints do you need?"
      Human: "Standard CRUD: GET /users, POST /users, etc."
      AI: "Rate limiting?"
      Human: "100 requests per minute per user"
      
      # Compiled output (ADR-PC-0023)
      id: ADR-PC-0023
      title: "User Service API Component"
      component_specifications:
        - interfaces:
            - type: REST
              endpoints: [GET /users, POST /users, GET /users/:id, ...]
          implementation_requirements:
            authentication:
              method: JWT
              token_expiry: 1 hour
            rate_limiting:
              strategy: Redis
              limit: 100 requests per minute per user
  
  concept_2_three_level_architecture:
    definition: "Logical → Physical-System → Physical-Component hierarchy for separation of concerns"
    
    levels:
      logical:
        id_prefix: "ADR-L"
        purpose: "What the system must be (capabilities, boundaries, contracts)"
        example: "ADR-L-0042: User Management Capability"
        contains: "Capabilities, invariants, quality attributes, success criteria"
        does_not_contain: "Technology choices, implementation details"
      
      physical_system:
        id_prefix: "ADR-PS"
        purpose: "High-level system architecture (components, topology, boundaries)"
        example: "ADR-PS-0012: User Service System"
        contains: "Component topology, integration patterns, system boundaries"
        references: "Multiple Physical-Component ADRs"
      
      physical_component:
        id_prefix: "ADR-PC"
        purpose: "Executable specification for AI code generation"
        example: "ADR-PC-0023: User Service API Component"
        contains: "Complete interfaces, algorithms, error handling, testing requirements"
        completeness_rule: "If AI needs clarification during generation, ADR is incomplete"
    
    granularity_rules:
      physical_component: |
        One PC ADR per independently deployable/testable unit.
        Typical systems: 2-8 PC ADRs per Physical-System.
        >10 PC ADRs requires justification (prevent picoservices).
        
        Good: User API (ADR-PC-0023), User DB (ADR-PC-0024), User Events (ADR-PC-0025)
        Bad: GET /users endpoint (too fine), Password hash function (implementation detail)
    
    code_example: |
      # Logical ADR (ADR-L-0042)
      capability:
        name: "User Management"
        description: "System must manage user lifecycle"
      
      # Physical-System ADR (ADR-PS-0012)
      component_topology:
        components: [ADR-PC-0023, ADR-PC-0024, ADR-PC-0025]
        connections:
          - from: ADR-PC-0023
            to: ADR-PC-0024
            type: database_query
      
      # Physical-Component ADR (ADR-PC-0023)
      component_specifications:
        interfaces:
          - type: REST
            specification: |
              GET /users → List users
              POST /users → Create user
        implementation_requirements:
          algorithms:
            - name: "Password Hashing"
              specification: "bcrypt, cost factor 12"
  
  concept_3_agent_tier_system:
    definition: "Three-tier architecture for cost-optimized AI agents"
    
    tiers:
      tier_1:
        name: "Rule-Based Agents"
        technology: "No LLM, pure deterministic logic"
        cost: "$0 (no API calls)"
        speed: "10-50ms"
        accuracy: "100% (deterministic)"
        use_cases: ["Schema validation", "Naming conventions", "Coverage checks"]
        example: "Validate ADR ID matches type (ADR-PC-XXXX for physical-component)"
      
      tier_2:
        name: "Local LLM Agents"
        technology: "7B-13B parameter models (Llama, Mistral, Qwen)"
        cost: "~$0 (local inference, one-time hardware cost)"
        speed: "1-2s"
        accuracy: "80-90%"
        use_cases: ["ADR generation", "Code review", "Test generation"]
        example: "Interview human to fill ADR template"
      
      tier_3:
        name: "Foundation Model Agents"
        technology: "GPT-4, Claude, o1"
        cost: "$$$$ ($0.03-0.10 per 1K tokens)"
        speed: "5-10s"
        accuracy: "95%+"
        use_cases: ["Complex reasoning", "Validation", "Meta-optimization"]
        example: "Validate ADR for logical consistency"
    
    cost_optimization_example:
      scenario: "Validate 1000 ADRs"
      
      tier_3_only:
        cost: "$100 ($0.10 per ADR)"
        time: "2.8 hours (10s per ADR)"
      
      multi_tier:
        tier_1: "700 ADRs, $0, 35s total (schema validation)"
        tier_2: "250 ADRs, $0, 500s total (logic validation)"
        tier_3: "50 ADRs, $5, 500s total (complex validation)"
        total_cost: "$5"
        total_time: "17 minutes"
      
      savings: "95% cost reduction, 90% time reduction"
    
    meta_optimization_progression:
      week_1: "100% tier 3 (foundation model does everything)"
      week_4: "70% tier 3, 30% tier 2 (local model handles interviews)"
      week_12: "40% tier 3, 40% tier 2, 20% tier 1 (rules handle validation)"
      week_24: "10% tier 3, 30% tier 2, 60% tier 1 (mostly automated)"
      
      insight: "Foundation model automates itself out of 99% of tasks"
  
  concept_4_composable_architecture:
    definition: "Interface preservation enables technology migration without system rewrites"
    
    pattern: "Create new Physical-Component ADR that supersedes old, preserving interface contract"
    
    migration_example:
      original:
        id: "ADR-PC-0023"
        title: "User Service API (Node.js)"
        technology: "Node.js + Express"
        interface: "REST API: GET /users, POST /users, etc."
      
      new:
        id: "ADR-PC-0087"
        title: "User Service API (Rust)"
        technology: "Rust + Axum"
        interface: "REST API: GET /users, POST /users, etc. (IDENTICAL)"
        supersedes: "ADR-PC-0023"
        interface_compatibility:
          contract_preservation: true
          breaking_changes: []
      
      deployment: "Deploy ADR-PC-0087 alongside ADR-PC-0023, route traffic gradually, deprecate old"
      
      metrics:
        traditional_rewrite: "12-18 months, high risk, $500K-1M"
        composable_migration: "4 weeks per component, low risk, $20K-40K"
        improvement: "12x faster, 10x cheaper, 95% less risk"
    
    code_example: |
      # ADR-PC-0087: Rust implementation
      interface_compatibility:
        supersedes_adr: ADR-PC-0023
        contract_preservation: true
        breaking_changes: []
        migration_strategy: strangler_fig
      
      component_specifications:
        interfaces:
          - name: "User API"
            type: REST
            endpoints:
              - "GET /users (same as ADR-PC-0023)"
              - "POST /users (same as ADR-PC-0023)"
            compatibility: "100% compatible with ADR-PC-0023"
  
  concept_5_self_evolving_infrastructure:
    definition: "Shared libraries automatically updated based on signals within tolerance boundaries"
    
    example_scenario:
      signal: "Log analytics requires trace_id field for distributed tracing"
      
      traditional_approach:
        steps:
          - "Infra team updates logging library (1 day)"
          - "Create 50 PRs to update services (2 days)"
          - "50 code reviews (1 week)"
          - "50 deployments (2 weeks)"
        total_time: "3-4 weeks"
      
      self_evolving_approach:
        steps:
          - "Log analytics sends signal: 'need trace_id'"
          - "Watchdog agent analyzes: 'Logging library needs trace_id field'"
          - "Watchdog designs: 'Add optional trace_id to log context'"
          - "Watchdog validates: 'Non-breaking, tests pass, invariants preserved'"
          - "Watchdog deploys: 'Auto-deploy to all 50 services'"
        total_time: "24 hours"
      
      improvement: "10x faster, 0 human effort, 100% consistent"
    
    tolerance_configuration:
      auto_deploy: "Non-breaking changes + tests pass + invariants preserved"
      human_review: "Breaking changes, migration plan required"
      security_review: "Security-critical changes (auth, encryption, access control)"
    
    code_example: |
      # Tolerance configuration (PROJECT.yaml)
      tolerance_rules:
        non_breaking_changes:
          action: auto_deploy
          examples: ["Add optional field", "Add new method", "Improve performance"]
        
        breaking_changes:
          action: human_review_required
          examples: ["Remove method", "Change signature", "Change behavior"]
        
        security_changes:
          action: security_team_review_required
          examples: ["Authentication logic", "Encryption", "Access control"]
  
  concept_6_legacy_import_agent:
    definition: "AI reverse engineers existing systems into ADRs through trust-first validation"
    
    fast_path_to_adoption:
      problem: "Organizations have existing systems without ADRs (10+ years of code)"
      barrier: "Manual documentation takes 40 hours per system (too painful)"
      solution: "AI automates reverse engineering, reduces to 2 hours (95% reduction)"
      impact: "Fast path to ADR-system compatibility → unlock all other capabilities"
    
    trust_first_strategy:
      principle: "Assume professionals wrote good code, validate only risky/non-compliant"
      
      classification:
        safe_and_compliant: "90% of code (auto-accept with 95% confidence)"
        risky_or_non_compliant: "10% of code (targeted human validation)"
      
      validation_modes:
        validation: "Human corrects or confirms (for risky code)"
        acceptance_with_why: "Human accepts and provides rationale (for exceptions)"
        simple_acknowledgement: "Human acknowledges (for safe code)"
    
    workflow_example:
      step_1:
        action: "RECON scans code"
        output: "5 components, 20 endpoints, 3 databases"
        confidence: "62%"
        time: "5 minutes"
      
      step_2:
        action: "AI infers design"
        output: "3 Logical ADRs, 1 Physical-System ADR, 5 Physical-Component ADRs"
        confidence: "70%"
        time: "10 minutes"
      
      step_3:
        action: "AI classifies findings"
        output: "80% safe/compliant (auto-accept), 15% non-compliant, 5% risky"
        time: "5 minutes"
      
      step_4:
        action: "AI validates with human"
        conversations:
          - "80% auto-accepted: 'Standard REST APIs, proper error handling'"
          - "15% validated: 'JWT uses HS256, policy requires RS256' → Human: 'Accept, internal service'"
          - "5% validated: 'SQL query without parameterization' → Human: 'Reject, that's a bug'"
        time: "1 hour"
      
      step_5:
        action: "AI refines ADRs"
        output: "Complete ADRs with 95%+ confidence"
        time: "10 minutes"
      
      total_time: "1-2 hours (vs 40 hours manual)"
    
    adoption_acceleration:
      insight: "Legacy Import Agent is the fast path to ecosystem adoption"
      
      without_agent:
        barrier: "40 hours to document existing system"
        result: "Organizations don't adopt (too much work)"
      
      with_agent:
        barrier: "2 hours to onboard existing system"
        result: "Organizations adopt quickly (low friction)"
      
      network_effect: |
        More adoptions → More systems in ADR format → More value from other capabilities
        (composable architecture, compliance automation, provider ecosystem)
        
        Legacy Import Agent is the "on-ramp" to the entire ecosystem.
    
    code_example: |
      # AI-generated ADR from legacy code
      id: ADR-PC-0042
      title: "User Service API (Reverse Engineered)"
      
      extraction_metadata:
        source: "Legacy codebase (10 years old)"
        extraction_date: "2026-03-10"
        confidence: 95%
        validation_method: "trust-first (90% auto-accepted, 10% validated)"
      
      component_specifications:
        interfaces:
          - type: REST
            specification: |
              # Extracted from code
              GET /users
              POST /users
              GET /users/:id
        
        implementation_requirements:
          algorithms:
            - name: "Password Hashing"
              specification: "bcrypt, cost factor 12"
              confidence: 100%
              source: "Extracted from auth.py line 42"
  
  concept_7_ste_semantic_graph:
    definition: "Bi-directional boundary tree that converges on relevant subgraph for consistently rich context"
    
    why_this_is_the_graph_database: |
      The STE semantic graph IS the graph database for ADR Kit.
      It's not "good enough" - it's purpose-built for this exact use case.
    
    slice_architecture_foundation:
      insight: |
        RECON extracts both ADRs and code into slices (semantic entities).
        Code decorators create explicit edges between ADR slices and code slices.
        
        This is how the decorator idea emerged: We needed explicit, extractable
        edges to build a bidirectional graph between architecture and code.
      
      adr_slices:
        - "ADR metadata slice (id, title, status)"
        - "Component specification slice (interfaces, requirements)"
        - "Interface slice (endpoints, contracts)"
        - "Relationship slice (implements, references, supersedes)"
      
      code_slices:
        - "Function slice (signature, parameters, dependencies)"
        - "Class slice (methods, properties, inheritance)"
        - "Module slice (imports, exports, structure)"
      
      decorator_edges:
        - "@adr_implements → Creates 'implements' edge (code → ADR component)"
        - "@adr_invariant → Creates 'enforces' edge (code → invariant)"
        - "@adr_algorithm → Creates 'uses_algorithm' edge (code → algorithm spec)"
      
      graph_structure: |
        ADR Slice (ADR-PC-0042)
              ↓ [contains]
        Component Slice (COMP-0001)
              ↓ [contains]
        Interface Slice (IFACE-0001)
              ↑ [implements] ← EXPLICIT EDGE FROM DECORATOR
        Code Slice (authenticate_user function)
              ↓ [enforces] ← EXPLICIT EDGE FROM DECORATOR
        Invariant Slice (INV-001)
      
      bidirectional_queries:
        forward: "ADR → Code (what code implements this ADR?)"
        backward: "Code → ADR (why does this code exist?)"
        
        example: |
          Query: "Find all code that implements ADR-PC-0042"
          Graph: ADR-PC-0042 → [implements edges] → code slices
          Result: [authenticate_user(), create_user(), get_user()]
          Time: <100ms
      
      why_decorators_are_essential: |
        Without decorators: ADR-to-code links are implicit (must infer)
        With decorators: ADR-to-code links are explicit (RECON extracts them)
        
        Decorators are not comments. They are extractable graph edges.
        
        This solves the "missing intent primitive" - code now explicitly
        declares why it exists and which architectural decisions it implements.
    
    architecture:
      type: "Bi-directional boundary tree"
      traversal: "From insertion point, traverse upstream (dependencies) and downstream (dependents)"
      convergence: "Stop at natural boundaries (system boundaries, interface contracts)"
      result: "Relevant subgraph without noise or missing pieces"
    
    key_properties:
      property_1:
        name: "Subgraph assembly (not point queries)"
        description: "Returns complete context in one query, not individual lookups"
        example: |
          Traditional graph DB: "Find ADR-PC-0042" → Returns one node
          STE graph: "Context for ADR-PC-0042" → Returns 45-node subgraph
      
      property_2:
        name: "Boundary-aware traversal"
        description: "Knows when to stop (interface boundaries, system boundaries)"
        example: |
          Query: "Context for user-service"
          Returns: User service + its dependencies
          Stops at: Database interface (boundary), Auth service interface (boundary)
          Doesn't return: Entire database internals, entire auth service internals
      
      property_3:
        name: "Bi-directional relationships"
        description: "Traverse both directions (what I depend on, what depends on me)"
        example: |
          Upstream: ADR-PC-0042 → ADR-PS-0012 → ADR-L-0042
          Downstream: ADR-PC-0042 → src/api/user.py → tests/test_user.py
      
      property_4:
        name: "Consistently rich context"
        description: "Same query always returns complete context (deterministic)"
        example: |
          Query 1: "Context for ADR-PC-0042" → 45 nodes
          Query 2: "Context for ADR-PC-0042" → 45 nodes (identical)
          No LLM hallucination, no missing pieces, no noise
    
    performance:
      query_time: "<100ms for complete subgraph assembly"
      comparison:
        grep_approach: "Minutes (grep → read files → grep dependencies → repeat)"
        ste_graph: "<100ms (one query, complete subgraph)"
        improvement: "100x faster"
    
    vs_alternatives:
      vs_neo4j:
        neo4j: "General-purpose graph DB, optimized for point queries"
        ste: "Purpose-built for AI context assembly, optimized for subgraph assembly"
        advantage: "STE knows what 'relevant context' means for AI tasks"
      
      vs_lsp:
        lsp: "Per-file semantic analysis, request-response model"
        ste: "Cross-project semantic graph, bulk subgraph assembly"
        advantage: "STE provides complete context, not just definitions/references"
      
      vs_embeddings:
        embeddings: "Similarity search (fuzzy, probabilistic)"
        ste: "Explicit relationships (precise, deterministic)"
        advantage: "STE returns exact dependencies, not 'similar' code"
      
      vs_traditional_code_indexers:
        indexers: "Build semantic graphs for code navigation (Sourcegraph, Kythe)"
        ste: "Build semantic graphs for AI context assembly"
        advantage: "STE optimizes for LLM context windows, not human navigation"
    
    adr_kit_integration:
      step_1:
        action: "Human conversation → AI generates ADR YAML"
        storage: "YAML file in adrs/logical/ or adrs/physical-component/"
      
      step_2:
        action: "RECON extracts ADR into semantic graph"
        entities: "ADR metadata, components, interfaces, invariants, relationships"
      
      step_3:
        action: "AI queries graph for context"
        query: "context ADR-PC-0042"
        returns: "Complete subgraph (ADR + dependencies + code + tests)"
      
      step_4:
        action: "AI reasons over subgraph"
        input: "Structured graph (45 nodes with relationships)"
        output: "Generated code, validation results, compliance checks"
      
      step_5:
        action: "Code links back to ADR via decorators"
        decorator: "@adr_implements('ADR-PC-0042')"
        extraction: "RECON extracts decorator → Adds edge to graph"
    
    example_queries:
      query_1:
        natural_language: "What does the user service depend on?"
        graph_query: "context user-service --direction upstream"
        returns: "ADR-PS-0012, ADR-L-0042, database component, auth service"
        time: "<100ms"
      
      query_2:
        natural_language: "What would break if I change ADR-PC-0042?"
        graph_query: "context ADR-PC-0042 --direction downstream"
        returns: "src/api/user.py, tests/test_user.py, ADR-PC-0087 (supersedes)"
        time: "<100ms"
      
      query_3:
        natural_language: "Show me all code that implements security invariants"
        graph_query: "search_semantic_graph --query 'security invariants'"
        returns: "All @adr_invariant decorators with security tag"
        time: "<100ms"
    
    code_example: |
      # TypeScript API (programmatic access)
      import { RSSContext } from 'ste-runtime';
      
      const rss = await RSSContext.initialize('.ste/state');
      
      // ONE-SHOT: Get complete subgraph for ADR
      const context = await rss.context('ADR-PC-0042', { depth: 2 });
      
      // context.nodes contains full subgraph:
      // - ADR-PC-0042 (Physical-Component ADR)
      // - ADR-PS-0012 (Physical-System it implements)
      // - ADR-L-0042 (Logical capability)
      // - Dependencies (database, auth)
      // - Code (src/api/user.py)
      // - Tests (tests/test_user.py)
      // - Invariants (INV-001, INV-002)
      
      // Time: <100ms (vs minutes of grep)
    
    why_this_is_perfect_for_adr_kit:
      reason_1: "ADRs are naturally graph-structured (implements, references, supersedes)"
      reason_2: "AI needs complete context (not point queries)"
      reason_3: "Boundary-aware traversal matches architectural boundaries"
      reason_4: "Bi-directional relationships match ADR relationships"
      reason_5: "Deterministic subgraphs ensure consistent AI reasoning"
      reason_6: "Already integrated with ste-runtime (RECON + RSS)"
      
      conclusion: |
        The STE semantic graph is not just "good enough" - it's the ideal
        graph database for ADR Kit. It's purpose-built for AI context assembly,
        boundary-aware, bi-directional, and deterministic.
        
        ADR YAML is the "source code" (human-readable, git-tracked).
        STE semantic graph is the "compiled form" (machine-optimized, queryable).
        
        You don't read assembly to understand C code.
        AI doesn't read YAML to understand architecture - it queries the graph.
  
  concept_8_provider_ecosystem:
    definition: "Marketplace for specialized providers to submit ADR-compliant proposals"
    
    value_proposition:
      for_organizations: "Access specialized expertise (security, testing, performance) with standardized proposals"
      for_providers: "Standard integration works for all ADR Kit customers, faster acceptance"
    
    workflow:
      step_1:
        actor: "Organization"
        action: "Requests scan: 'StackHawk, scan user-service for vulnerabilities'"
        note: "Organization controls scanning (permissions, triggers)"
      
      step_2:
        actor: "StackHawk"
        action: "Scans code, finds JWT vulnerability (token expiry too long)"
        output: "Security analysis"
      
      step_3:
        actor: "StackHawk"
        action: "Generates ADR-compliant proposal"
        output: |
          Proposal includes:
          - Analysis: "Token expiry 20 min, should be 15 min"
          - ADR changes: Update ADR-PC-0042 token_expiry field
          - Code changes: Update config to 15 minutes
          - Migration plan: Deploy immediately, no breaking change
          - Cryptographic signatures: Section-level + master
      
      step_4:
        actor: "Organization"
        action: "Receives proposal, verifies signatures, validates content"
        automated_checks:
          - "Signature verification (Layer 1)"
          - "Static analysis (Layer 2)"
          - "Sandbox testing (Layer 3)"
          - "Policy compliance (Layer 3)"
          - "Risk assessment (Layer 4)"
      
      step_5:
        actor: "Security team"
        action: "Reviews high-confidence proposal (1 day)"
        decision: "Approved"
      
      step_6:
        actor: "System"
        action: "Deploys fix via canary (1% → 10% → 50% → 100%)"
        monitoring: "Error rate, latency, security metrics"
      
      total_time: "1 day (vs 1-2 weeks manual)"
    
    security_model:
      critical_distinction: |
        **Signatures are AUTHENTICATION, not AUTHORIZATION.**
        
        - Authentication: "This came from StackHawk" (signatures prove this)
        - Authorization: "This is a good idea" (reasoning proves this)
        
        Signatures get you in the door. They don't guarantee approval.
      
      layer_1: "Cryptographic signatures (authentication: who sent this?)"
      layer_2: "Content validation (authorization: is this correct/safe/compliant?)"
      layer_3: "Behavioral validation (sandbox testing, monitoring)"
      layer_4: "Trust management (reputation, track record)"
      layer_5: "Deployment validation (canary, gradual rollout)"
      layer_6: "Human oversight (risk-based review, audits)"
      
      example_rejection_despite_valid_signatures:
        scenario: "StackHawk submits proposal with valid signatures"
        proposal: "Set JWT token expiry to 5 seconds"
        signatures: "Valid ✅ (authenticated)"
        reasoning: "REJECTS ❌ (5 seconds breaks UX, violates policy)"
        result: "Valid signatures, rejected proposal"
        
        workflow: |
          1. Verify signatures → PASS (authenticated)
          2. Evaluate reasoning → FAIL (incorrect change)
          3. Result: REJECTED
          4. Notification: "Proposal rejected: Token expiry too short"
      
      supply_chain_protection: |
        Even if provider key is compromised, attack must bypass all 6 layers.
        
        Signatures prevent tampering but not:
        - Bad reasoning (incorrect proposals)
        - Key compromise (attacker signs malicious code)
        - Malicious providers (trusted provider goes rogue)
        
        Defense in depth is essential. Both gates must pass:
        - Gate 1: Authentication (valid signatures)
        - Gate 2: Authorization (correct reasoning)
    
    code_example: |
      # Provider proposal structure
      {
        "proposal_id": "PROP-2026-03-10-001",
        "provider_id": "stackhawk",
        "proposal_type": "security_fix",
        
        "analysis": {
          "issue": "JWT token expiry too long",
          "severity": "medium",
          "impact": "Increased session hijacking risk"
        },
        
        "adr_changes": [{
          "adr_id": "ADR-PC-0042",
          "field": "implementation_requirements.authentication.token_expiry",
          "old_value": "20 minutes",
          "new_value": "15 minutes",
          "rationale": "Comply with SEC-001 policy"
        }],
        
        "code_changes": [{
          "file": "config/auth.py",
          "change": "TOKEN_EXPIRY_MINUTES = 15  # Was 20"
        }],
        
        "signatures": {
          "section_signatures": [...],
          "master_signature": {...}
        }
      }

