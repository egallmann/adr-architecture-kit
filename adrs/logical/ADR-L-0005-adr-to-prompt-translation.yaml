gaps:
- id: GAP-0002
  question: Prompt template design needed
  context: 'Classification: real gap. Prompt generation exists architecturally, but
    the production prompt-template set is not implemented in this repo yet.'
  impact: medium
  blocking: false
- id: GAP-0003
  question: Agent-specific formatters need definition
  context: 'Classification: deferred gap. Core prompt generation can proceed before
    per-agent optimizations are added.'
  impact: medium
  blocking: false
- id: GAP-0004
  question: Integration with CI/CD for automated implementation
  context: 'Classification: deferred gap. This is downstream workflow automation,
    not a blocker for the architecture-index subsystem.'
  impact: medium
  blocking: false
notes: |
  This capability transforms ADRs from passive documentation into **active
  specifications** that directly drive AI implementation.

  The prompt translator is itself a component that should be:
  - Specified in a Physical ADR (ADR-P-0004 or ADR-P-0005)
  - Implemented following TDD methodology (ADR-L-0003)
  - Annotated with decorators (ADR-L-0004)
  - Tested comprehensively

  Future enhancement: Integrate with Rules & Signal Service to generate
  enforcement rules alongside implementation prompts, creating a complete
  "specification → implementation → verification" pipeline.

  Example workflow:
  ```bash
  # Generate prompts from Physical ADR
  adr generate-prompts ADR-P-0003 --target codex --output prompts/

  # Generates:
  # - prompts/COMP-0001-scope-resolver.md
  # - prompts/COMP-0002-manifest-generator.md
  # - prompts/COMP-0003-validator.md
  # - prompts/COMP-0004-cli.md
  # - prompts/validation-checklist.md

  # Hand to CODEX for implementation
  # CODEX implements following prompts

  # Validate implementation
  adr validate-implementation ADR-P-0003 --checklist prompts/validation-checklist.md
  ```

  This creates a **closed-loop system** where ADRs drive implementation and
  validation automatically.
